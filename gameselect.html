<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="あそびば">
<meta name="theme-color" content="#bfe9ff">
<title>ゲームを えらぼう</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: linear-gradient(180deg, #bfe9ff 0%, #e8f7ff 50%, #ffe6f2 100%);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #3d3355;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    gap: clamp(14px, 3vh, 28px);
  }
  h1 {
    margin: 0; font-size: clamp(36px, 6.5vw, 64px); color: #ff6fa0; letter-spacing: .06em;
    text-shadow: 0 4px 0 #fff;
  }
  .games {
    display: grid; gap: clamp(14px, 2.5vw, 26px); width: 100%; max-width: 1100px;
    grid-template-columns: repeat(3, 1fr);
  }
  @media (orientation: portrait), (max-width: 700px) {
    .games { grid-template-columns: 1fr; max-width: 560px; }
    .game { flex-direction: row !important; text-align: left !important; }
    .game .thumb { width: 44% !important; flex: none; }
    .game .body { padding: 14px 18px 14px 4px !important; }
  }
  .game {
    display: flex; flex-direction: column; text-align: center;
    background: #fff; border-radius: 34px; overflow: hidden;
    text-decoration: none; color: inherit;
    border: 6px solid var(--c);
    box-shadow: 0 10px 0 var(--d);
    transition: transform .08s;
  }
  .game:active { transform: translateY(8px); box-shadow: 0 2px 0 var(--d); }
  .game .thumb { width: 100%; aspect-ratio: 4 / 3; background: var(--bg); display: block; }
  .game .body { padding: 14px 16px 20px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .game .name { font-size: clamp(24px, 3.4vw, 34px); font-weight: bold; color: var(--d); }
  .game .desc { font-size: clamp(16px, 2.1vw, 21px); line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
  .game .name { word-break: keep-all; }
  .game .stars { font-size: clamp(16px, 2vw, 20px); color: #ffb000; letter-spacing: .1em; }
  .game .note { font-size: clamp(12px, 1.5vw, 15px); color: #8a93b0; }
  .g1 { --c: #ff8fb5; --d: #e0578a; --bg: #fff0f6; }
  .g2 { --c: #ffb46b; --d: #e07d1e; --bg: #fff5e8; }
  .g3 { --c: #79b2ff; --d: #2f6fd1; --bg: #eaf3ff; }
</style>
</head>
<body>
<main>
  <h1>どれで あそぶ？</h1>
  <div class="games">
    <a class="game g1" href="puzzle/">
      <canvas class="thumb" id="th1"></canvas>
      <div class="body">
        <div class="name">まるまるドロップ</div>
        <div class="desc">おなじ いろを 4つ くっつけて けそう！</div>
        <div class="stars">★☆☆</div>
      </div>
    </a>
    <a class="game g2" href="soccer/">
      <canvas class="thumb" id="th2"></canvas>
      <div class="body">
        <div class="name">ブンブンサッカー</div>
        <div class="desc">くるまで ボールを おして ゴール！</div>
        <div class="stars">★★☆</div>
      </div>
    </a>
    <a class="game g3" href="soccer3d/">
      <canvas class="thumb" id="th3"></canvas>
      <div class="body">
        <div class="name">ブンブンサッカー3D</div>
        <div class="desc">パトカーや しょうぼうしゃで かべも てんじょうも！</div>
        <div class="stars">★★★</div>
        <div class="note">インターネットに つないで あそんでね</div>
      </div>
    </a>
  </div>
</main>

<script>
(() => {
  'use strict';
  const W = 400, H = 300;
  function setup(id) {
    const cv = document.getElementById(id), dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr;
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    return c;
  }
  const rr = (c, x, y, w, h, r) => {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  };

  // --- まる ---
  const BLOB = [
    { base: '#ff5a6e', light: '#ffc2ca', dark: '#c9304a' },
    { base: '#4da3ff', light: '#c4e1ff', dark: '#2a6fc9' },
    { base: '#4cd964', light: '#c9f5d1', dark: '#2a9e3e' },
    { base: '#ffcc33', light: '#fff0b8', dark: '#d19a00' },
  ];
  function blob(c, x, y, r, ci, happy) {
    const col = BLOB[ci];
    const g = c.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r * 1.05);
    g.addColorStop(0, col.light); g.addColorStop(.5, col.base); g.addColorStop(1, col.dark);
    c.fillStyle = g; c.beginPath(); c.ellipse(x, y, r, r * .94, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(255,255,255,.6)';
    c.beginPath(); c.ellipse(x - r * .4, y - r * .48, r * .22, r * .13, -.6, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(255,120,150,.35)';
    c.beginPath(); c.ellipse(x - r * .52, y + r * .22, r * .14, r * .09, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(x + r * .52, y + r * .22, r * .14, r * .09, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = c.fillStyle = '#3a2a40'; c.lineCap = 'round';
    if (happy) {
      c.lineWidth = r * .11;
      for (const s of [-1, 1]) { c.beginPath(); c.arc(x + s * r * .3, y, r * .13, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); }
    } else {
      for (const s of [-1, 1]) {
        c.fillStyle = '#3a2a40'; c.beginPath(); c.ellipse(x + s * r * .28, y - r * .04, r * .1, r * .14, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#fff'; c.beginPath(); c.arc(x + s * r * .28 - r * .03, y - r * .1, r * .04, 0, Math.PI * 2); c.fill();
      }
    }
    c.lineWidth = r * .08; c.beginPath(); c.arc(x, y + r * .18, r * .14, Math.PI * .15, Math.PI * .85); c.stroke();
  }

  // --- くるま（よこ） ---
  function car(c, x, y, s, flip, body, dark, flame) {
    c.save(); c.translate(x, y); c.scale(s * (flip ? -1 : 1), s);
    if (flame) {
      c.fillStyle = '#ff6a3d'; c.beginPath(); c.moveTo(-50, -12); c.lineTo(-100, -2); c.lineTo(-50, 8); c.fill();
      c.fillStyle = '#ffe066'; c.beginPath(); c.moveTo(-50, -7); c.lineTo(-78, -2); c.lineTo(-50, 3); c.fill();
    }
    c.fillStyle = dark; rr(c, -54, -30, 12, 18, 4); c.fill();
    c.fillStyle = body;
    c.beginPath(); c.moveTo(-36, -12); c.lineTo(-24, -36); c.quadraticCurveTo(-4, -40, 14, -36); c.lineTo(30, -12); c.closePath(); c.fill();
    c.fillStyle = '#bfe6ff';
    c.beginPath(); c.moveTo(-28, -15); c.lineTo(-20, -31); c.lineTo(10, -31); c.lineTo(22, -15); c.closePath(); c.fill();
    c.fillStyle = body; rr(c, -52, -16, 104, 28, 12); c.fill();
    c.fillStyle = 'rgba(255,255,255,.85)'; rr(c, -40, -6, 70, 6, 3); c.fill();
    c.fillStyle = '#fff6b0'; c.beginPath(); c.arc(46, -6, 5.5, 0, Math.PI * 2); c.fill();
    for (const wx of [-30, 32]) {
      c.fillStyle = '#2f2a3a'; c.beginPath(); c.arc(wx, 12, 14, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#c9cfdd'; c.beginPath(); c.arc(wx, 12, 7, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }

  // --- ボール ---
  function ball(c, x, y, r) {
    c.save(); c.translate(x, y);
    const g = c.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r);
    g.addColorStop(0, '#fff'); g.addColorStop(1, '#dde3ee');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
    c.save(); c.clip(); c.fillStyle = '#3d3355';
    const pent = (px, py, pr, a) => { c.beginPath(); for (let i = 0; i < 5; i++) { const t = a + i * Math.PI * 2 / 5; c.lineTo(px + Math.cos(t) * pr, py + Math.sin(t) * pr); } c.closePath(); c.fill(); };
    pent(0, 0, r * .28, -Math.PI / 2);
    for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 5 + Math.PI / 5; pent(Math.cos(a) * r * .82, Math.sin(a) * r * .82, r * .24, a + Math.PI); }
    c.restore();
    c.strokeStyle = '#3d3355'; c.lineWidth = r * .07; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke();
    c.restore();
  }

  // 1. まるまるドロップ
  {
    const c = setup('th1');
    c.fillStyle = 'rgba(255,255,255,.9)'; rr(c, 110, 18, 180, 270, 22); c.fill();
    c.fillStyle = 'rgba(170,205,255,.25)';
    for (let i = 0; i < 6; i += 2) c.fillRect(110 + i * 30, 18, 30, 270);
    const cell = 30, ox = 110, oy = 18;
    const g = [
      [null, null, null, null, null, null], [null, null, null, null, null, null],
      [null, null, null, null, null, null], [null, null, null, null, null, null],
      [null, null, 1, null, null, null], [null, null, 1, null, null, null],
      [null, null, null, null, null, null], [3, null, null, null, null, 2],
      [3, 0, null, null, 2, 2], [1, 0, 0, 3, 3, 2], [1, 1, 0, 0, 3, 2],
    ];
    for (let r = 0; r < g.length; r++) for (let k = 0; k < 6; k++) {
      if (g[r][k] == null) continue;
      blob(c, ox + k * cell + cell / 2, oy + (r - 1) * cell + cell / 2 + 40, cell * .46, g[r][k], (r + k) % 3 === 0);
    }
    blob(c, 58, 130, 34, 3, true);
    blob(c, 344, 190, 30, 0, false);
    c.fillStyle = '#ffd23f';
    for (const [sx, sy, s] of [[52, 60, 12], [348, 92, 15], [62, 230, 10], [340, 262, 11]]) {
      c.save(); c.translate(sx, sy); c.beginPath();
      for (let i = 0; i < 10; i++) { const rad = i % 2 ? s * .45 : s, a = i * Math.PI / 5 - Math.PI / 2; c.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
      c.closePath(); c.fill(); c.restore();
    }
  }

  // 2. ブンブンサッカー（よこから）
  {
    const c = setup('th2');
    rr(c, 30, 30, 340, 240, 60);
    const bg = c.createLinearGradient(0, 30, 0, 270);
    bg.addColorStop(0, '#eaf7ff'); bg.addColorStop(1, '#fbfff2');
    c.fillStyle = bg; c.fill();
    c.save(); c.clip(); c.fillStyle = '#9be27a'; c.fillRect(30, 252, 340, 20); c.restore();
    rr(c, 30, 30, 340, 240, 60); c.strokeStyle = '#5b6fd6'; c.lineWidth = 8; c.stroke();
    for (const [x, col] of [[2, '#3d8bff'], [370, '#ff9f43']]) {
      c.fillStyle = '#fff'; c.fillRect(x, 140, 28, 70);
      c.globalAlpha = .3; c.fillStyle = col; c.fillRect(x, 140, 28, 70); c.globalAlpha = 1;
      c.strokeStyle = col; c.lineWidth = 5; c.strokeRect(x, 140, 28, 70);
    }
    // かべを のぼる くるま
    c.save(); c.translate(352, 120); c.rotate(-Math.PI / 2); car(c, 0, 0, .55, false, '#38c172', '#23894f', false); c.restore();
    car(c, 150, 238, .75, false, '#ff5a5f', '#c73a40', true);
    ball(c, 250, 200, 34);
    c.strokeStyle = 'rgba(61,139,255,.5)'; c.lineWidth = 4; c.setLineDash([8, 8]);
    c.beginPath(); c.moveTo(325, 240); c.quadraticCurveTo(355, 235, 352, 175); c.stroke(); c.setLineDash([]);
  }

  // 3. ブンブンサッカー3D（なかから みた アリーナ）
  {
    const c = setup('th3');
    // てんじょう・かべ
    c.fillStyle = '#dcecff'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#b9dcff';
    c.beginPath(); c.moveTo(0, 0); c.lineTo(120, 70); c.lineTo(120, 170); c.lineTo(0, 230); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(W, 0); c.lineTo(280, 70); c.lineTo(280, 170); c.lineTo(W, 230); c.closePath(); c.fill();
    c.fillStyle = '#a9c6ff'; c.fillRect(120, 70, 160, 100);
    // ゆか
    const fl = c.createLinearGradient(0, 170, 0, H);
    fl.addColorStop(0, '#9fe27c'); fl.addColorStop(1, '#c9f5ae');
    c.fillStyle = fl;
    c.beginPath(); c.moveTo(120, 170); c.lineTo(280, 170); c.lineTo(W, 230); c.lineTo(W, H); c.lineTo(0, H); c.lineTo(0, 230); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 4;
    c.beginPath(); c.ellipse(200, 222, 90, 20, 0, 0, Math.PI * 2); c.stroke();
    // ゴール
    c.fillStyle = 'rgba(61,139,255,.25)'; c.fillRect(165, 132, 70, 38);
    c.strokeStyle = '#3d8bff'; c.lineWidth = 5; c.strokeRect(165, 132, 70, 38);
    c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 1.5;
    for (let x = 175; x < 235; x += 10) { c.beginPath(); c.moveTo(x, 132); c.lineTo(x, 170); c.stroke(); }
    for (let y = 142; y < 170; y += 10) { c.beginPath(); c.moveTo(165, y); c.lineTo(235, y); c.stroke(); }
    // ボールと しるし
    c.fillStyle = 'rgba(0,0,0,.12)'; c.beginPath(); c.ellipse(212, 214, 26, 7, 0, 0, Math.PI * 2); c.fill();
    ball(c, 212, 150, 28);
    c.fillStyle = '#ffd23f'; c.beginPath(); c.moveTo(200, 100); c.lineTo(224, 100); c.lineTo(212, 116); c.closePath(); c.fill();
    // かべを はしる くるま（ななめ）
    c.save(); c.translate(62, 120); c.rotate(-1.05); car(c, 0, 0, .45, true, '#ffc93c', '#d19a00', false); c.restore();
    // うしろから みた くるま
    c.save(); c.translate(200, 262);
    c.fillStyle = '#ff6a3d'; c.beginPath(); c.moveTo(-14, 10); c.lineTo(0, 44); c.lineTo(14, 10); c.fill();
    c.fillStyle = '#2f2a3a'; rr(c, -62, -6, 18, 30, 6); c.fill(); rr(c, 44, -6, 18, 30, 6); c.fill();
    c.fillStyle = '#ff5a5f'; rr(c, -50, -30, 100, 40, 10); c.fill();
    c.fillStyle = '#bfe6ff'; rr(c, -36, -52, 72, 24, 8); c.fill();
    c.fillStyle = '#c73a40'; rr(c, -54, -60, 108, 9, 4); c.fill();
    c.fillStyle = '#ff8080'; rr(c, -42, -18, 16, 8, 3); c.fill(); rr(c, 26, -18, 16, 8, 3); c.fill();
    c.restore();
    // 3D の もじ
    c.font = 'bold 44px "Hiragino Maru Gothic ProN", sans-serif';
    c.lineWidth = 8; c.strokeStyle = '#fff'; c.strokeText('3D', 318, 52);
    c.fillStyle = '#2f6fd1'; c.fillText('3D', 318, 52);
  }
})();
</script>
</body>
</html>
