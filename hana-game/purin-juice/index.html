<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>まほうの プリンジュース</title>
<style>
  :root{ --ink:#5a4466; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:#ffe3f1;overscroll-behavior:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Rounded Mplus 1c","Yu Gothic",system-ui,sans-serif}
  .emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  button{font:inherit;color:inherit;border:none;cursor:pointer;padding:0;background:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(6px + var(--st)) 8px 6px;background:#fff;box-shadow:0 3px 12px rgba(90,68,102,.15);z-index:2}
  #top h1{flex:1;margin:0;font-size:clamp(15px,4vw,22px);font-weight:900;color:#ff6fa8;text-align:center;white-space:nowrap;overflow:hidden}
  .rb{flex:none;width:44px;height:44px;border-radius:50%;background:#fff3f8;font-size:22px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 3px 0 #f0d3e2}
  .rb:active{transform:translateY(2px);box-shadow:0 1px 0 #f0d3e2}
  #wrap{position:relative;flex:1;min-height:0}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #drinkBox{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:10px;z-index:2}
  #drink{min-width:170px;height:62px;border-radius:999px;background:#ff6fa8;color:#fff;font-size:24px;font-weight:900;box-shadow:0 6px 0 #d94d86;display:none}
  #drink.on{display:block;animation:bob 1.2s ease-in-out infinite}
  #drink:active{transform:translateY(4px);box-shadow:0 2px 0 #d94d86}
  #redo{width:62px;height:62px;border-radius:50%;background:#fff;font-size:26px;box-shadow:0 6px 0 #e0c8d6;display:none}
  #redo.on{display:block}
  @keyframes bob{50%{transform:translateY(-4px) scale(1.04)}}
  #tools{flex:none;display:flex;align-items:center;justify-content:safe center;gap:5px;padding:8px 6px calc(8px + var(--sb));background:#fff;
    border-radius:20px 20px 0 0;box-shadow:0 -4px 14px rgba(90,68,102,.15);overflow-x:auto;scrollbar-width:none;transition:opacity .3s}
  #tools::-webkit-scrollbar{display:none}
  #tools.off{opacity:.35;pointer-events:none}
  .tb{flex:none;width:clamp(44px,9vw,70px);height:clamp(58px,13vw,76px);border-radius:16px;background:#fff3f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 #f0d3e2}
  .tb:active{transform:translateY(2px);box-shadow:0 1px 0 #f0d3e2}
  .tb .e{font-size:clamp(24px,6.2vw,36px);line-height:1}
  .tb .n{font-size:clamp(8px,2.3vw,12px);font-weight:900;white-space:nowrap;letter-spacing:-.5px;max-width:100%;overflow:hidden}
  .ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(90,50,90,.45)}
  .ov.open{display:flex}
  .card{background:#fff;border-radius:28px;padding:22px 18px;width:min(94vw,560px);max-height:92vh;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.3)}
  .card h2{margin:0;font-size:24px;color:#ff6fa8}
  .big{width:100%;min-height:58px;border-radius:999px;font-size:22px;font-weight:900;color:#fff;background:#ff8fb8;box-shadow:0 6px 0 #e8689a}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 #e8689a}
  .big.gray{background:#b9b2c6;box-shadow:0 6px 0 #9189a3;min-height:48px;font-size:18px}
  #title{background:linear-gradient(#ffd6ea,#fff1c9)}
  #title .card{background:rgba(255,255,255,.92)}
  #title h2{font-size:clamp(28px,8vw,40px);line-height:1.2}
  .by{font-weight:900;font-size:20px;color:#9b7bff}

  .st canvas{width:56px;height:44px}
  .st.no{opacity:.45}
  .st.no .i{filter:grayscale(1) brightness(1.6)}
  #toast{position:fixed;left:50%;top:calc(70px + var(--st));transform:translateX(-50%);background:rgba(255,255,255,.96);color:#ff6fa8;font-weight:900;padding:10px 20px;border-radius:999px;
    z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;font-size:18px;box-shadow:0 6px 18px rgba(0,0,0,.2)}

</style>

  <div id="top">

  </div>

</div>
<div class="ov open" id="title"><div class="card">
  <h2>まほうの<br>プリンジュース</h2>

</div></div>
<div class="ov" id="bookOv"><div class="card"><h2>📖 まほうの シール</h2><p id="bookMsg" style="margin:0;font-weight:800"></p><div class="book" id="book"></div><button class="big gray" id="bookClose">とじる</button></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   まほうの プリンジュース v0.1   さく：はなちゃん
   - グラスに いれて → おひめさまが のむ → まほうが おきる
   - はなちゃんの えの おはなし：
     プリンセスが プリンの ジュースを のむ → たいようが でる → ねこコウモリが でる
   - 外部ライブラリ・画像・音声ファイル・外部通信なし
   ========================================================= */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const now = () => performance.now() / 1000;
const EMOF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const store = {
  get(k, d) { try { const v = localStorage.getItem('purin_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('purin_' + k, JSON.stringify(v)); } catch (e) {} },
};
let opt = Object.assign({ sound: true }, store.get('opt', {}));
let got = store.get('stickers', {});

/* ---------- ざいりょう ---------- */
const ING = [
  { id: 'purin', e: '🍮', n: 'プリン', type: 'block', col: '#ffd45c', top: '#a8642a', h: 38, fam: 'sun', fs: 1.5 },
  { id: 'orange', e: '🍊', n: 'オレンジ', type: 'liq', col: '#ffae3c', h: 30, fam: 'sun', fs: 1 },
  { id: 'grape', e: '🍇', n: 'ぶどう', type: 'liq', col: '#9b5fd0', h: 30, fam: 'night', fs: 1 },
  { id: 'peach', e: '🍑', n: 'もも', type: 'liq', col: '#ffa3c4', h: 30, fam: 'love', fs: 1 },
  { id: 'melon', e: '🍈', n: 'メロン', type: 'liq', col: '#7fdc6a', h: 30, fam: 'float', fs: 1, fizz: true },
  { id: 'choco', e: '🍫', n: 'チョコ', type: 'liq', col: '#7a4a2a', h: 30, fam: 'choco', fs: 1 },
  { id: 'cream', e: '🍦', n: 'クリーム', type: 'cream', col: '#fffaf0', h: 24 },
  { id: 'berry', e: '🍓', n: 'いちご', type: 'top', fam: 'love', fs: .6 },
  { id: 'cherry', e: '🍒', n: 'さくらんぼ', type: 'top', fam: 'love', fs: .5 },
  { id: 'star', e: '⭐', n: 'ほし', type: 'top', star: true },
];
const INGM = Object.fromEntries(ING.map(i => [i.id, i]));
const STICKERS = [
  { id: 'sun', e: '☀️', n: 'おひさま' }, { id: 'catbat', e: '', n: 'ねこコウモリ' }, { id: 'love', e: '💗', n: 'ハートの あめ' }, { id: 'float', e: '🫧', n: 'ふわふわ' },
  { id: 'choco', e: '🍫', n: 'チョコひげ' }, { id: 'star', e: '🌟', n: 'ほしの ドレス' }, { id: 'rainbow', e: '🌈', n: 'にじいろ' }, { id: 'burp', e: '💨', n: 'げっぷ' },
];

/* ---------- おと ---------- */
let AC = null, master = null, noiseBuf = null, slurpN = null;
function audio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = opt.sound ? .9 : 0; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function osc(type, f, d, { vol = .1, to = null, delay = 0, vib = 0, att = .01 } = {}) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  if (vib) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = vib; lg.gain.value = f * .07; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + d + .05); }
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .05);
}
function noise(d, { vol = .1, f = 1000, q = 1, type = 'bandpass', delay = 0, att = .005 } = {}) {
  if (!AC) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(g).connect(master); s.start(t, Math.random() * .5); s.stop(t + d + .05);
}
const SFX = {
  pour() { noise(.75, { vol: .12, f: 900, q: .7, att: .08 }); for (let i = 0; i < 4; i++) osc('sine', rnd(500, 900), .08, { vol: .04, delay: .15 + i * .14, to: rnd(900, 1300) }); },
  purun() { osc('triangle', 220, .35, { vol: .14, to: 520, vib: 16 }); osc('sine', 160, .2, { vol: .1, to: 90 }); },
  cream() { noise(.5, { vol: .07, f: 2400, q: .5, att: .1 }); },
  plop() { osc('sine', 700, .12, { vol: .1, to: 300 }); },
  ting() { osc('sine', 1760, .4, { vol: .07 }); osc('sine', 2637, .4, { vol: .04, delay: .06 }); },
  over() { noise(.6, { vol: .1, f: 600, q: .6 }); osc('sine', 300, .5, { vol: .06, to: 150 }); },
  puha() { osc('triangle', 600, .3, { vol: .1, to: 1100 }); noise(.25, { vol: .1, f: 2500, q: .5 }); },
  burp() { osc('sawtooth', 105, .7, { vol: .16, to: 68, vib: 28 }); osc('square', 130, .6, { vol: .06, to: 80, vib: 30 }); },
  giggle() { for (let i = 0; i < 5; i++) osc('triangle', 900 + i * 90, .09, { vol: .07, delay: i * .085, vib: 22 }); },
  wow() { osc('triangle', 600, .35, { vol: .1, to: 1300 }); },
  sunrise() { [523, 659, 784, 1047, 1319].forEach((f, i) => osc('triangle', f, .5, { vol: .08, delay: i * .12 })); },
  sing() { const m = [784, 880, 988, 1047, 988, 880, 784, 659]; m.forEach((f, i) => osc('sine', f, .2, { vol: .06, delay: i * .2 })); },
  dusk() { [784, 659, 523, 392].forEach((f, i) => osc('sine', f, .6, { vol: .06, delay: i * .25 })); },
  nya() { osc('triangle', 700, .3, { vol: .1, to: 1100, vib: 8 }); osc('triangle', 1100, .25, { vol: .07, to: 750, delay: .22 }); },
  flap() { noise(.12, { vol: .05, f: 500, q: .8 }); },
  hearts() { for (let i = 0; i < 6; i++) osc('sine', 1200 + i * 150, .2, { vol: .05, delay: i * .1 }); },
  bubble() { for (let i = 0; i < 5; i++) osc('sine', rnd(400, 900), .1, { vol: .06, delay: i * .1, to: rnd(1000, 1600) }); },
  boom() { noise(1, { vol: .25, f: 300, type: 'lowpass', att: .01 }); osc('sine', 120, .8, { vol: .2, to: 40 }); [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => osc('triangle', f, .4, { vol: .07, delay: .3 + i * .07 })); },
  pon() { osc('sine', 300, .15, { vol: .14, to: 700 }); },
  twinkle() { for (let i = 0; i < 8; i++) osc('sine', 2000 + Math.random() * 1500, .25, { vol: .04, delay: i * .12 }); },
  no() { osc('square', 300, .15, { vol: .04, to: 200 }); },
};
function slurp(on) {
  if (!AC) return;
  if (on && !slurpN) {
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 3; g.gain.value = .07;
    l.frequency.value = 9; lg.gain.value = 500; l.connect(lg).connect(f.frequency); l.start();
    s.connect(f).connect(g).connect(master); s.start(); slurpN = { s, l };
  } else if (!on && slurpN) { try { slurpN.s.stop(); slurpN.l.stop(); } catch (e) {} slurpN = null; }
}

/* ---------- つぶつぶ ---------- */
let parts = [];
function fx(n, x, y, o = {}) {
  const P = q => parts.push(Object.assign({ x, y, vx: 0, vy: 0, g: 0, life: 1, max: 1, r: 8, rot: 0, vr: 0 }, q));
  if (n === 'hearts') for (let i = 0; i < (o.n || 6); i++) P({ k: 'heart', x: x + rnd(-40, 40), y: y + rnd(-20, 10), vy: rnd(-90, -50), vx: rnd(-30, 30), life: 1.4, max: 1.4, r: rnd(8, 14), col: pick(['#ff6f91', '#ff9ac0']) });
  else if (n === 'sparkle') for (let i = 0; i < 16; i++) { const a = rnd(0, TAU), s = rnd(60, 220); P({ k: 'star', vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, max: 1, r: rnd(5, 10), col: pick(['#ffd54a', '#ff9ac0', '#8fd3ff', '#c29bff']), vr: rnd(-5, 5) }); }
  else if (n === 'notes') P({ k: 'txt', text: pick(['♪', '♫']), x: x + rnd(-30, 30), vy: rnd(-70, -40), vx: rnd(-20, 20), life: 1.4, max: 1.4, r: rnd(22, 30), col: pick(['#ff6f91', '#9b7bff', '#5aa9ff', '#ff9a3c']) });
  else if (n === 'txt') P({ k: 'txt', text: o.text, vy: -30, life: o.life || 1.4, max: o.life || 1.4, r: o.size || 30, col: o.col || '#ff6f91', stroke: true });
  else if (n === 'bubbles') for (let i = 0; i < (o.n || 6); i++) P({ k: 'ring', x: x + rnd(-40, 40), y: y + rnd(-10, 10), vy: rnd(-120, -60), vx: rnd(-20, 20), life: rnd(1.2, 2.2), max: 2.2, r: rnd(5, 12) });
  else if (n === 'drops') for (let i = 0; i < (o.n || 6); i++) P({ k: 'dot', vx: rnd(-90, 90), vy: rnd(-200, -60), g: 800, life: .7, max: .7, r: rnd(3, 6), col: o.col || '#ffae3c' });
  else if (n === 'confetti') for (let i = 0; i < 70; i++) P({ k: 'rect', x: x + rnd(-450, 450), y: y + rnd(-200, 0), vx: rnd(-50, 50), vy: rnd(-80, 60), g: 160, life: 3, max: 3, r: rnd(6, 11), col: pick(['#ff6f91', '#ffb347', '#ffe36e', '#8fd96b', '#5aa9ff', '#b48cff']), vr: rnd(-8, 8) });
  else if (n === 'puff') for (let i = 0; i < 6; i++) P({ k: 'dot', x: x + rnd(-14, 14), vx: rnd(-40, 40) + (o.vx || 0), vy: rnd(-40, -10), life: 1, max: 1, r: rnd(9, 15), col: o.col || 'rgba(230,220,180,.8)' });
}
function stepParts(dt) { for (const p of parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; } parts = parts.filter(p => p.life > 0); }
function drawParts(c) {
  for (const p of parts) {
    c.save(); c.globalAlpha = clamp(p.life / (p.max * .35), 0, 1); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.col;
    if (p.k === 'heart') { heartP(c, 0, 0, p.r); c.fill(); }
    else if (p.k === 'star') { starP(c, 0, 0, p.r); c.fill(); }
    else if (p.k === 'ring') { c.fillStyle = 'rgba(255,255,255,.4)'; ell(c, 0, 0, p.r, p.r); c.fill(); c.strokeStyle = 'rgba(140,220,160,.9)'; c.lineWidth = 2; c.stroke(); }
    else if (p.k === 'txt') { c.font = `900 ${p.r}px "Hiragino Maru Gothic ProN",sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; if (p.stroke) { c.lineWidth = 6; c.strokeStyle = '#fff'; c.strokeText(p.text, 0, 0); } c.fillText(p.text, 0, 0); }
    else if (p.k === 'rect') c.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
    else { ell(c, 0, 0, p.r, p.r); c.fill(); }
    c.restore();
  }
}
function ell(c, x, y, rx, ry, r = 0) { c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), r, 0, TAU); }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function starP(c, x, y, r, n = 5) { c.beginPath(); for (let i = 0; i < n * 2; i++) { const q = i % 2 ? r * .45 : r, a = i * Math.PI / n - Math.PI / 2; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } c.closePath(); }
function heartP(c, x, y, r) { c.beginPath(); c.moveTo(x, y + r * .7); c.bezierCurveTo(x - r * 1.5, y - r * .2, x - r * .6, y - r * 1.3, x, y - r * .4); c.bezierCurveTo(x + r * .6, y - r * 1.3, x + r * 1.5, y - r * .2, x, y + r * .7); c.closePath(); }
function emoji(c, e, x, y, size) { c.font = `${size}px ${EMOF}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000'; c.fillText(e, x, y); }
function mixCol(a, b, k) { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], k)).toString(16).padStart(2, '0')).join(''); }

/* ---------- せかい ---------- */
const LW = 1000, LH = 640, TABLE = 470, FLOOR = 560, CAP = 184, GS = .85, GX0 = 260, GX1 = 400;
const G = { x: GX0, layers: [], tops: [], wob: 0, anim: null, queue: [], spillT: 0, puddle: 0, warned: false };
const PR = { x: 580, y: 600, fy: 0, face: 'normal', faceT: 0, bubble: null, bubbleT: 0, cheek: 0, mus: 0, hairRB: 0, dress: 0, twirl: 0, jump: 0, vy: 0, blinkT: 2, armReach: 0 };
const SUN = { on: false, x: 840, y: 700, rot: 0, k: 0, tapT: 0 };
let bats = [];

$('#btnBook').addEventListener('click', () => {
  audio(); const box = $('#book'); box.innerHTML = '';
  let n = 0;
  for (const s of STICKERS) {
    const on = !!got[s.id]; if (on) n++;
    const d = document.createElement('div'); d.className = 'st' + (on ? '' : ' no');
    if (s.id === 'catbat') { const tc = document.createElement('canvas'); tc.width = 112; tc.height = 88; const c = tc.getContext('2d'); c.translate(56, 50); c.scale(.55, .55); drawCatBat(c, { x: 0, y: 0, rot: 0, s: 1, dir: -1, t: 1, ph: 1 }, 0); d.appendChild(tc); }
    else d.insertAdjacentHTML('beforeend', `<span class="i emo">${s.e}</span>`);
    d.insertAdjacentHTML('beforeend', `<span>${on ? s.n : '？'}</span>`);
    box.appendChild(d);
  }
  $('#bookMsg').textContent = n >= STICKERS.length ? 'ぜんぶ あつめたよ！ すごい！' : `${n} / ${STICKERS.length} こ。いろいろ まぜて みてね`;
  $('#bookOv').classList.add('open');
});
$('#bookClose').addEventListener('click', () => $('#bookOv').classList.remove('open'));
$('#start').addEventListener('click', () => { audio(); $('#title').classList.remove('open'); state = 'make'; ui(); say('ジュース つくって！', 'happy', 1.5); SFX.sunrise(); });
// タイトルの え
(function () {
  const tc = $('#titleCv'), c = tc.getContext('2d');
  const P = Object.assign({}, PR, { x: 230, y: 300, fy: 0, jump: 0, twirl: 0, dress: 0, mus: 0, hairRB: 0, armReach: .6, cheek: 0, blinkT: 2, faceT: 1, face: 'happy' });
  c.save(); c.scale(.72, .72); drawPrincess(c, 0, P, { face: 'happy' }); c.restore();
  c.save(); c.translate(70, 290); c.scale(.55, .55); c.fillStyle = 'rgba(225,245,255,.95)'; c.strokeStyle = '#9fd0ee'; c.lineWidth = 5; ell(c, 0, -4, 64, 12); c.fill(); c.stroke(); c.fillRect(-7, -84, 14, 80);
  c.save(); bowlPath(c); c.clip(); c.fillStyle = '#ffae3c'; c.fillRect(-120, -150, 240, 80); c.fillStyle = '#ffd45c'; c.fillRect(-120, -220, 240, 70); c.fillStyle = '#a8642a'; c.fillRect(-120, -226, 240, 9); c.restore();
  bowlPath(c); c.stroke(); emoji(c, '🍓', 0, -250, 40); c.restore();
  c.save(); c.translate(320, 60); c.scale(.4, .4); drawSun(c, 0); c.restore();
})();

// iPad の ダブルタップ・ピンチ かくだい を とめる
let lastTouch = 0;
document.addEventListener('touchend', e => { const t = Date.now(); if (t - lastTouch < 350 && !e.target.closest('a,button')) e.preventDefault(); lastTouch = t; }, { passive: false });
for (const ev of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('visibilitychange', () => { if (document.hidden) slurp(false); });

/* ---------- ループ ---------- */
let lastT = now(), uiT = 0;
function loop() {
  requestAnimationFrame(loop);
  const t = now(), dt = Math.min(.05, t - lastT); lastT = t;
  sky = lerp(sky, skyTo, 1 - Math.exp(-dt * 1.6));
  updGlass(dt); updState(dt, t); updBats(dt, t); stepParts(dt);
  // おひめさま
  if (PR.faceT > 0) PR.faceT -= dt; if (PR.bubbleT > 0) { PR.bubbleT -= dt; if (PR.bubbleT <= 0) PR.bubble = null; }
  PR.blinkT -= dt; if (PR.blinkT < -.14) PR.blinkT = rnd(2, 5);
  if (PR.twirl > 0) PR.twirl = Math.max(0, PR.twirl - dt / 1.2);
  if (PR.vy || PR.jump > 0) { PR.jump += PR.vy * dt; PR.vy -= 1800 * dt; if (PR.jump <= 0) { PR.jump = 0; PR.vy = 0; } }
  if (state !== 'drink' && state !== 'after') PR.cheek = Math.max(0, PR.cheek - dt * 2);
  if (SUN.on || SUN.y < 650) SUN.rot += dt * (SUN.tapT > 0 ? 3 : .5); if (SUN.tapT > 0) SUN.tapT -= dt;
  uiT -= dt; if (uiT <= 0) { uiT = .2; ui(); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
  drawScene(ctx, t, dt);
}
buildTools(); resize(); renderSound();
requestAnimationFrame(loop);
</script>
