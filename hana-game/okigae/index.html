<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd6e7">
<title>おしゃれ きせかえ</title>
<style>
  :root{ --ink:#5a4466; --pink:#ff8fb8; --pink-d:#e8689a; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);overscroll-behavior:none;background:#ffe9f2;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Rounded Mplus 1c","Yu Gothic",system-ui,sans-serif}
  .emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  button{font:inherit;color:inherit;border:none;cursor:pointer;padding:0;background:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #stageWrap{position:relative;flex:0 0 46%;min-height:0;min-width:0}
  #stage{width:100%;height:100%;display:block}
  #panel{flex:1 1 0;min-height:0;min-width:0;display:flex;flex-direction:column;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -6px 20px rgba(200,100,150,.2);
    padding:8px 8px calc(6px + var(--sb));gap:6px}
  @media (orientation:landscape) and (min-width:700px){
    #app{flex-direction:row}
    #stageWrap{flex:0 0 46%}
    #panel{flex:1 1 0;border-radius:26px 0 0 26px;padding:calc(10px + var(--st)) 10px calc(8px + var(--sb))}
  }
  .side{position:absolute;top:calc(8px + var(--st));display:flex;flex-direction:column;gap:8px;z-index:3}
  .side.l{left:8px} .side.r{right:8px}
  .rb{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);font-size:25px;box-shadow:0 4px 0 rgba(200,100,150,.3);display:flex;align-items:center;justify-content:center;text-decoration:none;position:relative}
  .rb:active{transform:translateY(3px)}
  .rb small{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;white-space:nowrap;color:var(--ink);text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff}
  .side .rb{margin-bottom:8px}
  #theme{position:absolute;left:50%;top:calc(10px + var(--st));transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:999px;padding:8px 16px;font-weight:800;
    font-size:clamp(13px,3.6vw,17px);white-space:nowrap;box-shadow:0 4px 12px rgba(200,100,150,.3);display:none;z-index:2}
  #theme.on{display:block;animation:popin .4s cubic-bezier(.3,1.6,.5,1)}
  @keyframes popin{from{transform:translateX(-50%) scale(.4)}}

  #tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;flex:none;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;width:58px;height:58px;border-radius:18px;background:#fbeff5;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:25px;line-height:1}
  .tab small{font-size:10px;font-weight:800;margin-top:3px}
  .tab.sel{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-d);transform:translateY(-2px)}
  #items{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;align-content:start;padding:2px}
  .it{aspect-ratio:1;border-radius:18px;background:#fdf4f8;position:relative;display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;border:3px solid transparent}
  .it canvas{width:100%;height:100%;display:block}
  .it.sel{border-color:var(--pink);background:#fff0f6}
  .it.lock::after{content:'🎁';position:absolute;inset:0;background:rgba(255,240,246,.88);display:flex;align-items:center;justify-content:center;font-size:36px}
  .it:active{transform:scale(.94)}
  #colors,#pats{display:flex;gap:7px;overflow-x:auto;flex:none;padding:3px 2px;scrollbar-width:none;min-height:0}
  #colors::-webkit-scrollbar,#pats::-webkit-scrollbar{display:none}
  .sw{flex:none;width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08),inset 0 -3px 0 rgba(0,0,0,.1)}
  .sw.sel{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
  .pt{flex:none;width:46px;height:40px;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
  .pt canvas{width:100%;height:100%;display:block}
  .pt.sel{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}

  .ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(90,50,90,.45)}
  .ov.open{display:flex}
  .card{background:#fff;border-radius:28px;padding:20px 18px;width:min(92vw,460px);max-height:92vh;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
    box-shadow:0 14px 40px rgba(120,50,100,.35)}
  .card h2{margin:0;font-size:26px;color:#ff6fa8}
  .card p{margin:0;font-size:15px;line-height:1.6}
  .big{width:100%;min-height:58px;border-radius:999px;font-size:21px;font-weight:900;color:#fff;background:var(--pink);box-shadow:0 6px 0 var(--pink-d)}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-d)}
  .big.blue{background:#7cc8ff;box-shadow:0 6px 0 #4fa6e6}
  .big.gray{background:#b9b2c6;box-shadow:0 6px 0 #9189a3;min-height:48px;font-size:17px}
  #photoImg{width:min(70vw,300px);border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);transform:rotate(-2deg);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
  #albumGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
  #albumGrid img{width:100%;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,.2);display:block}
  #giftBox{font-size:90px;line-height:1;animation:gift 1s ease}
  @keyframes gift{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1)}}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
  #flash.on{animation:fl .5s}
  @keyframes fl{0%{opacity:.95}100%{opacity:0}}
  #toast{position:fixed;left:50%;bottom:calc(30px + var(--sb));transform:translateX(-50%);background:rgba(90,68,102,.92);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;
    z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;font-size:15px}
  #toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <div id="theme"></div>
    <div class="side l">
      <a class="rb emo" href="../gameselect.html" aria-label="ゲームを えらぶ">🏠</a>
      <button class="rb emo" id="btnSound" aria-label="おと">🔊</button>
    </div>
    <div class="side r">
      <button class="rb emo" id="btnRandom">🎲<small>おまかせ</small></button>
      <button class="rb emo" id="btnTheme">💌<small>おだい</small></button>
      <button class="rb emo" id="btnPhoto">📷<small>しゃしん</small></button>
      <button class="rb emo" id="btnAlbum">📒<small>アルバム</small></button>
    </div>
  </div>
  <div id="panel">
    <div id="tabs"></div>
    <div id="items"></div>
    <div id="colors"></div>
    <div id="pats"></div>
  </div>
</div>

<div class="ov" id="photoOv"><div class="card">
  <h2>📷 パシャ！</h2>
  <img id="photoImg" alt="しゃしん">
  <p id="photoMsg">アルバムに いれたよ！<br><small>しゃしんを ながおし すると ほぞん できるよ</small></p>
  <button class="big" id="photoOk">つづける</button>
</div></div>
<div class="ov" id="giftOv"><div class="card">
  <h2>🎁 プレゼント！</h2>
  <div id="giftBox" class="emo">🎁</div>
  <canvas id="giftCv" width="200" height="200" style="width:150px;height:150px;border-radius:24px;background:#fff0f6"></canvas>
  <p id="giftName" style="font-weight:900;font-size:20px"></p>
  <button class="big" id="giftWear">きてみる！</button>
</div></div>
<div class="ov" id="albumOv"><div class="card">
  <h2>📒 アルバム</h2>
  <p id="albumMsg"></p>
  <div id="albumGrid"></div>
  <button class="big gray" id="albumClear">ぜんぶ けす</button>
  <button class="big blue" id="albumClose">とじる</button>
</div></div>
<div id="flash"></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   おしゃれ きせかえ v0.1
   - おんなのこ も ふく も ぜんぶ Canvas で かいているので、いろ・がら を じゆうに かえられる
   - 外部ライブラリ・画像ファイル・外部通信なし（GitHub Pages に置くだけで動作）
   - コーデ・アルバム・プレゼントは この たんまつの localStorage に ほぞん
   ========================================================= */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const store = {
  get(k, d) { try { const v = localStorage.getItem('kisekae_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('kisekae_' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};

/* ---------- いろ・がら ---------- */
const SKIN = ['#ffe3cf', '#fbd3b0', '#e6b184', '#c08a5c', '#8f5f40'];
const HAIRC = ['#3a2a2e', '#6b4226', '#a8672e', '#f2cf63', '#ff8fb8', '#ff9a5a', '#8fb8ff', '#b48cff', '#7fd6c0', '#f4f1f6'];
const EYEC = ['#6b4226', '#3a2a2e', '#3d8bff', '#3fae6a', '#a66cff', '#ff6fa0', '#e8a23a'];
const COLS = ['#ff6f91', '#ffa0c0', '#ff9a5a', '#ffd54a', '#8fd96b', '#5cc8c0', '#5aa9ff', '#9b7bff', '#d48cff', '#ffffff', '#3d3a4d', '#c9a27a', '#e04545', '#2f5aa8'];
const PATS = ['plain', 'dot', 'stripe', 'check', 'heart', 'star', 'flower'];
function rgb(hex) { if (typeof hex !== 'string' || hex[0] !== '#') hex = '#ff8fb8'; const n = parseInt(hex.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function shade(hex, k) {   // k<1 くらく / k>1 あかるく
  const [r, g, b] = rgb(hex);
  const f = v => k <= 1 ? Math.round(v * k) : Math.round(v + (255 - v) * (k - 1));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
const isLight = hex => { const [r, g, b] = rgb(hex); return r * .3 + g * .59 + b * .11 > 205; };
const patCache = {};
function heartPath(c, x, y, r) { c.beginPath(); c.moveTo(x, y + r * .7); c.bezierCurveTo(x - r * 1.5, y - r * .2, x - r * .6, y - r * 1.3, x, y - r * .4); c.bezierCurveTo(x + r * .6, y - r * 1.3, x + r * 1.5, y - r * .2, x, y + r * .7); c.closePath(); }
function starPath(c, x, y, r, n = 5) { c.beginPath(); for (let i = 0; i < n * 2; i++) { const rr = i % 2 ? r * .45 : r, a = i * Math.PI / n - Math.PI / 2; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.closePath(); }
function fillOf(col, pat) {
  if (!pat || pat === 'plain') return col;
  const key = col + pat; if (patCache[key]) return patCache[key];
  const cv = document.createElement('canvas'); cv.width = cv.height = 64; const c = cv.getContext('2d');
  c.scale(2, 2);
  c.fillStyle = col; c.fillRect(0, 0, 32, 32);
  const m = isLight(col) ? '#ff9ac0' : 'rgba(255,255,255,.88)';
  c.fillStyle = m;
  if (pat === 'dot') for (const [x, y] of [[8, 8], [24, 24]]) { c.beginPath(); c.arc(x, y, 4.2, 0, TAU); c.fill(); }
  else if (pat === 'stripe') { c.fillRect(0, 2, 32, 7); c.fillRect(0, 18, 32, 7); }
  else if (pat === 'check') { c.globalAlpha = .5; c.fillRect(0, 0, 32, 8); c.fillRect(0, 16, 32, 8); c.fillRect(0, 0, 8, 32); c.fillRect(16, 0, 8, 32); }
  else if (pat === 'heart') for (const [x, y] of [[8, 9], [24, 25]]) { heartPath(c, x, y, 4.6); c.fill(); }
  else if (pat === 'star') for (const [x, y] of [[8, 8], [24, 24]]) { starPath(c, x, y, 5.5); c.fill(); }
  else if (pat === 'flower') for (const [x, y] of [[8, 8], [24, 24]]) { for (let i = 0; i < 5; i++) { const a = i * TAU / 5; c.beginPath(); c.arc(x + Math.cos(a) * 3.4, y + Math.sin(a) * 3.4, 2.6, 0, TAU); c.fill(); } c.fillStyle = '#ffd54a'; c.beginPath(); c.arc(x, y, 2, 0, TAU); c.fill(); c.fillStyle = m; }
  const p = c.createPattern(cv, 'repeat');
  if (p.setTransform) p.setTransform(new DOMMatrix().scale(.5));
  return patCache[key] = p;
}

/* ---------- かく どうぐ ---------- */
const E = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); };
const L = (c, x1, y1, x2, y2) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); };
function FS(c, f, s, lw = 2) { c.fillStyle = f; c.fill(); if (s) { c.strokeStyle = s; c.lineWidth = lw; c.lineJoin = 'round'; c.stroke(); } }
function path(c, d) { c.beginPath(); const p = new Path2D(d); return p; }
function PD(c, d, f, s, lw = 2) { const p = new Path2D(d); c.fillStyle = f; c.fill(p); if (s) { c.strokeStyle = s; c.lineWidth = lw; c.lineJoin = 'round'; c.stroke(p); } }
// うで（かた → て）
const ARM = { l: [115, 216, 94, 296], r: [185, 216, 206, 296] };
function sleeve(c, f, t, w = 25) {
  c.lineCap = 'round'; c.strokeStyle = f; c.lineWidth = w;
  for (const k of ['l', 'r']) { const [x1, y1, x2, y2] = ARM[k]; L(c, x1, y1, x1 + (x2 - x1) * t, y1 + (y2 - y1) * t); c.stroke(); }
}
const TOP_BODY = h => `M112,209 L127,202 Q150,220 173,202 L188,209 L${184},${h} Q150,${h + 8} 116,${h} Z`;

/* ---------- からだ ---------- */
function drawBody(c, S) {
  const sk = SKIN[S.skin], sd = shade(sk, .86);
  c.lineCap = 'round';
  c.strokeStyle = sk; c.lineWidth = 22; L(c, 135, 308, 134, FOOT[0][1] - 9); c.stroke(); L(c, 165, 308, 166, FOOT[1][1] - 9); c.stroke();
  E(c, 132, FOOT[0][1], 14, 9); FS(c, sk); E(c, 168, FOOT[1][1], 14, 9); FS(c, sk);
  c.lineWidth = 18; for (const k of ['l', 'r']) { const a = ARM[k]; L(c, a[0], a[1], a[2], a[3]); c.strokeStyle = sk; c.stroke(); E(c, a[2] + (k === 'l' ? -2 : 2), a[3] + 6, 10, 10); FS(c, sk); }
  PD(c, 'M112,209 Q150,200 188,209 L183,255 Q181,290 185,312 Q150,322 115,312 Q119,290 117,255 Z', sk);
  c.fillStyle = sk; c.fillRect(139, 184, 22, 26);
  // インナー（しろ）
  PD(c, 'M118,226 Q150,234 182,226 L181,262 Q180,290 184,312 Q168,330 152,318 L150,314 L148,318 Q132,330 116,312 Q120,290 119,262 Z', '#ffffff', '#f0e3ea', 1.5);
  // かお
  E(c, 92, 140, 8, 11); FS(c, sk); E(c, 208, 140, 8, 11); FS(c, sk);
  E(c, 150, 132, 60, 56); FS(c, sk);
  c.fillStyle = sd; c.globalAlpha = .35; E(c, 150, 190, 14, 4); c.fill(); c.globalAlpha = 1;
}
function drawFace(c, S, A) {
  const closed = A.blink, happy = A.happy > 0;
  for (const s of [-1, 1]) {
    const x = 150 + s * 24, y = 143;
    if (closed || happy) {
      c.strokeStyle = '#4a3340'; c.lineWidth = 3.2; c.lineCap = 'round';
      c.beginPath(); if (happy) c.arc(x, y + 5, 10, Math.PI * 1.12, Math.PI * 1.88); else { c.moveTo(x - 10, y); c.quadraticCurveTo(x, y + 7, x + 10, y); } c.stroke();
    } else {
      E(c, x, y, 11, 13.5); FS(c, '#fff');
      E(c, x, y + 1, 9, 11.5); FS(c, S.eye);
      E(c, x, y + 2, 5, 7); FS(c, '#2e2030');
      E(c, x - 3.5, y - 5, 3.4, 3.8); FS(c, '#fff'); E(c, x + 3.5, y + 5, 1.8, 1.8); FS(c, '#fff');
      c.strokeStyle = '#4a3340'; c.lineWidth = 3; c.lineCap = 'round';
      c.beginPath(); c.moveTo(x - 11.5, y - 5); c.quadraticCurveTo(x, y - 17, x + 11.5, y - 5); c.stroke();
      L(c, x + s * 11, y - 6, x + s * 16, y - 6); c.lineWidth = 2.2; c.stroke();
      c.strokeStyle = 'rgba(74,51,64,.55)'; c.lineWidth = 2.2; c.beginPath(); c.moveTo(x - 9, y - 23); c.quadraticCurveTo(x, y - 28, x + 9, y - 23); c.stroke();
    }
    c.fillStyle = 'rgba(255,120,150,.42)'; E(c, 150 + s * 36, 162, 10, 6); c.fill();
  }
  c.strokeStyle = '#c4566f'; c.lineWidth = 2.6; c.lineCap = 'round';
  if (happy) { c.beginPath(); c.moveTo(142, 164); c.quadraticCurveTo(150, 178, 158, 164); c.closePath(); FS(c, '#e8607f', '#c4566f', 2); }
  else { c.beginPath(); c.moveTo(143, 166); c.quadraticCurveTo(150, 172, 157, 166); c.stroke(); }
}

/* ---------- かみ ---------- */
const CAP = 'M86,138 C80,84 110,62 150,62 C190,62 220,84 214,138 C208,120 200,112 192,107 C186,122 176,126 168,111 C160,127 144,128 136,111 C128,126 116,124 108,109 C100,114 92,122 86,138 Z';
const HAIR = [
  { id: 'bob', name: 'ボブ', back(c, f, s) { PD(c, 'M84,130 C76,78 110,56 150,56 C190,56 224,78 216,130 C224,162 220,190 204,198 L96,198 C80,190 76,162 84,130 Z', f, s); } },
  { id: 'long', name: 'ロング', back(c, f, s) { PD(c, 'M84,130 C76,78 110,56 150,56 C190,56 224,78 216,130 C230,200 226,290 208,310 Q150,322 92,310 C74,290 70,200 84,130 Z', f, s); } },
  { id: 'twin', name: 'ツイン', back(c, f, s, S) {
      PD(c, 'M92,110 C50,116 34,200 56,270 C74,262 86,210 98,150 Z', f, s); PD(c, 'M208,110 C250,116 266,200 244,270 C226,262 214,210 202,150 Z', f, s);
      E(c, 150, 122, 67, 62); FS(c, f, s);
    }, front(c, f, s) { for (const x of [90, 210]) { E(c, x, 114, 8, 8); FS(c, '#ff6f91', '#d84a6c', 1.5); } } },
  { id: 'pony', name: 'ポニー', back(c, f, s) {
      PD(c, 'M196,76 C246,74 258,170 236,256 C222,232 214,170 198,118 Z', f, s); E(c, 150, 122, 67, 62); FS(c, f, s);
    }, front(c, f, s) { E(c, 199, 84, 9, 9); FS(c, '#ffd54a', '#d9a21f', 1.5); } },
  { id: 'buns', name: 'おだんご', back(c, f, s) { for (const x of [96, 204]) { E(c, x, 74, 25, 24); FS(c, f, s); } E(c, 150, 122, 67, 62); FS(c, f, s); } },
  { id: 'braid', name: 'みつあみ', back(c, f, s) { E(c, 150, 122, 67, 62); FS(c, f, s); },
    front(c, f, s) { for (const sx of [-1, 1]) { for (let i = 0; i < 6; i++) { E(c, 150 + sx * (58 + i * .6), 166 + i * 22, 12, 14, sx * (i % 2 ? .3 : -.3)); FS(c, f, s); } E(c, 150 + sx * 61, 294, 7, 7); FS(c, '#ff6f91', '#d84a6c', 1.5); } } },
  { id: 'short', name: 'ショート', back(c, f, s) { PD(c, 'M84,134 C76,80 110,58 150,58 C190,58 224,80 216,134 C218,156 212,170 204,174 L96,174 C88,170 82,156 84,134 Z', f, s); } },
  { id: 'wavy', name: 'ふわふわ', back(c, f, s) {
      c.beginPath(); c.moveTo(84, 130); c.bezierCurveTo(76, 78, 110, 54, 150, 54); c.bezierCurveTo(190, 54, 224, 78, 216, 130);
      for (let i = 0; i < 4; i++) c.quadraticCurveTo(240 - (i % 2) * 10, 150 + i * 36, 220, 168 + i * 36);
      c.quadraticCurveTo(150, 300, 80, 276);
      for (let i = 3; i >= 0; i--) c.quadraticCurveTo(60 + (i % 2) * 10, 150 + i * 36, 80, 132 + i * 36);
      c.closePath(); FS(c, f, s);

}
function choose(it) {
  if (isLocked(it)) { SFX.nope(); toast('📷 しゃしんを とると プレゼントが もらえるよ'); return; }
  if (cat === 'bg') S.bg = it.id;
  else if (cat === 'hair') S.hair.id = it.id;
  else if (cat === 'hand' || cat === 'pet' || cat === 'face') S[cat] = { id: it.id };
  else {
    const prev = S[cat];
    S[cat] = { id: it.id, col: prev && prev.id === it.id ? prev.col : (DEFCOL[it.id] || '#ff8fb8'), pat: prev ? prev.pat : 'plain' };
    if (cat === 'top' || cat === 'bottom') S.dress = null;
  }
  changed();
}
function changed(celebrate = true) { saveS(); renderItems(); renderColors(); if (celebrate) { cheer(12); SFX.wear(); } }
function renderColors() {
  const cb = $('#colors'), pb = $('#pats'); cb.innerHTML = ''; pb.innerHTML = '';
  const ct = byId(CATS, cat);
  let list = null, cur = null, set = null;
  if (cat === 'body') { list = EYEC; cur = S.eye; set = v => S.eye = v; }
  else if (cat === 'hair') { list = HAIRC; cur = S.hair.col; set = v => S.hair.col = v; }
  else if (!ct.nocolor) { const o = cat === 'top' || cat === 'bottom' ? (S.dress ? null : S[cat]) : S[cat]; if (o) { list = COLS; cur = o.col; set = v => o.col = v; } }
  if (list) for (const col of list) {
    const b = document.createElement('button'); b.className = 'sw' + (col === cur ? ' sel' : ''); b.style.background = col;
    b.addEventListener('click', () => { audio(); set(col); SFX.tick(); saveS(); renderItems(); renderColors(); anim.hop = Math.max(anim.hop, .5); });
    cb.appendChild(b);
  }
  const o = ct.pat ? (cat === 'top' || cat === 'bottom' ? (S.dress ? null : S[cat]) : S[cat]) : null;
  if (o) for (const p of PATS) {
    const b = document.createElement('button'); b.className = 'pt' + ((o.pat || 'plain') === p ? ' sel' : '');
    const cv = document.createElement('canvas'); cv.width = 92; cv.height = 80; const c = cv.getContext('2d'); c.scale(1.5, 1.5); c.fillStyle = fillOf(o.col, p); c.fillRect(0, 0, 80, 60);
    b.appendChild(cv);
    b.addEventListener('click', () => { audio(); o.pat = p; SFX.tick(); saveS(); renderItems(); renderColors(); anim.hop = Math.max(anim.hop, .5); });
    pb.appendChild(b);
  }
}

/* ---------- おまかせ・おだい ---------- */
function avail(list) { return list.filter(it => !isLocked(it)); }
function randomize() {
  const rc = () => pick(COLS), rp = () => Math.random() < .5 ? 'plain' : pick(PATS);
  S.hair = { id: pick(HAIR).id, col: pick(HAIRC) }; S.eye = pick(EYEC);
  S.top = { id: pick(avail(TOPS)).id, col: rc(), pat: rp() }; S.bottom = { id: pick(avail(BOTTOMS)).id, col: rc(), pat: rp() };
  S.dress = Math.random() < .4 ? { id: pick(avail(DRESSES)).id, col: rc(), pat: rp() } : null;
  S.shoes = { id: pick(SHOES).id, col: rc() };
  S.socks = Math.random() < .7 ? { id: pick(SOCKS).id, col: Math.random() < .5 ? '#ffffff' : rc(), pat: rp() } : null;
  S.head = Math.random() < .6 ? (() => { const it = pick(avail(HEADS)); return { id: it.id, col: DEFCOL[it.id] && Math.random() < .5 ? DEFCOL[it.id] : rc() }; })() : null;
  S.face = Math.random() < .25 ? { id: pick(FACES).id } : null;
  S.back = Math.random() < .25 ? (() => { const it = pick(avail(BACKS)); return { id: it.id, col: rc() }; })() : null;
  S.hand = Math.random() < .5 ? { id: pick(HANDS).id } : null;
  S.pet = Math.random() < .5 ? { id: pick(avail(PETS)).id } : null;
}
$('#btnRandom').addEventListener('click', () => { audio(); randomize(); SFX.magic(); saveS(); renderItems(); renderColors(); cheer(24); });
const THEMES = [['🏖️ うみに おでかけ！', 'beach'], ['🌳 こうえんで あそぼう！', 'park'], ['⛄ ゆきの ひの おしゃれ', 'snow'], ['🌙 よぞらの パーティー', 'night'], ['🏠 おうちで パジャマパーティー', 'room'],
  ['👑 プリンセスに なろう！', 'castle'], ['🎤 アイドルに なろう！', 'stage'], ['🧚 ようせいに なろう！', 'park'], ['🎒 ようちえんに いこう！', 'park'], ['🎂 おたんじょうび パーティー', 'room']];
$('#btnTheme').addEventListener('click', () => {
  audio();
  const [txt, bg] = pick(THEMES), el = $('#theme');
  el.textContent = txt; el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  const b = byId(BGS, bg); if (!isLocked(b)) S.bg = bg;
  SFX.magic(); saveS(); if (cat === 'bg') renderItems();
});

/* ---------- しゃしん・アルバム・プレゼント ---------- */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); }
function takePhoto() {
  const W = 540, H = 720, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
  c.save(); c.beginPath(); c.rect(24, 24, W - 48, H - 120); c.clip(); c.translate(24, 24);
  renderScene(c, W - 48, H - 120, anim.t, { hop: 0, happy: 1, px: 0, petPx: 0 });
  c.restore();
  const d = new Date();
  c.fillStyle = '#ff6fa8'; c.font = `900 30px "Hiragino Maru Gothic ProN",sans-serif`; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText('きょうの コーデ', 34, H - 56);
  c.fillStyle = '#b9a8c2'; c.font = `700 20px sans-serif`; c.textAlign = 'right'; c.fillText(`${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`, W - 34, H - 54);
  c.font = `34px ${EMO}`; c.fillStyle = '#000'; c.fillText('💖', W - 150, H - 56);
  return cv.toDataURL('image/jpeg', .82);
}
$('#btnPhoto').addEventListener('click', () => {
  audio(); SFX.shutter();
  const f = $('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  const url = takePhoto();
  album.unshift(url); if (album.length > 12) album.length = 12;
  while (!store.set('album', album) && album.length > 1) album.pop();
  $('#photoImg').src = url;
  setTimeout(() => $('#photoOv').classList.add('open'), 350);
});
$('#photoOk').addEventListener('click', () => { $('#photoOv').classList.remove('open'); giveGift(); });
function giveGift() {
  const pool = []; for (const ct of CATS) if (ct.list) for (const it of ct.list) if (isLocked(it)) pool.push([ct, it]);
  if (!pool.length) return;
  const [ct, it] = pick(pool);
  meta.unlocked.push(it.id); store.set('meta', meta);
  const cv = $('#giftCv'), c = cv.getContext('2d'); c.clearRect(0, 0, 200, 200);
  if (it.emoji) { c.font = `130px ${EMO}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000'; c.fillText(it.emoji, 100, 108); } else thumb(cv, ct.id, it);
  $('#giftName').textContent = `${it.name || 'ユニコーン'} を もらったよ！`;
  $('#giftBox').style.animation = 'none'; void $('#giftBox').offsetWidth; $('#giftBox').style.animation = '';
  $('#giftWear').onclick = () => { $('#giftOv').classList.remove('open'); cat = ct.id; renderTabs(); choose(it); };
  SFX.gift(); $('#giftOv').classList.add('open');
}
function renderAlbum() {
  const g = $('#albumGrid'); g.innerHTML = '';
  $('#albumMsg').innerHTML = album.length ? 'しゃしんを ながおし すると ほぞん できるよ' : 'まだ しゃしんが ないよ。<br>📷 で とってみよう！';
  for (const u of album) { const im = document.createElement('img'); im.src = u; im.style.webkitTouchCallout = 'default'; g.appendChild(im); }
  $('#albumClear').style.display = album.length ? '' : 'none';
}
$('#btnAlbum').addEventListener('click', () => { audio(); renderAlbum(); $('#albumOv').classList.add('open'); });
$('#albumClose').addEventListener('click', () => $('#albumOv').classList.remove('open'));
$('#albumClear').addEventListener('click', () => { if (confirm('アルバムの しゃしんを ぜんぶ けしますか？')) { album = []; store.set('album', album); renderAlbum(); } });
$('#btnSound').addEventListener('click', () => { meta.sound = !meta.sound; store.set('meta', meta); $('#btnSound').textContent = meta.sound ? '🔊' : '🔇'; audio(); SFX.tick(); });
$('#btnSound').textContent = meta.sound ? '🔊' : '🔇';

// iPad の ダブルタップ・ピンチ かくだい を とめる
let lastTouch = 0;
document.addEventListener('touchend', e => { const t = Date.now(); if (t - lastTouch < 350 && !e.target.closest('button,a,img')) e.preventDefault(); lastTouch = t; }, { passive: false });
for (const ev of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });

// ほぞんデータの しゅうふく（しらない アイテムは もとに もどす）
function sane() {
  const ok = (list, o) => o && byId(list, o.id);
  if (!ok(HAIR, S.hair)) S.hair = { ...DEF.hair }; if (!ok(TOPS, S.top)) S.top = { ...DEF.top }; if (!ok(BOTTOMS, S.bottom)) S.bottom = { ...DEF.bottom };
  for (const [k, l] of [['dress', DRESSES], ['shoes', SHOES], ['socks', SOCKS], ['head', HEADS], ['face', FACES], ['back', BACKS], ['hand', HANDS], ['pet', PETS]]) if (S[k] && !ok(l, S[k])) S[k] = null;
  if (!byId(BGS, S.bg)) S.bg = 'room';
}
sane(); resize(); renderTabs(); renderItems(); renderColors();
requestAnimationFrame(loop);
</script>
</body>
