<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>ごっこ げきじょう</title>
<style>
  :root{ --ink:#5a4466; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:#2b2140;overscroll-behavior:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Rounded Mplus 1c","Yu Gothic",system-ui,sans-serif}
  .emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  button{font:inherit;color:inherit;border:none;cursor:pointer;padding:0;background:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #wrap{position:relative;flex:1;min-height:0}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #bar{flex:none;display:flex;align-items:center;justify-content:safe center;gap:4px;padding:8px 6px calc(8px + var(--sb));background:#fff;
    border-radius:22px 22px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.25);overflow-x:auto;scrollbar-width:none}
  #bar::-webkit-scrollbar{display:none}
  .eb{flex:none;width:clamp(40px,10.4vw,62px);height:clamp(44px,11vw,62px);border-radius:16px;background:#fbeff5;font-size:clamp(22px,6.4vw,34px);display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 0 #e8c9d8}
  .eb:active{transform:translateY(2px);box-shadow:0 1px 0 #e8c9d8}
  .sep{flex:none;width:2px;height:40px;background:#f0dbe6;margin:0 2px}
  #mic{background:#ffe08a;box-shadow:0 3px 0 #e0b84a}
  #mic.on{background:#ff6f91;animation:pulse .6s infinite alternate}
  #rec{background:#ffd0d0;box-shadow:0 3px 0 #e8a0a0}
  #rec.on{background:#ff3b5c;color:#fff;animation:pulse .6s infinite alternate}
  @keyframes pulse{to{transform:scale(1.08)}}
  .top{position:absolute;top:calc(8px + var(--st));display:flex;gap:8px;z-index:3}
  .top.l{left:8px} .top.r{right:8px}
  .rb{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.92);font-size:24px;box-shadow:0 3px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;text-decoration:none}
  .rb:active{transform:translateY(2px)}
  #recInfo{position:absolute;left:50%;top:calc(10px + var(--st));transform:translateX(-50%);background:rgba(255,59,92,.92);color:#fff;font-weight:900;padding:8px 16px;border-radius:999px;
    display:none;z-index:3;font-size:17px;white-space:nowrap}
  #recInfo.on{display:block}
  #big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:4;font-weight:900;color:#fff;
    font-size:clamp(70px,22vw,150px);text-shadow:0 6px 0 #ff6f91,0 0 30px rgba(255,111,145,.8);opacity:0}
  #big.show{animation:bigp .9s ease}
  @keyframes bigp{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.1)}80%{opacity:1;transform:scale(1)}100%{opacity:0}}
  #micInfo{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:999px;padding:10px 20px;font-weight:900;font-size:18px;
    display:none;z-index:3;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  #micInfo.on{display:block}
  #micLv{display:inline-block;width:80px;height:12px;border-radius:6px;background:#f0dbe6;vertical-align:middle;margin-left:8px;overflow:hidden}
  #micLv i{display:block;height:100%;width:0;background:#ff6f91}
  #toast{position:fixed;left:50%;top:calc(70px + var(--st));transform:translateX(-50%);background:rgba(90,68,102,.92);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;
    z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;font-size:15px}
  #toast.on{opacity:1}

  .ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(40,20,60,.55)}
  .ov.open{display:flex}
  .card{background:#fff;border-radius:28px;padding:20px 18px;width:min(94vw,520px);max-height:92vh;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
    box-shadow:0 14px 40px rgba(0,0,0,.35)}
  .card h2{margin:0;font-size:26px;color:#ff6fa8}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;width:100%}
  .pick{border-radius:20px;background:#fdf4f8;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:16px;border:4px solid transparent;position:relative}
  .pick canvas,.pick img{width:100%;border-radius:12px;display:block}
  .pick.on{border-color:#ff8fb8;background:#fff0f6}
  .pick .del{position:absolute;top:-6px;right:-6px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);font-size:15px}
  .big{width:100%;min-height:58px;border-radius:999px;font-size:21px;font-weight:900;color:#fff;background:#ff8fb8;box-shadow:0 6px 0 #e8689a}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 #e8689a}
  .big.gray{background:#b9b2c6;box-shadow:0 6px 0 #9189a3;min-height:48px;font-size:17px}
  #playUI{position:fixed;inset:0;z-index:15;display:none}
  #playUI.on{display:block}
  #playClose{position:absolute;top:calc(10px + var(--st));right:10px}
  #playEnd{position:absolute;left:50%;bottom:calc(20px + var(--sb));transform:translateX(-50%);display:none;gap:10px;width:min(90vw,420px)}
  #playEnd.on{display:flex}
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div class="top l">
      <a class="rb emo" href="../gameselect.html" aria-label="ゲームを えらぶ">🏠</a>
      <button class="rb emo" id="btnSet" aria-label="ぶたい">🖼️</button>
      <button class="rb emo" id="btnFriends" aria-label="なかま">👫</button>
    </div>
    <div class="top r">
      <button class="rb emo" id="btnTheater" aria-label="げきじょう">📺</button>
      <button class="rb emo" id="btnSound" aria-label="おと">🔊</button>
    </div>
    <div id="recInfo">● ろくがちゅう 0</div>
    <div id="micInfo">🎤 しゃべってね！<span id="micLv"><i></i></span></div>
    <div id="big"></div>
  </div>
  <div id="bar">
    <button class="eb emo" data-e="happy">😆</button>
    <button class="eb emo" data-e="cry">😢</button>
    <button class="eb emo" data-e="surprise">😲</button>
    <button class="eb emo" data-e="angry">😡</button>
    <button class="eb emo" data-e="sleep">😴</button>
    <button class="eb emo" data-e="dance">💃</button>
    <span class="sep"></span>
    <button class="eb emo" id="mic" aria-label="こえ">🎤</button>
    <button class="eb emo" id="rec" aria-label="ろくが">🎬</button>
  </div>
</div>

<div class="ov" id="setOv"><div class="card"><h2>どこで あそぶ？</h2><div class="grid" id="setGrid"></div></div></div>
<div class="ov" id="friendOv"><div class="card"><h2>だれを だす？</h2><div class="grid" id="friendGrid"></div><button class="big" id="friendOk">OK</button></div></div>
<div class="ov" id="doneOv"><div class="card">
  <h2>🎬 できた！</h2><p style="margin:0;font-weight:800">げきじょうで みてみよう</p>
  <button class="big" id="doneWatch">▶ みる</button><button class="big gray" id="doneClose">あとで</button>
</div></div>
<div class="ov" id="theaterOv"><div class="card"><h2>📺 げきじょう</h2><p id="thMsg" style="margin:0;font-weight:700"></p><div class="grid" id="thGrid"></div>
  <button class="big gray" id="thClose">とじる</button></div></div>
<div id="playUI">
  <button class="rb emo" id="playClose">✖️</button>
  <div id="playEnd"><button class="big" id="playAgain">🔁 もういちど</button><button class="big gray" id="playBack">もどる</button></div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   ごっこ げきじょう v0.1
   - オリジナルの どうぶつたちを うごかして ごっこあそび
   - なげる・おとす・びっくりさせる と おおげさに リアクション
   - じぶんの こえで しゃべらせて、ろくがして げきじょうで みられる
   - 外部ライブラリ・画像ファイル・外部通信なし（GitHub Pages に置くだけで動作）
   - ろくがは この たんまつの localStorage と IndexedDB（こえ）に ほぞん
   ========================================================= */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const now = () => performance.now() / 1000;
const store = {
  get(k, d) { try { const v = localStorage.getItem('gekijo_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gekijo_' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
let meta = Object.assign({ sound: true, set: 'room', cast: ['usa', 'kuma', 'piyo'] }, store.get('meta', {}));
const saveMeta = () => store.set('meta', meta);

/* ---------- なかま（オリジナル キャラ） ---------- */
const KINDS = {
  usa:  { name: 'うさこ', col: '#ffbcd5', dark: '#e88aae', belly: '#fff0f5', pitch: 620, ears: 'rabbit' },
  kuma: { name: 'くまた', col: '#dba46b', dark: '#b07a45', belly: '#f7dcb6', pitch: 300, ears: 'bear' },
  nyan: { name: 'にゃんこ', col: '#f4f1f7', dark: '#bdb4cc', belly: '#ffffff', pitch: 720, ears: 'cat' },
  wan:  { name: 'わんた', col: '#f3cf8f', dark: '#c99a55', belly: '#fff3dc', pitch: 440, ears: 'dog' },
  piyo: { name: 'ぴよ', col: '#ffe066', dark: '#e8b92a', belly: '#fff6c2', pitch: 900, ears: 'chick' },
};
const SAY = {
  happy: ['わーい！', 'やったー！', 'うれしい！'], cry: ['えーん', 'かなしいよ〜'], surprise: ['えっ！？', 'びっくり！'], angry: ['ぷんぷん！', 'もう〜！'],
  sleep: ['すやすや…'], dance: ['ルンルン♪', 'おどろう♪'], fly: ['わぁぁ〜！', 'ひゃ〜！', 'たすけて〜！'], pain: ['いたっ！', 'いたた…'], dizzy: ['めがまわる〜'],
  scared: ['こわいよ〜', 'まっくら！'], eat: ['おいしい！', 'もぐもぐ'], bed: ['ぽよーん！'], tickle: ['きゃはは！', 'くすぐったい！'], wall: ['ぎゃっ！'], rain: ['つめたい！'], rainbow: ['にじだ！'],
  slide: ['わーい！'], pinch: ['はさまった！'], bell: ['なになに！？'],
};

/* ---------- ぶたい ---------- */
const LW = 1000, LH = 600, FLOOR = 520;
const SETS = {
  room: { name: 'おへや' },
  elev: { name: 'エレベーター' },
  park: { name: 'こうえん' },
};
const BED = { x0: 720, x1: 930, y: 440 }, TABLE = { x0: 360, x1: 500, y: 440 }, SWITCH = { x: 92, y: 300 }, CAKE = { x: 430, y: 440 };
const CAR = { x0: 410, x1: 590, top: 250 };
const BTNS = [{ k: 3, y: 270 }, { k: 2, y: 318 }, { k: 1, y: 366 }, { k: 'open', y: 420 }, { k: 'close', y: 466 }, { k: 'bell', y: 212 }];
const PANEL_X = 650;
const SLIDE = { lx: 620, top: 330, px0: 590, px1: 668, rx0: 668, rx1: 880, ry1: 498 };
const CLOUD = { x: 500, y: 74 };
function rampY(x) { return SLIDE.top + (x - SLIDE.rx0) / (SLIDE.rx1 - SLIDE.rx0) * (SLIDE.ry1 - SLIDE.top); }

/* ---------- せかい ---------- */
function newWorld(set) {
  return { set, light: true, cake: 0, rain: false, rainbow: 0, elev: { floor: 1, queue: [], state: 'idle', door: 1, t: 0, shake: 0, rides: 0 }, chars: [] };
}
let W = newWorld(meta.set);
let uid = 1;
function addChar(kind, x) {
  const ch = { id: uid++, kind, x: x ?? rnd(150, 850), y: FLOOR - 200, vx: 0, vy: 0, rot: 0, sq: 0, sqv: 0, face: 'normal', faceT: 0, talk: 0, talkUntil: 0, dir: 1,
    held: false, ground: false, air: 0, screamed: false, floor: W.elev.floor, inCar: false, bubble: null, bubbleT: 0, blinkT: rnd(1, 4), danceT: 0, onBed: 0, sliding: false };
  W.chars.push(ch); return ch;
}
function castWorld() { W.chars = []; meta.cast.forEach((k, i) => addChar(k, 200 + i * (600 / Math.max(1, meta.cast.length - 1 || 1)))); selected = W.chars[0] || null; }
let selected = null;

/* ---------- おと ---------- */
let AC = null, master = null, noiseBuf = null, rainNode = null;
function audio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = meta.sound ? .9 : 0; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function osc(type, f, d, { vol = .1, to = null, delay = 0, vib = 0, att = .01, dest = null } = {}) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  if (vib) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = vib; lg.gain.value = f * .06; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + d + .05); }
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(dest || master); o.start(t); o.stop(t + d + .05);
}
function noise(d, { vol = .1, f = 1000, q = 1, type = 'bandpass', delay = 0, att = .005 } = {}) {
  if (!AC) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(g).connect(master); s.start(t, Math.random() * .5); s.stop(t + d + .05);
}
const SFX = {
  babble(p, d = .9) { const n = Math.max(2, Math.round(d / .13)); for (let i = 0; i < n; i++) { osc('triangle', p * rnd(.85, 1.35), .1, { vol: .07, delay: i * .13 }); osc('square', p * rnd(1.8, 2.4), .06, { vol: .015, delay: i * .13 }); } },
  scream(p) { osc('sawtooth', p * 1.7, .9, { vol: .05, to: p * .8, vib: 9 }); osc('triangle', p * 1.7, .9, { vol: .05, to: p * .8, vib: 9 }); },
  giggle(p) { for (let i = 0; i < 4; i++) osc('triangle', p * (1.4 + i * .12), .08, { vol: .08, delay: i * .09, vib: 20 }); },
  cry(p) { osc('sine', p * 1.3, .55, { vol: .1, to: p * .9, vib: 7 }); osc('sine', p * 1.25, .7, { vol: .1, to: p * .8, vib: 7, delay: .6 }); },
  angry(p) { for (let i = 0; i < 2; i++) osc('square', p * .6, .14, { vol: .05, to: p * .45, delay: i * .2 }); },
  surprise(p) { osc('triangle', p, .25, { vol: .1, to: p * 2.4 }); },
  happy(p) { [1, 1.25, 1.5, 2].forEach((k, i) => osc('triangle', p * k, .12, { vol: .07, delay: i * .07 })); },
  sleep() { for (let i = 0; i < 3; i++) noise(.5, { vol: .03, f: 500, q: .7, delay: i * .7, att: .2 }); },
  dance() { [523, 659, 784, 659, 523, 659, 784, 1047].forEach((f, i) => osc('triangle', f, .14, { vol: .05, delay: i * .18 })); },
  pain(p) { osc('square', p * 1.2, .18, { vol: .05, to: p * .6 }); },
  thud() { osc('sine', 140, .25, { vol: .3, to: 45 }); noise(.12, { vol: .15, f: 300, type: 'lowpass' }); },
  boing() { osc('triangle', 180, .32, { vol: .14, to: 620, vib: 14 }); },
  swoosh() { noise(.35, { vol: .08, f: 1800, q: .6, att: .1 }); },
  stars() { for (let i = 0; i < 5; i++) osc('sine', 1600 + i * 220, .1, { vol: .04, delay: i * .06 }); },
  click() { osc('square', 1800, .03, { vol: .05 }); },
  chomp() { for (let i = 0; i < 3; i++) noise(.06, { vol: .14, f: 900, q: 2, delay: i * .14 }); },
  pop() { osc('sine', 500, .1, { vol: .1, to: 1100 }); },
  ding() { osc('sine', 1319, .7, { vol: .12 }); osc('sine', 1047, .9, { vol: .12, delay: .32 }); },
  hum() { osc('sawtooth', 70, 1.2, { vol: .04, att: .3 }); },
  door() { noise(.5, { vol: .05, f: 600, q: .5, att: .1 }); },
  bell() { for (let i = 0; i < 12; i++) osc('square', i % 2 ? 1500 : 1700, .07, { vol: .03, delay: i * .07 }); },
  btn() { osc('sine', 880, .06, { vol: .08 }); },
  applause() { for (let i = 0; i < 60; i++) noise(.05, { vol: rnd(.04, .1), f: rnd(1500, 3500), q: 1.5, delay: rnd(0, 2.6) }); },
  curtain() { noise(1.2, { vol: .05, f: 800, q: .4, att: .4 }); },
  fanfare() { [[523, 0], [659, .15], [784, .3], [1047, .48]].forEach(([f, d]) => osc('triangle', f, .4, { vol: .09, delay: d })); },
  thunderless() {},
};
function rainSound(on) {
  if (!AC) return;
  if (on && !rainNode) {
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = 'highpass'; f.frequency.value = 2500; g.gain.value = .035;
    s.connect(f).connect(g).connect(master); s.start(); rainNode = s;
  } else if (!on && rainNode) { try { rainNode.stop(); } catch (e) {} rainNode = null; }
}

/* ---------- できごと（ろくがの ために ぜんぶ ここを とおす） ---------- */
let rec = null, play = null;
function EV(type, p) { if (rec) rec.events.push([+(now() - rec.t0).toFixed(3), type, p]); run(type, p); }
function run(type, p) {
  if (type === 'sfx') { const fn = SFX[p.n]; if (fn) fn(...(p.a || [])); }
  else if (type === 'fx') spawn(p.n, p.x, p.y);
  else if (type === 'bub') { const ch = findChar(p.id); if (ch) { ch.bubble = p.text; ch.bubbleT = 2.2; } }
  else if (type === 'voice') playVoice(p.clip, findChar(p.id));
  else if (type === 'rain') rainSound(p.on);
}
function findChar(id) { return (play ? play.chars : W.chars).find(c => c.id === id); }
function react(ch, kind, opts = {}) {
  const K = KINDS[ch.kind];
  if (kind !== 'normal') { ch.face = kind; ch.faceT = opts.dur || 2.2; }
  if (opts.say !== false && SAY[kind]) EV('bub', { id: ch.id, text: pick(SAY[kind]) });
  if (opts.snd !== false) {
    const s = { happy: 'happy', cry: 'cry', surprise: 'surprise', angry: 'angry', sleep: 'sleep', dance: 'dance', fly: 'scream', pain: 'pain', dizzy: 'cry', scared: 'scream', eat: 'chomp', tickle: 'giggle', wall: 'pain', rain: 'surprise', rainbow: 'happy', slide: 'happy', pinch: 'pain', bell: 'surprise' }[kind];
    if (s) EV('sfx', { n: s, a: [K.pitch] });
  }
  ch.talkUntil = now() + .7;
}

/* ---------- つぶつぶ ---------- */
let parts = [];
function spawn(n, x, y) {
  const P = (o) => parts.push(Object.assign({ x, y, vx: 0, vy: 0, g: 0, life: 1, max: 1, r: 10, rot: 0, vr: 0 }, o));
  if (n === 'hearts') for (let i = 0; i < 6; i++) P({ k: 'heart', x: x + rnd(-40, 40), y: y + rnd(-20, 10), vy: rnd(-120, -60), vx: rnd(-30, 30), life: 1.4, max: 1.4, r: rnd(9, 15), col: pick(['#ff6f91', '#ff9ac0']) });
  else if (n === 'stars') for (let i = 0; i < 10; i++) { const a = rnd(0, TAU), s = rnd(120, 300); P({ k: 'star', vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, g: 500, life: .8, max: .8, r: rnd(7, 12), col: pick(['#ffd54a', '#fff3a0', '#ffffff']), vr: rnd(-6, 6) }); }

    if (!mic || mic.stop) { stream.getTracks().forEach(t => t.stop()); if (mic && mic.quick) babbleTalk(mic.ch); mic = null; return; }
    mic.stream = stream;
    const src = AC.createMediaStreamSource(stream), sp = AC.createScriptProcessor(4096, 1, 1), z = AC.createGain(); z.gain.value = 0;
    sp.onaudioprocess = ev => { if (!mic) return; const d = ev.inputBuffer.getChannelData(0); mic.chunks.push(new Float32Array(d)); let m = 0; for (let i = 0; i < d.length; i += 16) m = Math.max(m, Math.abs(d[i])); $('#micLv i').style.width = Math.min(100, m * 220) + '%'; };
    src.connect(sp); sp.connect(z); z.connect(AC.destination); mic.src = src; mic.sp = sp;
    $('#mic').classList.add('on'); $('#micInfo').classList.add('on');
    mic.limit = setTimeout(micStop, 6000);
  } catch (err) { mic = null; toast('マイクが つかえないので おしゃべり するね'); babbleTalk(ch); }
}
function micStop() {
  if (!mic) return;
  const m = mic; m.stop = true;
  if (!m.stream) return;   // まだ じゅんびちゅう（クイックタップ）
  mic = null; clearTimeout(m.limit);
  $('#mic').classList.remove('on'); $('#micInfo').classList.remove('on');
  try { m.src.disconnect(); m.sp.disconnect(); } catch (e) {}
  m.stream.getTracks().forEach(t => t.stop());
  const len = m.chunks.reduce((a, c) => a + c.length, 0);
  if (len < AC.sampleRate * .25) { babbleTalk(m.ch); return; }
  const data = new Float32Array(len); let o = 0; for (const c of m.chunks) { data.set(c, o); o += c.length; }
  // ちいさい おとを ととのえる
  let peak = 0; for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(data[i]));
  const k = peak > 0 ? Math.min(6, .9 / peak) : 1; for (let i = 0; i < len; i++) data[i] *= k;
  const buf = AC.createBuffer(1, len, AC.sampleRate); buf.copyToChannel(data, 0);
  const id = 'c' + Date.now() + (Math.random() * 1000 | 0);
  clips[id] = buf;
  if (rec) rec.clips.push(id);
  EV('voice', { id: m.ch.id, clip: id });
}
function babbleTalk(ch) { const d = rnd(.8, 1.4); EV('sfx', { n: 'babble', a: [KINDS[ch.kind].pitch, d] }); ch.talkUntil = now() + d; EV('bub', { id: ch.id, text: pick(['〜♪', 'ペチャクチャ', 'ねぇねぇ！', 'あのね〜']) }); }
function playVoice(clipId, ch) {
  const buf = clips[clipId];
  if (!ch) return;
  if (!buf || !AC) { SFX.babble(KINDS[ch.kind].pitch, 1); ch.talkUntil = now() + 1; return; }
  const s = AC.createBufferSource(), an = AC.createAnalyser(); an.fftSize = 512;
  s.buffer = buf; s.playbackRate.value = 1.45;   // ちょっと たかい こえ
  s.connect(an); an.connect(master); s.start();
  ch.voiceAn = an; s.onended = () => { if (ch.voiceAn === an) ch.voiceAn = null; };
}
const micBtn = $('#mic');
micBtn.addEventListener('pointerdown', e => { e.preventDefault(); if (!play) micStart(); });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) micBtn.addEventListener(ev, () => { if (mic) { if (!mic.stream) { mic.stop = true; } else micStop(); } });

/* ---------- ろくが ---------- */
const MAXREC = 60;
function snap() {
  return { t: +(now() - rec.t0).toFixed(3), set: W.set, light: W.light, cake: W.cake, rain: W.rain, rb: +W.rainbow.toFixed(2),
    el: [W.elev.floor, +W.elev.door.toFixed(3), +W.elev.shake.toFixed(2), W.elev.state === 'moving' ? (W.elev.queue[0] > W.elev.floor ? 1 : -1) : 0, W.elev.queue.slice()],
    c: W.chars.map(ch => [ch.id, ch.kind, Math.round(ch.x), Math.round(ch.y), +ch.rot.toFixed(3), +ch.sq.toFixed(3), ch.face, +ch.talk.toFixed(2), ch.floor, ch.blinkT < 0 ? 1 : 0, ch.held ? 1 : 0, ch.ground ? 1 : 0]) };
}
let recTick = 0;
function recStart() {
  if (rec) return;
  audio();
  let n = 3; const big = $('#big');
  const tick = () => {
    big.textContent = n > 0 ? n : 'スタート！'; big.classList.remove('show'); void big.offsetWidth; big.classList.add('show');
    if (n > 0) { SFX.click(); n--; setTimeout(tick, 800); }
    else { SFX.fanfare(); rec = { t0: now(), frames: [], events: [], clips: [], startSet: W.set }; rec.frames.push(snap()); $('#rec').classList.add('on'); $('#rec').textContent = '⏹️'; $('#recInfo').classList.add('on'); }
  };
  tick();
}
function recStop() {
  if (!rec) return;
  const r = rec; rec = null;
  r.frames.push((() => { rec = r; const s = snap(); rec = null; return s; })());
  $('#rec').classList.remove('on'); $('#rec').textContent = '🎬'; $('#recInfo').classList.remove('on');
  const dur = r.frames[r.frames.length - 1].t;
  if (dur < 1.5) { toast('みじかすぎたよ'); return; }
  const item = { id: 'p' + Date.now(), date: Date.now(), dur, frames: r.frames, events: r.events, clips: r.clips, thumb: makeThumb() };
  savePlay(item);
  lastPlay = item; $('#doneOv').classList.add('open');
}
$('#rec').addEventListener('click', () => { if (play) return; if (rec) recStop(); else recStart(); });
function makeThumb() {
  const tc = document.createElement('canvas'); tc.width = 320; tc.height = 192;
  const c = tc.getContext('2d'), sv = [DPR, S, OX, OY, CW, CH];
  DPR = 1; S = .32; OX = 0; OY = 0; CW = 320; CH = 192;
  renderWorld(c, W, W.chars, now(), 0, null);
  [DPR, S, OX, OY, CW, CH] = sv;
  return tc.toDataURL('image/jpeg', .7);
}

/* ---------- ほぞん（こえは IndexedDB） ---------- */
let plays = store.get('plays', []), lastPlay = null;
const idb = { db: null,
  open() { return new Promise(res => { if (this.db) return res(this.db); try { const r = indexedDB.open('gekijo', 1); r.onupgradeneeded = () => r.result.createObjectStore('clips'); r.onsuccess = () => res(this.db = r.result); r.onerror = () => res(null); } catch (e) { res(null); } }); },
  async put(k, v) { const db = await this.open(); if (!db) return; return new Promise(res => { const tx = db.transaction('clips', 'readwrite'); tx.objectStore('clips').put(v, k); tx.oncomplete = res; tx.onerror = res; }); },
  async get(k) { const db = await this.open(); if (!db) return null; return new Promise(res => { const q = db.transaction('clips').objectStore('clips').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); },
  async del(k) { const db = await this.open(); if (!db) return; db.transaction('clips', 'readwrite').objectStore('clips').delete(k); },
};
function savePlay(item) {
  plays.unshift(item);
  while (plays.length > 6) { const old = plays.pop(); (old.clips || []).forEach(k => idb.del(k)); }
  while (!store.set('plays', plays) && plays.length > 1) { const old = plays.pop(); (old.clips || []).forEach(k => idb.del(k)); }
  for (const k of item.clips) { const b = clips[k]; if (b) idb.put(k, { sr: b.sampleRate, d: b.getChannelData(0) }); }
}
async function loadClips(item) {
  audio();
  for (const k of item.clips || []) {
    if (clips[k]) continue;
    const v = await idb.get(k);
    if (v && AC) { const b = AC.createBuffer(1, v.d.length, v.sr); b.copyToChannel(new Float32Array(v.d), 0); clips[k] = b; }
  }
}

/* ---------- げきじょう（さいせい） ---------- */
async function startPlay(item) {
  await loadClips(item);
  document.querySelectorAll('.ov').forEach(o => o.classList.remove('open'));
  const f0 = item.frames[0];
  play = { item, t: -2.2, fi: 0, ei: 0, w: newWorld(f0.set), chars: [], curtain: 1, ending: 0, done: false };
  parts = [];
  $('#playUI').classList.add('on'); $('#playEnd').classList.remove('on');
  SFX.curtain();
}
function playStep(dt) {
  const P = play, it = P.item;
  P.t += dt;
  if (P.t < 0) { P.curtain = P.t < -1.2 ? 1 : clamp(-P.t / 1.2, 0, 1); }
  else if (P.t <= it.dur) P.curtain = 0;
  const t = clamp(P.t, 0, it.dur);
  const F = it.frames;
  while (P.fi < F.length - 2 && F[P.fi + 1].t <= t) P.fi++;
  const a = F[P.fi], b = F[Math.min(P.fi + 1, F.length - 1)], k = b.t > a.t ? clamp((t - a.t) / (b.t - a.t), 0, 1) : 0;
  const w = P.w;
  w.set = a.set; w.light = a.light; w.cake = a.cake; w.rainbow = a.rb;
  if (w.rain !== a.rain) { w.rain = a.rain; }
  w.elev.floor = a.el[0]; w.elev.door = lerp(a.el[1], b.el[1], k); w.elev.shake = a.el[2]; w.elev.state = a.el[3] ? 'moving' : 'idle'; w.elev.queue = a.el[4].length ? a.el[4] : (a.el[3] ? [a.el[0] + a.el[3]] : []);
  const map = new Map(P.chars.map(c => [c.id, c]));
  P.chars = a.c.map(r => {
    const rb = b.c.find(q => q[0] === r[0]) || r;
    const ch = map.get(r[0]) || { id: r[0], bubble: null, bubbleT: 0 };
    Object.assign(ch, { kind: r[1], x: lerp(r[2], rb[2], k), y: lerp(r[3], rb[3], k), rot: lerp(r[4], rb[4], k), sq: lerp(r[5], rb[5], k), face: r[6], floor: r[8], blinkT: r[9] ? -1 : 1, held: !!r[10], ground: !!r[11] });
    if (!ch.voiceAn) ch.talk = lerp(r[7], rb[7], k); else { const an = ch.voiceAn, d = new Uint8Array(an.fftSize); an.getByteTimeDomainData(d); let m = 0; for (const v of d) m = Math.max(m, Math.abs(v - 128)); ch.talk = clamp(m / 50, 0, 1); }
    if (ch.bubbleT > 0) { ch.bubbleT -= dt; if (ch.bubbleT <= 0) ch.bubble = null; }
    return ch;
  });
  const E = it.events;
  while (P.ei < E.length && E[P.ei][0] <= t && P.t >= 0) { const [, ty, p] = E[P.ei++]; run(ty, p); }
  if (P.t > it.dur && !P.done) {
    P.ending += dt; P.curtain = clamp(P.ending / 1.2, 0, 1);
    if (P.ending > 1.2) { P.done = true; rainSound(false); SFX.applause(); spawn('sparkle', LW / 2, 200); spawn('sparkle', 300, 300); spawn('sparkle', 700, 300); $('#playEnd').classList.add('on'); }
  }
}
function drawCurtain(c, k, t, title, ended) {
  if (k <= 0 && !ended) return;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const half = CW / 2 * k;
  for (const s of [0, 1]) {
    const x0 = s ? CW - half : 0;
    const g = c.createLinearGradient(x0, 0, x0 + half, 0); g.addColorStop(0, '#c2185b'); g.addColorStop(.5, '#e91e63'); g.addColorStop(1, '#ad1457');
    c.fillStyle = g; c.fillRect(x0, 0, half, CH);
    c.strokeStyle = 'rgba(0,0,0,.15)'; c.lineWidth = 3; for (let x = x0 + 20; x < x0 + half; x += 34) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, CH); c.stroke(); }
  }
  c.fillStyle = '#ffd54a'; c.fillRect(0, 0, CW, Math.min(46, CH * .07));
  if (k > .9) {
    c.font = `900 ${Math.min(CW, CH) * .11}px "Hiragino Maru Gothic ProN",sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.lineWidth = 10; c.strokeStyle = '#7a1040'; c.strokeText(title, CW / 2, CH / 2); c.fillStyle = '#fff'; c.fillText(title, CW / 2, CH / 2);
  }
}
$('#playClose').addEventListener('click', endPlay); $('#playBack').addEventListener('click', endPlay);
$('#playAgain').addEventListener('click', () => { const it = play.item; startPlay(it); });
function endPlay() { if (!play) return; play = null; rainSound(W.rain); parts = []; $('#playUI').classList.remove('on'); }
$('#doneWatch').addEventListener('click', () => { $('#doneOv').classList.remove('open'); startPlay(lastPlay); });
$('#doneClose').addEventListener('click', () => $('#doneOv').classList.remove('open'));

function renderTheater() {
  const g = $('#thGrid'); g.innerHTML = '';
  $('#thMsg').textContent = plays.length ? 'みたい げきを えらんでね' : 'まだ ないよ。🎬 で ろくが してみよう！';
  plays.forEach((it, i) => {
    const d = new Date(it.date), b = document.createElement('div'); b.className = 'pick';
    b.innerHTML = `<img src="${it.thumb}" alt=""><span>${d.getMonth() + 1}/${d.getDate()} の げき</span><button class="del emo">✖️</button>`;
    b.addEventListener('click', e => { if (e.target.classList.contains('del')) { if (confirm('この げきを けしますか？')) { (it.clips || []).forEach(k => idb.del(k)); plays.splice(i, 1); store.set('plays', plays); renderTheater(); } return; } startPlay(it); });
    g.appendChild(b);
  });
}
$('#btnTheater').addEventListener('click', () => { audio(); if (rec) recStop(); renderTheater(); $('#theaterOv').classList.add('open'); });
$('#thClose').addEventListener('click', () => $('#theaterOv').classList.remove('open'));

/* ---------- ぶたい・なかま えらび ---------- */
function setThumb(set) {
  const tc = document.createElement('canvas'); tc.width = 260; tc.height = 156;
  const c = tc.getContext('2d'), sv = [DPR, S, OX, OY, CW, CH];
  DPR = 1; S = .26; OX = 0; OY = 0; CW = 260; CH = 156;
  const w = newWorld(set); renderWorld(c, w, [], 0, 0, null);
  [DPR, S, OX, OY, CW, CH] = sv; return tc;
}
$('#btnSet').addEventListener('click', () => {
  audio(); const g = $('#setGrid'); g.innerHTML = '';
  for (const k in SETS) {
    const b = document.createElement('button'); b.className = 'pick' + (W.set === k ? ' on' : '');
    b.appendChild(setThumb(k)); b.insertAdjacentHTML('beforeend', `<span>${SETS[k].name}</span>`);
    b.addEventListener('click', () => { changeSet(k); $('#setOv').classList.remove('open'); });
    g.appendChild(b);
  }
  $('#setOv').classList.add('open');
});
$('#setOv').addEventListener('click', e => { if (e.target.id === 'setOv') $('#setOv').classList.remove('open'); });
function changeSet(k) {
  const was = W.set; W.set = k; meta.set = k; saveMeta();
  W.light = true; W.rain = false; W.rainbow = 0; rainSound(false);
  W.elev = { floor: 1, queue: [], state: 'idle', door: 1, t: 0, shake: 0, rides: 0 };
  W.chars.forEach((ch, i) => { ch.floor = 1; ch.inCar = false; ch.x = 160 + i * (680 / Math.max(1, W.chars.length - 1)); ch.y = 200; ch.vx = 0; ch.vy = 0; ch.face = 'normal'; ch.faceT = 0; ch.danceT = 0; });
  EV('sfx', { n: 'pop' });
}
function chPreview(kind) {
  const tc = document.createElement('canvas'); tc.width = 160; tc.height = 160; const c = tc.getContext('2d');
  c.translate(80, 150); c.scale(.85, .85); drawChar(c, { kind, x: 0, y: 0, rot: 0, sq: 0, face: 'happy', talk: 0, blinkT: 1, id: 1, held: false, ground: true }, 0, false);
  return tc;
}
$('#btnFriends').addEventListener('click', () => {
  audio(); const g = $('#friendGrid'); g.innerHTML = '';
  for (const k in KINDS) {
    const b = document.createElement('button'); b.className = 'pick' + (W.chars.some(c => c.kind === k) ? ' on' : '');
    b.appendChild(chPreview(k)); b.insertAdjacentHTML('beforeend', `<span>${KINDS[k].name}</span>`);
    b.addEventListener('click', () => {
      const ex = W.chars.find(c => c.kind === k);
      if (ex) { if (W.chars.length <= 1) { toast('ひとりは いないと さみしいよ'); return; } W.chars = W.chars.filter(c => c !== ex); if (selected === ex) selected = W.chars[0]; }
      else { const ch = addChar(k, rnd(200, 800)); ch.floor = W.elev.floor; ch.y = 160; selected = ch; EV('sfx', { n: 'pop' }); }
      meta.cast = W.chars.map(c => c.kind); saveMeta();
      b.classList.toggle('on', !ex);
    });
    g.appendChild(b);
  }
  $('#friendOv').classList.add('open');
});
$('#friendOk').addEventListener('click', () => $('#friendOv').classList.remove('open'));
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }
function renderSound() { $('#btnSound').textContent = meta.sound ? '🔊' : '🔇'; if (master) master.gain.value = meta.sound ? .9 : 0; }
$('#btnSound').addEventListener('click', () => { audio(); meta.sound = !meta.sound; saveMeta(); renderSound(); });

// iPad の ダブルタップ・ピンチ かくだい を とめる
let lastTouch = 0;
document.addEventListener('touchend', e => { const t = Date.now(); if (t - lastTouch < 350 && !e.target.closest('button,a')) e.preventDefault(); lastTouch = t; }, { passive: false });
for (const ev of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (rec) recStop(); rainSound(false); } else if (!play) rainSound(W.rain); });

/* ---------- ループ ---------- */
let lastT = now();
function loop() {
  requestAnimationFrame(loop);
  const t = now(), dt = Math.min(.05, t - lastT); lastT = t;
  if (play) {
    playStep(dt);
    renderWorld(ctx, play.w, play.chars, t, dt, null);
    drawCurtain(ctx, play.curtain, t, play.done ? 'おしまい' : 'ごっこ げきじょう', play.done);
    return;
  }
  stepProps(dt);
  for (const ch of W.chars) if (visible(ch) || ch.inCar) stepChar(ch, dt);
  if (rec) {
    recTick -= dt; if (recTick <= 0) { recTick = 1 / 15; rec.frames.push(snap()); }
    const el = now() - rec.t0; $('#recInfo').textContent = `● ろくがちゅう ${Math.floor(el)}びょう`;
    if (el >= MAXREC) recStop();
  }
  renderWorld(ctx, W, W.chars, t, dt, selected);
}
castWorld(); resize(); renderSound();
requestAnimationFrame(loop);
</script>
