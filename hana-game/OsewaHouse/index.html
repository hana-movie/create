<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>おせわ ハウス</title>
<style>
  :root{ --ink:#5a4466; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:#ffe3ef;overscroll-behavior:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Rounded Mplus 1c","Yu Gothic",system-ui,sans-serif}
  .emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  button{font:inherit;color:inherit;border:none;cursor:pointer;padding:0;background:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #top{flex:none;display:flex;align-items:center;gap:6px;padding:calc(6px + var(--st)) 8px 6px;background:#fff;box-shadow:0 3px 12px rgba(90,68,102,.15);z-index:2}
  .rb{flex:none;width:44px;height:44px;border-radius:50%;background:#fff3f8;font-size:22px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 3px 0 #f0d3e2}
  .rb:active{transform:translateY(2px);box-shadow:0 1px 0 #f0d3e2}
  #back{display:none;background:#ffe08a;box-shadow:0 3px 0 #e0b84a}
  body.inroom #back{display:flex} body.inroom #home{display:none}
  #needs{flex:1;display:flex;justify-content:center;gap:clamp(3px,1.2vw,10px);min-width:0}
  .nd{flex:none;width:clamp(38px,10vw,50px);height:clamp(38px,10vw,50px);border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--col) calc(var(--p) * 1%), #eee5f0 0)}
  .nd span{width:78%;height:78%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:clamp(17px,4.6vw,24px)}
  .nd.low{animation:shake .6s infinite}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
  #hearts{flex:none;display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:15px;line-height:1.1;min-width:52px}
  #hearts i{display:block;width:48px;height:7px;border-radius:4px;background:#f3e3ec;overflow:hidden;margin-top:3px}
  #hearts s{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9ac0,#ff6f91)}
  #wrap{position:relative;flex:1;min-height:0}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #where{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 14px;font-weight:900;font-size:17px;display:none;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  body.inroom #where{display:block}
  #hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(90,68,102,.85);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;
    white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none}
  #hint.on{opacity:1}
  #tools{flex:none;display:flex;align-items:center;justify-content:safe center;gap:5px;padding:8px 6px calc(8px + var(--sb));background:#fff;
    border-radius:20px 20px 0 0;box-shadow:0 -4px 14px rgba(90,68,102,.15);overflow-x:auto;scrollbar-width:none;min-height:calc(80px + var(--sb))}
  #tools::-webkit-scrollbar{display:none}
  .tb{flex:none;width:clamp(44px,11.2vw,66px);height:clamp(58px,14vw,72px);border-radius:16px;background:#fff3f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    box-shadow:0 3px 0 #f0d3e2;touch-action:none}
  .tb:active{transform:translateY(2px);box-shadow:0 1px 0 #f0d3e2}
  .tb .e{font-size:clamp(23px,6.4vw,34px);line-height:1}
  .tb .n{font-size:clamp(8px,2.3vw,11px);font-weight:900;white-space:nowrap;letter-spacing:-.6px;max-width:100%;overflow:hidden}
  .tb.on{background:#ffe08a;box-shadow:0 3px 0 #e0b84a}

    z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;font-size:15px}
  #toast.on{opacity:1}
  .ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(90,50,90,.45)}

<body>
<div id="app">
  <div id="top">
    <a class="rb emo" id="home" href="../gameselect.html" aria-label="ゲームを えらぶ">🏠</a>
    <button class="rb emo" id="back" aria-label="いえに もどる">🏡</button>
    <div id="needs"></div>
    <div id="hearts"><span><span class="emo">💗</span><b id="hn">0</b></span><i><s id="gfill"></s></i></div>
    <button class="rb emo" id="btnOpt" aria-label="せってい">⚙️</button>

</div>

<div class="ov" id="startOv"><div class="card"><h2>どの あかちゃんを おせわする？</h2><div class="grid" id="startGrid"></div></div></div>
<div class="ov" id="growOv"><div class="card"><h2>🎉 おおきく なったね！</h2><canvas id="growCv" width="220" height="220" style="width:180px"></canvas>
  <p id="growTxt" style="margin:0;font-weight:900;font-size:19px"></p><button class="big" id="growOk">やったね！</button></div></div>
<div class="ov" id="optOv"><div class="card"><h2>⚙️ せってい</h2>
  <div class="row"><span>🗣️ よみあげ</span><button class="sw" id="swVoice"></button></div>
  <div class="row"><span>🔊 おと</span><button class="sw" id="swSound"></button></div>
  <div class="row"><span id="optInfo" style="font-size:14px;text-align:left"></span></div>
  <button class="big gray" id="optReset">あかちゃんを えらびなおす</button>
  <button class="big" id="optClose">とじる</button></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   おせわ ハウス v0.1
   - いえの だんめんず（5へや）で あかちゃんを おせわする
   - ごはん・トイレ・おふろ・ねんね・あそび。しなない／びょうきに ならない
   - おせわすると ハートが たまって おおきく なる（3だんかい）
   - 外部ライブラリ・画像ファイル・外部通信なし。ほぞんは localStorage
   ========================================================= */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const now = () => performance.now() / 1000;
const EMOF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const store = {
  get(k, d) { try { const v = localStorage.getItem('osewa_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('osewa_' + k, JSON.stringify(v)); } catch (e) {} },
};
let opt = Object.assign({ sound: true, voice: true }, store.get('opt', {}));

/* ---------- データ ---------- */
const KINDS = {
  usa:  { name: 'うさちゃん', col: '#ffbcd5', dark: '#e88aae', belly: '#fff0f5', pitch: 700, ears: 'rabbit' },
  kuma: { name: 'くまちゃん', col: '#dba46b', dark: '#b07a45', belly: '#f7dcb6', pitch: 430, ears: 'bear' },
  nyan: { name: 'にゃんちゃん', col: '#f4f1f7', dark: '#bdb4cc', belly: '#ffffff', pitch: 800, ears: 'cat' },
  wan:  { name: 'わんちゃん', col: '#f3cf8f', dark: '#c99a55', belly: '#fff3dc', pitch: 540, ears: 'dog' },
  piyo: { name: 'ぴよちゃん', col: '#ffe066', dark: '#e8b92a', belly: '#fff6c2', pitch: 960, ears: 'chick' },
};
const STAGES = [{ name: 'あかちゃん', sc: 1, need: 0 }, { name: 'よちよちさん', sc: 1.12, need: 30 }, { name: 'ようちえんさん', sc: 1.24, need: 100 }];
const FOODS = [
  { id: 'apple', e: '🍎', n: 'りんご' }, { id: 'banana', e: '🍌', n: 'バナナ' }, { id: 'onigiri', e: '🍙', n: 'おにぎり' }, { id: 'milk', e: '🍼', n: 'ミルク' },
  { id: 'carrot', e: '🥕', n: 'にんじん' }, { id: 'straw', e: '🍓', n: 'いちご' }, { id: 'cake', e: '🍰', n: 'ケーキ' },
];
const NEEDS = [
  { k: 'onaka', e: '🍙', n: 'おなか', room: 'kitchen', want: 'おなか すいた〜', col: '#ffb347' },
  { k: 'toilet', e: '🚽', n: 'トイレ', room: 'toilet', want: 'トイレ いきたい！', col: '#7fc8ff' },
  { k: 'kirei', e: '🛁', n: 'きれい', room: 'bath', want: 'からだ かゆいよ〜', col: '#8fd96b' },
  { k: 'genki', e: '💤', n: 'ねむい', room: 'bed', want: 'ねむいよ〜', col: '#b48cff' },
  { k: 'tanoshii', e: '🎈', n: 'たのしい', room: 'play', want: 'あそんで〜！', col: '#ff7fb0' },
];
const KANA = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわ';
const BCOL = ['#ff6f91', '#ffb347', '#f5c400', '#6cc950', '#5aa9ff', '#b48cff'];

/* ---------- いえ ---------- */
const RW = 400, RH = 250, FL = 232;
const rw = id => (ROOMS[id] && ROOMS[id].w) || RW;
const ROOMS = {
  bed:     { name: 'ねんねの へや', x: 100, y: 180 },
  play:    { name: 'あそぶ へや', x: 700, y: 180 },
  kitchen: { name: 'だいどころ', x: 100, y: 450 },
  toilet:  { name: 'トイレ', x: 500, y: 450, w: 200 },
  bath:    { name: 'おふろ', x: 700, y: 450 },
  garden:  { name: 'おにわ', x: 1116, y: 450, out: true },
};
const SPOT = { chair: [270, 166], toilet: [100, 190], tub: [285, 182], lie: [250, 160] };
const APPROACH = { chair: 214, toilet: 154, tub: 200, lie: 182, swing: 84 };
const SWING = { px: 130, py: 24, L: 128 };
const PUD = 262, TOWER = 322;
const PEEK = { id: 'peek', e: '🙈', n: 'ばあ！' };
const TOOLS = {
  house: [],
  kitchen: FOODS.map(f => ({ id: f.id, e: f.e, n: f.n, drag: true, food: f })).concat([PEEK]),
  toilet: [{ id: 'toilet', e: '🚽', n: 'すわる' }, { id: 'flush', e: '🌀', n: 'ながす' }, { id: 'paper', e: '🧻', n: 'かみ' }, PEEK],
  bath: [{ id: 'tub', e: '🛁', n: 'おふろ' }, { id: 'sponge', e: '🧽', n: 'ごしごし', drag: true }, { id: 'shower', e: '🚿', n: 'シャワー', drag: true },
    { id: 'towel', e: '', n: 'タオル', drag: true }, { id: 'duck', e: '🦆', n: 'アヒル' }, PEEK],
  bed: [{ id: 'lie', e: '🛏️', n: 'ねかせる' }, { id: 'light', e: '💡', n: 'でんき' }, { id: 'song', e: '🎵', n: 'うた' }, { id: 'mobile', e: '⭐', n: 'メリー' }, PEEK],
  play: [{ id: 'block', e: '🧱', n: 'つみき' }, { id: 'ball', e: '⚽', n: 'ボール' }, { id: 'feather', e: '🪶', n: 'こちょこちょ', drag: true }, { id: 'toybox', e: '🧸', n: 'おもちゃ' }, PEEK],
  garden: [{ id: 'swing', e: '🎠', n: 'ブランコ' }, { id: 'bubble', e: '🫧', n: 'シャボン' }, { id: 'puddle', e: '💦', n: 'どろんこ' }, { id: 'tree', e: '🍎', n: 'りんご' }, PEEK],
};
const HINTS = {
  house: 'おへやを タップしてね', kitchen: 'たべものを くちへ もっていってね', toilet: 'トイレに すわらせてね', bath: 'おふろに いれて ごしごし',
  bed: 'ねかせて でんきを けして トントン', play: 'つみきを つんでみよう', garden: 'ブランコに のせてみよう',
};

/* ---------- じょうたい ---------- */
let SAVE = store.get('save', null);
const N = { onaka: 80, toilet: 90, kirei: 100, genki: 85, tanoshii: 70 };
let B = null, hearts = 0, ready = false, view = 'house', dirtT = 70;
const W = {
  light: true, morning: 0, poops: [], paper: 0, mobileAng: 0, mobileV: .4, song: false, leverGlow: false, flushT: 0, duck: false, duckJ: 0, showerT: 0,
  blocks: [], flying: [], blockIdle: 0, ball: { on: false, x: 80, y: 150, vx: 0, vy: 0, r: 16, rot: 0 },
  swing: { a: 0, v: 0, heart: false, scream: 0 }, bubs: [], bubPops: 0, apples: [], treeApples: 2, appleT: 30, treeShake: 0,
  peekT: 0, fridgeT: 0, mudHeartCd: 0, peekHeartCd: 0, rollHeartCd: 0, wantSpeakT: 0,
};
function newB(kind, stage) {
  return { kind, stage, room: 'play', x: 200, y: FL, vx: 0, vy: 0, pose: 'stand', dir: 1, walkTo: null, after: null, afterFn: null, walking: false, hop: null,
    face: 'normal', faceT: 0, bubble: null, bubbleT: 0, blinkT: 2, talkUntil: 0, sq: 0, sqv: 0, rot: 0, rotV: 0, spinT: 0, spinDur: 1, spinN: 1, shakeT: 0,
    held: false, gdx: 0, gdy: 0, belly: 0, burpT: 0, fartT: 0, fartCd: 8, soap: [], wet: 0, dirt: [], washed: false, sneezeT: 0, sneezeCd: 0, toilet: null,
    sleep: { asleep: false, pats: 0, t: 0, taps: [], dreamT: 3, dream: null, dreamShow: 0, snoreT: 2, zT: 0 },
    eatT: 0, eatDur: 1, eatFood: null, eatKind: null, aan: false, fullTries: 0, wanderT: 3, tickle: 0, tickleCd: 0, tapCd: 0, mudCd: 0, bonkCd: 0, coldCd: 0, hintCd: 0, squeakT: 0, rubT: 0 };
}
function loadSave() {
  if (!SAVE) return false;
  B = newB(SAVE.kind, SAVE.stage || 0);
  hearts = SAVE.hearts || 0;
  Object.assign(N, SAVE.N || {});
  B.dirt = SAVE.dirt || [];
  W.light = SAVE.light !== false;
  B.room = SAVE.room && ROOMS[SAVE.room] ? SAVE.room : 'play';
  // とじていた あいだ（へるけど、さいていでも 15 は のこる）
  const el = clamp((Date.now() - (SAVE.t || Date.now())) / 1000, 0, 8 * 3600);
  const floor = (k, d) => { if (N[k] > 15) N[k] = Math.max(15, N[k] - d); };
  floor('onaka', el * 100 / 360); floor('toilet', el * 100 / 700); floor('genki', el * 100 / 540); floor('tanoshii', el * 100 / 300);
  for (let i = 0; i < Math.min(3, el / 80 | 0); i++) addDirt(1, 9);
  return true;
}
function save() {
  if (!SAVE || !B) return;
  Object.assign(SAVE, { kind: B.kind, stage: B.stage, hearts, N: { onaka: N.onaka, toilet: N.toilet, genki: N.genki, tanoshii: N.tanoshii }, dirt: B.dirt, light: W.light, room: B.room, t: Date.now() });
  store.set('save', SAVE);
}

/* ---------- おと ---------- */
let AC = null, master = null, noiseBuf = null, waterNode = null;
function audio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = opt.sound ? .9 : 0; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function osc(type, f, d, { vol = .1, to = null, delay = 0, vib = 0, att = .01 } = {}) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  if (vib) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = vib; lg.gain.value = f * .07; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + d + .05); }
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .05);
}
function noise(d, { vol = .1, f = 1000, q = 1, type = 'bandpass', delay = 0, att = .005 } = {}) {
  if (!AC) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(g).connect(master); s.start(t, Math.random() * .5); s.stop(t + d + .05);
}
const SFX = {
  babble(p, d = .8) { const n = Math.max(2, Math.round(d / .14)); for (let i = 0; i < n; i++) osc('triangle', p * rnd(.85, 1.35), .1, { vol: .07, delay: i * .14 }); },
  giggle(p) { for (let i = 0; i < 4; i++) osc('triangle', p * (1.5 + i * .1), .08, { vol: .08, delay: i * .085, vib: 22 }); },
  laugh(p) { for (let i = 0; i < 8; i++) osc('triangle', p * (1.7 - (i % 2) * .18 + i * .03), .1, { vol: .09, delay: i * .1, vib: 18 }); },
  happy(p) { [1, 1.25, 1.5, 2].forEach((k, i) => osc('triangle', p * k, .12, { vol: .07, delay: i * .07 })); },
  surprise(p) { osc('triangle', p, .25, { vol: .1, to: p * 2.4 }); },
  cry(p) { osc('sine', p * 1.4, .6, { vol: .11, to: p, vib: 7 }); osc('sine', p * 1.35, .8, { vol: .11, to: p * .85, vib: 7, delay: .7 }); },
  yuck(p) { osc('sawtooth', p * .7, .45, { vol: .04, to: p * .45, vib: 12 }); },
  chomp() { for (let i = 0; i < 3; i++) noise(.07, { vol: .16, f: 900, q: 2, delay: i * .2 }); },
  gulp() { for (let i = 0; i < 3; i++) osc('sine', 320, .12, { vol: .13, to: 160, delay: i * .25 }); },
  burp() { osc('sawtooth', 100, .6, { vol: .16, to: 68, vib: 28 }); osc('square', 125, .55, { vol: .06, to: 80, vib: 30 }); noise(.45, { vol: .06, f: 300, type: 'lowpass' }); },
  fart() { osc('sawtooth', 90, .45, { vol: .13, to: 58, vib: 36 }); noise(.35, { vol: .05, f: 200, type: 'lowpass' }); },
  plop() { osc('sine', 950, .16, { vol: .14, to: 240 }); noise(.12, { vol: .05, f: 1200, q: 2 }); },
  flush() { noise(1.7, { vol: .16, f: 700, q: .5, att: .2 }); osc('sine', 300, 1.4, { vol: .04, to: 110, vib: 6 }); },

  if (T < 1.25 && k > .8) { c.font = `900 ${Math.min(CW, CH) * .07}px "Hiragino Maru Gothic ProN",sans-serif`; c.strokeText('いない いない…', cx, cy + R * 1.1); c.fillText('いない いない…', cx, cy + R * 1.1); }
  if (T >= 1.25) { const sc = 1 + Math.sin(Math.min(1, (T - 1.25) / .3) * Math.PI) * .3; c.font = `900 ${Math.min(CW, CH) * .16 * sc}px "Hiragino Maru Gothic ProN",sans-serif`; c.strokeText('ばあ！', cx, cy); c.fillText('ばあ！', cx, cy); }
}
function drawDragTool(c) {
  if (!tdrag || !tdrag.moved) return;
  const r = cv.getBoundingClientRect(), x = tdrag.x - r.left, y = tdrag.y - r.top, id = tdrag.tl.id;
  if (id === 'towel') { c.save(); c.translate(x, y); c.rotate(-.2); c.fillStyle = '#fff'; c.strokeStyle = '#5ab0e0'; c.lineWidth = 3; rr(c, -34, -24, 68, 48, 8); c.fill(); c.stroke(); c.fillStyle = '#8fd3ff'; for (let i = 0; i < 4; i++) c.fillRect(-28 + i * 16, -24, 8, 48); c.restore(); return; }
  emoji(c, tdrag.tl.e, x, y - 10, 54);
}

/* ---------- スタート ---------- */
function babyPreview(kind, stage = 0, face = 'happy') {
  const tc = document.createElement('canvas'); tc.width = 180; tc.height = 180; const c = tc.getContext('2d');
  c.translate(90, 168); c.scale(.95, .95); drawBabyBody(c, { kind, stage, face, t: 0, legs: 'stand', belly: 0 }); return tc;
}
function showStart() {
  const g = $('#startGrid'); g.innerHTML = '';
  for (const k in KINDS) {
    const b = document.createElement('button'); b.className = 'pick'; b.appendChild(babyPreview(k)); b.insertAdjacentHTML('beforeend', `<span>${KINDS[k].name}</span>`);
    b.addEventListener('click', () => { audio(); startNew(k); });
    g.appendChild(b);
  }
  $('#startOv').classList.add('open');
}
function startNew(kind) {
  const favs = FOODS.filter(f => f.id !== 'carrot' && f.id !== 'milk');
  const fav = pick(favs).id;
  SAVE = { kind, stage: 0, hearts: 0, fav, dislike: 'carrot', dislikeN: 0, N: { onaka: 70, toilet: 80, genki: 85, tanoshii: 60 }, dirt: [], room: 'play', t: Date.now() };
  Object.assign(N, SAVE.N); W.blocks = []; W.light = true;
  B = newB(kind, 0); hearts = 0; save();
  $('#startOv').classList.remove('open');
  begin(); react('laugh', { say: 'よろしくね！', snd: 'laugh', dur: 2 }); speak('よろしくね');
}
function begin() { ready = true; updHearts(); goRoom('house'); }

/* ---------- せってい ---------- */
function renderOpt() {
  $('#swVoice').textContent = opt.voice ? 'ON' : 'OFF'; $('#swVoice').classList.toggle('on', opt.voice);
  $('#swSound').textContent = opt.sound ? 'ON' : 'OFF'; $('#swSound').classList.toggle('on', opt.sound);
  if (B) { const fav = FOODS.find(f => f.id === SAVE.fav); $('#optInfo').textContent = `${KINDS[B.kind].name}（${STAGES[B.stage].name}）・ハート ${hearts}・すきな たべもの ${fav ? fav.e : ''}`; }
  if (master) master.gain.value = opt.sound ? .9 : 0;
}
$('#btnOpt').addEventListener('click', () => { audio(); renderOpt(); $('#optOv').classList.add('open'); });
$('#optClose').addEventListener('click', () => $('#optOv').classList.remove('open'));
$('#swVoice').addEventListener('click', () => { opt.voice = !opt.voice; store.set('opt', opt); renderOpt(); });
$('#swSound').addEventListener('click', () => { opt.sound = !opt.sound; store.set('opt', opt); renderOpt(); });
$('#optReset').addEventListener('click', () => {
  if (!confirm('いまの あかちゃんの きろく（ハート・せいちょう）が きえます。えらびなおしますか？')) return;
  store.set('save', null); SAVE = null; B = null; ready = false; $('#optOv').classList.remove('open'); goRoomReset(); showStart();
});
function goRoomReset() { view = 'house'; document.body.classList.remove('inroom'); $('#tools').innerHTML = ''; }

// iPad の ダブルタップ・ピンチ かくだい を とめる
let lastTouch = 0;
document.addEventListener('touchend', e => { const t = Date.now(); if (t - lastTouch < 350 && !e.target.closest('a')) e.preventDefault(); lastTouch = t; }, { passive: false });
for (const ev of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); water(false); } });
window.addEventListener('pagehide', save);

/* ---------- ループ ---------- */
let lastT = now(), saveT = 4;
function loop() {
  requestAnimationFrame(loop);
  const t = now(), dt = Math.min(.05, t - lastT); lastT = t;
  updCam(dt);
  if (ready && B) {
    decay(dt); updBaby(dt, t); updWorld(dt, t);
    musicTick((view === 'bed' || view === 'house') && B.room === 'bed' && (W.song || B.sleep.asleep || (B.pose === 'lie' && !W.light && B.sleep.pats > 0)) || (view === 'bed' && W.song));
    uiT -= dt; if (uiT <= 0) { uiT = .25; updNeedsUI(); }
    saveT -= dt; if (saveT <= 0) { saveT = 4; save(); }
  }
  stepParts(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#7fd0ff'; ctx.fillRect(0, 0, CW, CH);
  ctx.setTransform(DPR * cam.s, 0, 0, DPR * cam.s, DPR * (CW / 2 - cam.x * cam.s), DPR * (CH / 2 - cam.y * cam.s));
  drawWorld(ctx, t);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawDragTool(ctx); drawPeek(ctx);
}
resize();
if (loadSave()) begin(); else { showStart(); }
requestAnimationFrame(loop);
</script>
