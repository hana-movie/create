<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#bfe9ff">
<title>おいたら うごく！</title>
<style>
  :root{ --ink:#4a4458; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:#bfe9ff;overscroll-behavior:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Rounded Mplus 1c","Yu Gothic",system-ui,sans-serif}
  .emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  button{font:inherit;color:inherit;border:none;cursor:pointer;padding:0;background:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(6px + var(--st)) 8px 6px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.08);z-index:2}
  #top h1{flex:1;margin:0;font-size:clamp(17px,4.4vw,24px);font-weight:900;color:#ff6fa8;text-align:center}
  .rb{flex:none;width:44px;height:44px;border-radius:50%;background:#f4f1ea;font-size:22px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 3px 0 #ddd6c6}
  .rb:active{transform:translateY(2px);box-shadow:0 1px 0 #ddd6c6}
  #wrap{position:relative;flex:1;min-height:0}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:999px;padding:8px 18px;font-weight:900;font-size:clamp(14px,3.6vw,18px);
    white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.12);pointer-events:none;transition:opacity .4s;max-width:96%;overflow:hidden;text-overflow:ellipsis}
  #bar{flex:none;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -4px 14px rgba(0,0,0,.1);padding:8px 6px calc(8px + var(--sb));display:flex;gap:6px;align-items:center;
    justify-content:safe center;overflow-x:auto;scrollbar-width:none}
  #bar::-webkit-scrollbar{display:none}
  .pb{flex:none;width:clamp(48px,10.4vw,64px);height:clamp(60px,13vw,76px);border-radius:16px;background:#f4f1ea;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    box-shadow:0 3px 0 #ddd6c6;border:3px solid transparent}
  .pb .e{font-size:clamp(26px,6.6vw,36px);line-height:1} .pb .n{font-size:clamp(9px,2.4vw,12px);font-weight:900;white-space:nowrap;letter-spacing:-.5px}
  .pb.on{background:#fff0f6;border-color:#ff8fb8}
  .pb:active{transform:translateY(2px)}
  .sep{flex:none;width:2px;height:48px;background:#eee8dc;margin:0 2px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a class="rb emo" href="../gameselect.html" aria-label="ゲームを えらぶ">🏠</a>
    <h1>おいたら うごく！</h1>
    <button class="rb emo" id="btnSound" aria-label="おと">🔊</button>
  </div>
  <div id="wrap"><canvas id="cv"></canvas><div id="hint"></div></div>
  <div id="bar"></div>
</div>
<script>
'use strict';
/* =========================================================
   おいたら うごく！ v0.1（スタンプばん）
   - スタンプを えらんで タップで おくと うごきだす。おいた ものは ドラッグで うごかせる・なげられる
   - つながる しかけ：ふうせん→うかぶ→✂️で われて おちる／くも→あめ→はな→はち／
     あめ＋たいよう→にじ／き→りんご→たべる／あめ→おうちに にげこむ／いぬは ついてくる／くるまに のる
   - 外部ライブラリ・画像・音声ファイル・外部通信なし。おいた ものは この たんまつに ほぞん
   ========================================================= */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const now = () => performance.now() / 1000;
const store = {
  get(k, d) { try { const v = localStorage.getItem('oitara_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('oitara_' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
let opt = Object.assign({ sound: true }, store.get('opt', {}));

/* ---------- スタンプ ---------- */
const STAMPS = [
  { id: 'girl', e: '👧', n: 'おんなのこ' }, { id: 'boy', e: '👦', n: 'おとこのこ' }, { id: 'dog', e: '🐶', n: 'いぬ' }, { id: 'cat', e: '🐱', n: 'ねこ' },
  { id: 'balloon', e: '🎈', n: 'ふうせん' }, { id: 'cloud', e: '☁️', n: 'くも' }, { id: 'sun', e: '☀️', n: 'たいよう' }, { id: 'tree', e: '🌳', n: 'き' },
  { id: 'flower', e: '🌷', n: 'はな' }, { id: 'house', e: '🏠', n: 'おうち' }, { id: 'car', e: '🚗', n: 'くるま' }, { id: 'fumikiri', e: '🚃', n: 'ふみきり' }, { id: 'taifu', e: '🌀', n: 'たいふう' },
  { sep: true },
  { id: 'hasami', e: '✂️', n: 'はさみ', tool: true, hint: '✂️ ふうせんを なぞるか タップで パン！' },
  { id: 'keshi', e: '🧽', n: 'けす', tool: true, hint: '🧽 けしたい ものを タップ' },
  { id: 'zenbu', e: '🗑️', n: 'ぜんぶ', tool: true },
];
const HINTS = {
  girl: 'おいた こは あるきだすよ', boy: 'おいた こは あるきだすよ', dog: 'いぬは こどもに ついていくよ', cat: 'ねこは きまぐれ。たいようが あると ひるね',
  balloon: 'こどもの うえに おくと くっつくよ', cloud: 'くもから あめ。はなが さくよ', sun: 'あめの あとに たいようで にじ！', tree: 'りんごが なったら きを タップ',
  flower: 'はなが さくと はちが くるよ', house: 'あめが ふると おうちに にげこむよ', car: 'こどもを くるまの うえに おとすと のるよ',
  fumikiri: 'ときどき でんしゃが とおるよ。タップで すぐ くる', taifu: 'たいふうが くもを ふきとばすよ',
};
const GROUND = ['girl', 'boy', 'dog', 'cat', 'tree', 'flower', 'house', 'car', 'fumikiri'];
const LIVING = ['girl', 'boy', 'dog', 'cat'];
const KID = ['girl', 'boy'];
let sel = 'girl', zenbuArm = 0;
const BCOL = ['#ff4f8b', '#3fa0ff', '#ffd23f', '#5cc66d', '#9b6bff', '#ff8a2a'];
const HAIR = ['#5b3a29', '#2b2430', '#c97b3a', '#e8c26a'];
const CLOTH = ['#ff6fa8', '#5aa9ff', '#ffb347', '#8fd96b', '#b48cff', '#ff6f6f'];

/* ---------- おと ---------- */
let AC = null, master = null, noiseBuf = null, rainN = null;
function audio() {
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = opt.sound ? .9 : 0; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function osc(type, f, d, { vol = .1, to = null, delay = 0, vib = 0, att = .01 } = {}) {
  if (!AC) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  if (vib) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = vib; lg.gain.value = f * .07; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + d + .05); }
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .05);
}
function noise(d, { vol = .1, f = 1000, q = 1, type = 'bandpass', delay = 0, att = .005 } = {}) {
  if (!AC) return; const t = AC.currentTime + delay, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(g).connect(master); s.start(t, Math.random() * .5); s.stop(t + d + .05);
}
const SFX = {
  place() { osc('sine', 500, .12, { vol: .1, to: 900 }); },
  pop() { noise(.18, { vol: .3, f: 1800, q: .7, att: .002 }); osc('square', 180, .1, { vol: .1, to: 60 }); },
  ouch() { osc('square', 700, .2, { vol: .06, to: 320 }); },
  thud() { osc('sine', 150, .2, { vol: .2, to: 60 }); noise(.1, { vol: .1, f: 300, type: 'lowpass' }); },
  float() { osc('sine', 400, .6, { vol: .07, to: 900, vib: 6 }); },
  wah() { osc('triangle', 900, .8, { vol: .07, to: 300, vib: 10 }); },
  giggle() { for (let i = 0; i < 4; i++) osc('triangle', 900 + i * 90, .08, { vol: .07, delay: i * .085 }); },
  chomp() { for (let i = 0; i < 3; i++) noise(.07, { vol: .15, f: 900, q: 2, delay: i * .18 }); },
  yum() { [784, 988, 1175].forEach((f, i) => osc('triangle', f, .15, { vol: .07, delay: i * .08 })); },
  bloom() { osc('sine', rnd(1200, 1800), .15, { vol: .04, to: 2400 }); },
  rustle() { noise(.5, { vol: .07, f: 3000, q: .4, att: .1 }); },
  poof() { noise(.35, { vol: .12, f: 1200, q: .5 }); },
  woof() { osc('sawtooth', 320, .12, { vol: .08, to: 220 }); osc('sawtooth', 300, .12, { vol: .08, to: 200, delay: .18 }); },
  meow() { osc('triangle', 700, .35, { vol: .08, to: 1000, vib: 8 }); },
  honk() { osc('square', 440, .18, { vol: .06 }); osc('square', 440, .25, { vol: .06, delay: .25 }); },
  buzz() { osc('sawtooth', 220, .4, { vol: .025, vib: 30 }); },
  door() { osc('triangle', 300, .2, { vol: .06, to: 500 }); },
  rainbow() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => osc('sine', f, .5, { vol: .06, delay: i * .1 })); },
  cold() { osc('triangle', 1000, .3, { vol: .06, to: 1500, vib: 20 }); },
  hop() { osc('sine', 400, .12, { vol: .08, to: 800 }); },
  kan() { osc('square', 950, .12, { vol: .05 }); },
  gatan() { for (let i = 0; i < 2; i++) { noise(.08, { vol: .12, f: 220, type: 'lowpass', delay: i * .16 }); osc('sine', 90, .08, { vol: .1, delay: i * .16 }); } },
  fuwan() { osc('triangle', 660, .5, { vol: .07 }); osc('triangle', 550, .7, { vol: .07, delay: .4 }); },
  byu() { noise(1.2, { vol: .12, f: 500, q: .5, att: .3 }); },
};
function rainSound(on) {
  if (!AC) return;
  if (on && !rainN) { const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noiseBuf; s.loop = true; f.type = 'highpass'; f.frequency.value = 2400; g.gain.value = .05; s.connect(f).connect(g).connect(master); s.start(); rainN = s; }
  else if (!on && rainN) { try { rainN.stop(); } catch (e) {} rainN = null; }
}

/* ---------- がめん ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d');
const LH = 700, G = 600;
let CW = 300, CH = 300, DPR = 1, S = 1, LW = 1000;
function resize() { const r = cv.getBoundingClientRect(); if (!r.width) return; DPR = Math.min(window.devicePixelRatio || 1, 2.5); CW = r.width; CH = r.height; cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR); S = CH / LH; LW = CW / S; for (const o of objs) o.x = clamp(o.x, 20, LW - 20); }
window.addEventListener('resize', () => setTimeout(resize, 60)); if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
function ell(c, x, y, rx, ry, r = 0) { c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), r, 0, TAU); }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function starP(c, x, y, r, n = 5) { c.beginPath(); for (let i = 0; i < n * 2; i++) { const q = i % 2 ? r * .45 : r, a = i * Math.PI / n - Math.PI / 2; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } c.closePath(); }
function heartP(c, x, y, r) { c.beginPath(); c.moveTo(x, y + r * .7); c.bezierCurveTo(x - r * 1.5, y - r * .2, x - r * .6, y - r * 1.3, x, y - r * .4); c.bezierCurveTo(x + r * .6, y - r * 1.3, x + r * 1.5, y - r * .2, x, y + r * .7); c.closePath(); }

/* ---------- もの ---------- */
// x = まんなか、y = あしもと（じめんの もの）／まんなか（そらの もの）
const SIZE = { girl: [56, 118], boy: [56, 114], dog: [84, 62], cat: [76, 58], balloon: [56, 70], cloud: [170, 78], sun: [120, 120], tree: [170, 230], flower: [34, 50], house: [180, 180], car: [160, 78], fumikiri: [50, 120] };
let objs = [], uid = 1, flowers = [], gApples = [], parts = [], bees = [];
let rainbowT = 0, rainedAt = -99, wasRaining = false, rainbowDone = false;
let train = null, trainT = 4, alarm = false, alarmT = 0, typhoons = [], wind = 0, windDir = 1, windN = null;
const TRACK = G - 52;
const byId = id => objs.find(o => o.id === id);
const isSky = o => o.type === 'balloon' || o.type === 'cloud' || o.type === 'sun';
function bbox(o) { const [w, h] = SIZE[o.type]; return isSky(o) ? [o.x - w / 2, o.y - h / 2, o.x + w / 2, o.y + h / 2] : [o.x - w / 2, o.y - h, o.x + w / 2, o.y]; }
function add(type, x, y, extra = {}) {
  if (objs.length >= 45) { hint('もう いっぱい！ 🧽で けしてね'); return null; }
  const o = Object.assign({ id: uid++, type, x, y, vx: 0, vy: 0, t: 0, rot: 0, sq: 0, dir: Math.random() < .5 ? -1 : 1, sayT: 0 }, extra);
  init(o, true); objs.push(o); return o;
}
let balloonIdx = 0;
function init(o, fresh) {
  const ty = o.type;
  if (KID.includes(ty)) { o.hair = o.hair || pick(HAIR); o.cloth = o.cloth || pick(CLOTH); o.balloons = o.balloons || []; o.state = 'walk'; o.walk = 0; o.think = rnd(1, 3); }
  if (ty === 'dog' || ty === 'cat') { o.col = o.col || pick(ty === 'dog' ? ['#d9a066', '#f2e2c8', '#8a5a3c'] : ['#f2a65a', '#c9c3cf', '#3a3440', '#fff4e6']); o.balloons = o.balloons || []; o.state = 'walk'; o.walk = 0; o.think = rnd(1, 3); o.nap = 0; }
  if (ty === 'balloon') { o.col = o.col || BCOL[balloonIdx++ % BCOL.length]; o.by = o.y; o.ph = rnd(0, 6); if (fresh) { const h = nearestLiving(o, 300); if (h) attach(o, h); } }
  if (ty === 'cloud') { o.vx = o.vx || (Math.random() < .5 ? -14 : 14); o.rainT = fresh ? 10 : 0; o.flT = 1; }
  if (ty === 'sun') { o.rot = 0; }
  if (ty === 'tree') { o.apples = o.apples || []; o.appleT = 2; o.shake = 0; }
  if (ty === 'flower') { o.col = o.col || pick(['#ff4f8b', '#ffd23f', '#9b6bff', '#ff8a2a', '#3fa0ff']); o.g = fresh ? 0 : 1; }
  if (ty === 'house') { o.inside = o.inside || []; o.peek = 0; o.doorT = 0; }
  if (ty === 'car') { o.dir = o.dir || 1; o.riders = o.riders || []; o.stopT = 0; o.wheel = 0; }
  if (GROUND.includes(ty) && fresh && o.y < G - 2) o.air = true;
}
function nearestLiving(o, maxD) { let best = null, bd = maxD; for (const h of objs) if (LIVING.includes(h.type) && h.state !== 'house' && h.state !== 'ride') { const [x0, y0] = bbox(h); const d = Math.hypot(h.x - o.x, y0 - o.y); if (d < bd) { bd = d; best = h; } } return best; }
function attach(b, h) { if (b.owner) return; b.owner = h.id; h.balloons.push(b.id); say(h, h.type === 'dog' ? 'ワン！？' : h.type === 'cat' ? 'ニャ！？' : pick(['ふうせんだ！', 'わーい！', 'うかぶ〜！'])); SFX.float(); }
function say(o, text, dur = 1.8) { o.say = text; o.sayT = dur; }

/* ---------- タッチ ---------- */
let grab = null, cutting = null, lastCut = null, placeArm = null;
function lp(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / S, (e.clientY - r.top) / S]; }
function hit(x, y, filter) {
  const order = ['balloon', 'sun', 'cloud', 'girl', 'boy', 'dog', 'cat', 'car', 'flower', 'tree', 'house'];
  let best = null, bo = 99;
  for (const o of objs) { if (o.state === 'house' || o.state === 'ride') continue; if (filter && !filter.includes(o.type)) continue; const [x0, y0, x1, y1] = bbox(o), m = 10; if (x > x0 - m && x < x1 + m && y > y0 - m && y < y1 + m) { const k = order.indexOf(o.type); if (k < bo) { bo = k; best = o; } } }
  return best;
}
cv.addEventListener('pointerdown', e => {
  audio(); e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const [x, y] = lp(e);
  if (sel === 'hasami') { cutting = { id: e.pointerId, pts: [[x, y]] }; cutAt(x, y, x, y); return; }
  if (sel === 'keshi') { const o = hit(x, y); if (o) erase(o); else { const i = gApples.findIndex(a => Math.hypot(a.x - x, a.y - y) < 22); if (i >= 0) gApples.splice(i, 1); else { const f = flowers.findIndex(f => Math.abs(f.x - x) < 16 && y > G - 60 && y < G + 10); if (f >= 0) flowers.splice(f, 1); } } return; }
  const o = hit(x, y);
  if (o && o.type === 'balloon' && sel === 'balloon') { placeArm = { id: e.pointerId, x, y, maybe: o }; return; }
  if (o) { grab = { id: e.pointerId, o, dx: o.x - x, dy: o.y - y, sx: x, sy: y, moved: false, hist: [[x, y, now()]] }; return; }
  placeArm = { id: e.pointerId, x, y };
});
cv.addEventListener('pointermove', e => {
  const [x, y] = lp(e);
  if (placeArm && placeArm.maybe && e.pointerId === placeArm.id && Math.hypot(x - placeArm.x, y - placeArm.y) > 8) { const o = placeArm.maybe; placeArm = null; grab = { id: e.pointerId, o, dx: o.x - x, dy: o.y - y, sx: x, sy: y, moved: true, hist: [[x, y, now()]] }; pickUp(o); }
  if (cutting && e.pointerId === cutting.id) { const l = cutting.pts[cutting.pts.length - 1]; cutting.pts.push([x, y]); cutAt(l[0], l[1], x, y); return; }
  if (!grab || e.pointerId !== grab.id) return;
  const g = grab, o = g.o;
  if (!g.moved && Math.hypot(x - g.sx, y - g.sy) > 8) { g.moved = true; pickUp(o); }
  if (!g.moved) return;
  o.x = clamp(x + g.dx, 10, LW - 10); o.y = clamp(y + g.dy, 20, isSky(o) ? G - 20 : G); if (o.type === 'fumikiri') o.y = G - 30;
  if (o.type === 'balloon') o.by = o.y;
  g.hist.push([x, y, now()]); if (g.hist.length > 6) g.hist.shift();
});
function up(e) {
  if (cutting && e.pointerId === cutting.id) { lastCut = { pts: cutting.pts, life: .5 }; cutting = null; return; }
  if (placeArm && e.pointerId === placeArm.id) { const p = placeArm; placeArm = null; place(sel, p.x, p.y); return; }
  if (!grab || e.pointerId !== grab.id) return;
  const g = grab; grab = null; const o = g.o;
  if (!g.moved) { tapObj(o); return; }
  o.held = false;
  const h = g.hist, a = h[0], b = h[h.length - 1], dt = Math.max(.016, b[2] - a[2]);
  drop(o, clamp((b[0] - a[0]) / dt, -1600, 1600), clamp((b[1] - a[1]) / dt, -1600, 1600));
}
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

function place(type, x, y) {
  const st = STAMPS.find(s => s.id === type); if (!st || st.tool) return;

/* ---------- ほぞん ---------- */
const KEEP = ['id', 'type', 'x', 'y', 'dir', 'hair', 'cloth', 'col', 'balloons', 'owner', 'by', 'apples', 'inside', 'riders', 'state'];
function save() {

}
function load() {

  const st = {}; for (const o of objs) st[o.id] = o.state;
  for (const o of objs) { init(o, false); if (st[o.id] === 'house' || st[o.id] === 'ride') o.state = st[o.id]; if (o.state === 'house') o.houseT = 1; if (o.type === 'balloon') o.by = o.by ?? o.y; }

/* ---------- UI ---------- */
let hintTo = 0;

function renderSound() { $('#btnSound').textContent = opt.sound ? '🔊' : '🔇'; if (master) master.gain.value = opt.sound ? .9 : 0; }

let lastTouch = 0;
