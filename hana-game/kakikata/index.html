<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>かいてみよう</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e0;--card:#fff;--ink:#5a3a22;--guide:#eadfca;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2230;--card:#3d3347;--ink:#fff1dc;--guide:#5d506a}}
:root[data-theme="dark"]{--bg:#2b2230;--card:#3d3347;--ink:#fff1dc;--guide:#5d506a}
html,body{height:100%;margin:0}
body{position:relative;background:var(--bg);color:var(--ink);font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Arial Rounded MT Bold',sans-serif;font-weight:800;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
.s{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:3vh}
.s.on{display:flex}
button{font:inherit;color:var(--ink);border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.big{width:min(42vw,260px);aspect-ratio:1;border-radius:32px;font-size:min(24vw,140px);box-shadow:0 8px 0 rgba(0,0,0,.18)}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.logo{width:auto;height:auto;max-width:92vw;max-height:36vh}
.row{display:flex;gap:4vw;flex-wrap:wrap;justify-content:center}
#menu .big{width:min(28vw,190px);font-size:min(17vw,100px)}
#pick{justify-content:flex-start;padding-top:92px;overflow:auto;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(94vw,520px);padding-bottom:30px}
.gb{aspect-ratio:1;border-radius:16px;background:var(--card);font-size:min(9vw,42px);box-shadow:0 4px 0 rgba(0,0,0,.15);padding:0}
.gb.sp{visibility:hidden}
.selbar{display:flex;gap:6px;align-items:center;width:min(94vw,520px);margin-bottom:8px}
#sel{flex:1;display:flex;flex-wrap:wrap;gap:4px;min-height:44px}
.tk{min-width:30px;height:38px;border-radius:10px;background:var(--card);font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.15);padding:0 4px}
.tk.e{opacity:.25}
.sb{width:50px;height:50px;border-radius:14px;background:var(--card);font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.15);padding:0}
.sb.go{background:#8fd9bd}
.look{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);display:none;padding:18px 44px;border-radius:999px;font-size:min(8vw,36px);background:#ffe27a;box-shadow:0 6px 0 rgba(0,0,0,.18);z-index:3}
.c1{background:#ffb98a}.c2{background:#8fd9bd}.c3{background:#ffe27a}
@keyframes jump{40%{transform:translateY(-30px) scale(1.2)}}
.pop{animation:jump .6s}
.ic{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;width:64px;height:64px;border-radius:50%;background:var(--card);font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.pill{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;height:64px;padding:0 24px;border-radius:999px;font-size:min(5.5vw,26px);background:#ffe27a;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.pill:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.rows{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;justify-content:center;gap:6px;padding:0 8px}
.rb{flex:1;max-width:56px;aspect-ratio:1;border-radius:14px;background:var(--card);font-size:min(5vw,26px);box-shadow:0 3px 0 rgba(0,0,0,.15);padding:0}
.rb.cur{background:#ffe27a}.rb.off{opacity:.3}
canvas{background:var(--card);border-radius:28px;touch-action:none;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.sp{position:fixed;font-size:7vmin;pointer-events:none;z-index:9;animation:fly 1s forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
#gear{position:absolute;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);width:48px;height:48px;border-radius:50%;background:transparent;opacity:.3;font-size:22px;z-index:4}
#par{position:fixed;inset:0;background:var(--bg);z-index:8;display:none;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 16px;overflow:auto;font-size:16px}
#par.on{display:block}
#par table{border-collapse:collapse;margin:8px 0}
#par td,#par th{padding:4px 12px;border-bottom:1px solid var(--guide);text-align:center}
#par button{padding:10px 16px;border-radius:12px;background:var(--card);margin:4px}
.selbtn{display:inline-block;margin-top:1vh;padding:12px 26px;border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font-size:min(4.6vw,22px);box-shadow:0 4px 0 rgba(0,0,0,.15);-webkit-tap-highlight-color:transparent}
.selbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
</style></head>

function showRes(){show('res');const lines=[[]];let k=0;sel.forEach(t=>{if(t==='↲'){if(lines[lines.length-1].length)lines.push([])}else lines[lines.length-1].push(k++)});if(!lines[lines.length-1].length)lines.pop();const mc=Math.max(...lines.map(l=>l.length)),n=lines.length,c=Math.floor(Math.min(innerWidth*.96/mc,(innerHeight-130)/n,240));const rc=$('rc');rc.width=c*mc;rc.height=c*n;rc.style.width=rc.width+'px';rc.style.height=rc.height+'px';const x=rc.getContext('2d');x.clearRect(0,0,rc.width,rc.height);x.lineCap=x.lineJoin='round';x.strokeStyle='#e8643c';x.lineWidth=Math.max(2,5*c/100);lines.forEach((l,r)=>l.forEach((q,col)=>{const ox=col*c,oy=r*c;(inks[q]||[]).forEach(s=>{const p=s.length===1?[s[0],[s[0][0]+.01,s[0][1]]]:s;x.beginPath();p.forEach((z,i)=>x[i?'lineTo':'moveTo'](ox+z[0]*c/100,oy+z[1]*c/100));x.stroke()})}))}
function startFree(c){set='f';idx=0;queue=[c];qi=0;show('trace');size();next()}
function buildGrid(){const g=$('grid');g.innerHTML='';const add=c=>{const b=document.createElement('button');if(c===''){b.className='gb sp'}else{b.className='gb';b.textContent=c;b.onclick=()=>{if(sel.filter(t=>t!=='↲').length<10){sel.push(c);drawSel()}}}g.appendChild(b)};ROWS.forEach(r=>(r.length===3?[r[0],'',r[1],'',r[2]]:r).forEach(add));NUMS.forEach(add)}
function start(s,i){set=s;idx=i;queue=s==='h'?[...ROWS[i]]:NUMS.slice(i);qi=0;show('trace');size();next()}
function size(){const s=Math.floor(Math.min(innerWidth*.9,innerHeight-250));cv.width=cv.height=s;cv.style.width=cv.style.height=s+'px';K=s/100}
function next(){if(qi>=queue.length)return finish();bar();build(queue[qi]);cancelAnimationFrame(raf);loop()}
function path(s,n){cx.beginPath();for(let i=0;i<n;i++)cx[i?'lineTo':'moveTo'](s[i][0]*K,s[i][1]*K);cx.stroke()}
function paintS(i){const s=strokes[i];if(i<cs)path(s,s.length);else if(i===cs&&ci>0)path(s,Math.min(ci+1,s.length))}
function loop(t=0){const W=cv.width;cx.clearRect(0,0,W,W);cx.lineCap=cx.lineJoin='round';
 if(result){cx.strokeStyle='#e8643c';cx.lineWidth=5*K;ink.forEach(l=>{if(l.length===1)l=[l[0],[l[0][0]+.01,l[0][1]]];path(l,l.length)});raf=requestAnimationFrame(loop);return}
 const gc=getComputedStyle(document.documentElement).getPropertyValue('--guide').trim()||'#eadfca';
 if(sgw){cx.strokeStyle=gc;cx.lineWidth=sgw*K;strokes.forEach(s=>path(s,s.length))}
 parts.forEach(o=>{cx.save();cx.scale(K,K);if(o.c)cx.clip(o.c);cx.fillStyle=gc;cx.strokeStyle=gc;cx.lineWidth=2;cx.fill(o.p);cx.stroke(o.p);cx.restore()});
 parts.forEach(o=>{cx.save();cx.scale(K,K);if(o.c)cx.clip(o.c);cx.clip(o.p);cx.setTransform(1,0,0,1,0,0);if(cs>=strokes.length){cx.fillStyle='#ffb347';cx.fillRect(0,0,W,W)}cx.strokeStyle='#ffb347';cx.lineWidth=14*K;strokes.forEach((s,i)=>paintS(i));cx.restore()});
 if(sgw){cx.strokeStyle='#ffb347';cx.lineWidth=sgw*K;strokes.forEach((s,i)=>paintS(i))}
 if(cs<strokes.length){const s=strokes[cs],e=s[s.length-1];cx.font=(10*K)+'px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('⭐',e[0]*K,e[1]*K);mids.forEach(m=>{if(m.s===cs&&ci<=m.i){const q=strokes[cs][m.i];cx.fillText('⭐',q[0]*K,q[1]*K)}});const h=s[Math.min(ci,s.length-1)];cx.fillStyle='#ff5d8f';cx.beginPath();cx.arc(h[0]*K,h[1]*K,(5+1.8*Math.sin(t/200))*K,0,7);cx.fill()}
 cx.strokeStyle='rgba(255,122,89,.45)';cx.lineWidth=3*K;ink.forEach(l=>path(l,l.length));
 raf=requestAnimationFrame(loop)}
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]}
function mark(a,b){const n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/3));for(let i=0;i<=n&&!locked;i++){const x=a[0]+(b[0]-a[0])*i/n,y=a[1]+(b[1]-a[1])*i/n;
  for(let g=1;g&&cs<strokes.length;){g=0;const s=strokes[cs];const gm=mids.filter(m=>m.s===cs).map(m=>m.i).find(i=>i>=ci);for(let j=Math.min(ci+3,s.length-1,gm===undefined?99:gm);j>=ci;j--){if((j<s.length-1||ci>=s.length-1)&&Math.hypot(s[j][0]-x,s[j][1]-y)<Math.min(s.r[j],(j===s.length-1||mids.some(m=>m.s===cs&&m.i===j))?5:8)){ci=j+1;g=1;break}}if(ci>=s.length)break}
  if(cs<strokes.length&&ci>=strokes[cs].length){cs++;ci=0;beep([660]);if(cs>=strokes.length)return done()}}}
cv.addEventListener('pointerdown',e=>{if(locked)return;cv.setPointerCapture(e.pointerId);drawing=true;last=pt(e);ink.push([last]);mark(last,last)});
cv.addEventListener('pointermove',e=>{if(!drawing||locked)return;const p=pt(e);ink[ink.length-1].push(p);mark(last,p);last=p});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{drawing=false}));
function done(){locked=true;const c=queue[qi];st.stat[c]=(st.stat[c]||0)+1;save();sparkle();beep([523,659,784]);if(set==='f'){inks[qi]=ink.map(l=>l.map(p=>[p[0],p[1]]));if(qi<queue.length-1)later(()=>{qi++;next()},1300);else later(()=>{$('look').style.display='block'},1000);return}later(()=>{qi++;next()},1600)}
function finish(){cancelAnimationFrame(raf);show('end');sparkle();beep([523,659,784,1047])}

$('bH').onclick=()=>start('h',0);$('bN').onclick=()=>start('n',0);$('bF').onclick=()=>{buildGrid();drawSel();show('pick')};$('selDel').onclick=()=>{sel.pop();drawSel()};$('selNl').onclick=()=>{if(sel.length&&sel[sel.length-1]!=='↲'){sel.push('↲');drawSel()}};$('selGo').onclick=()=>{if(sel.some(t=>t!=='↲'))startSeq()};$('look').onclick=()=>{cancelAnimationFrame(raf);showRes()};$('home6').onclick=()=>{sel=[];inks=[];show('menu')};$('again6').onclick=()=>startSeq();$('home5').onclick=()=>{sel=[];show('menu')};
$('home').onclick=()=>{cancelAnimationFrame(raf);if(set==='f'){buildGrid();drawSel();show('pick')}else show('menu')};$('home3').onclick=()=>{cancelAnimationFrame(raf);show('menu')};
$('retry').onclick=()=>{if(!locked||result)build(queue[qi])};
$('more').onclick=()=>set==='h'?start('h',idx<ROWS.length-1?idx+1:idx):start('n',0);
addEventListener('resize',()=>{if($('trace').classList.contains('on'))size()});

let gt;
$('gear').addEventListener('pointerdown',()=>{gt=setTimeout(()=>{
 const rows=[...ROWS.flat(),...NUMS].map(c=>`<tr><td>${c}</td><td>${st.stat[c]||0}</td></tr>`).join('');
 $('stats').innerHTML=`<table><tr><th>文字</th><th>できた回数</th></tr>${rows}</table>`;
 $('vol').value=st.vol;$('par').classList.add('on')},3000)});
['pointerup','pointerleave','pointercancel'].forEach(e=>$('gear').addEventListener(e,()=>clearTimeout(gt)));
$('cls').onclick=()=>$('par').classList.remove('on');
$('vol').oninput=e=>{st.vol=+e.target.value;save()};
$('rst').onclick=()=>{if(confirm('記録を消しますか？')){st={stat:{},vol:st.vol};save();$('par').classList.remove('on')}};
</script>
</body></html>
