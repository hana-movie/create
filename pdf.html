<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF エディタ</title>
<!--
  PDF エディタ (単一 HTML / ビルド不要 / GitHub Pages にそのまま置けます)
  ファイルはすべてブラウザ内で処理され、サーバーには送信されません。
  外部ライブラリ (CDN):  pdf.js 3.11 (表示) / pdf-lib 1.17 (書き出し) / tesseract.js 5 (OCR, 初回使用時に読み込み)
  スクリプトの構成:  [Core] → [Editor] → [App] → [Export] → [OCR] → [Stamps] → [StampEditor] → [Boot]
-->
<style>
:root{--bg:#f3f4f6;--panel:#fff;--line:#d5d9e0;--ink:#1f2937;--mute:#6b7280;--acc:#2563eb;--acc-bg:#e0eaff;--view:#525a66}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 "Segoe UI","Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 8px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;white-space:nowrap}
button:hover{background:#e8ebf0}
button:disabled{opacity:.4;cursor:default;background:none}
button.on{background:var(--acc-bg);border-color:#a9c1f7;color:#1d4ed8}
button.primary{background:var(--acc);color:#fff}
button.primary:hover{background:#1d4ed8}
button.bd{border-color:var(--line);background:#fff}
input[type=number],input[type=text],select,textarea{height:28px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:0 6px}
textarea{height:auto;padding:6px;user-select:text}
input[type=color]{width:30px;height:26px;padding:1px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}
input[type=number]{width:58px}
label.f{display:inline-flex;align-items:center;gap:4px;color:var(--mute);white-space:nowrap}
#app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:3px;padding:4px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.sep{width:1px;height:22px;background:var(--line);margin:0 5px}
.grow{flex:1}
#body{flex:1;display:flex;min-height:0}
#side{width:178px;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
#sideBtns{display:flex;flex-wrap:wrap;gap:1px;padding:4px;border-bottom:1px solid var(--line)}
#sideBtns button{padding:0 6px}
#thumbs{flex:1;overflow-y:auto;padding:8px 6px}
.thumb{position:relative;margin:0 auto 8px;padding:5px 5px 2px;border:2px solid transparent;border-radius:6px;text-align:center;cursor:pointer;width:150px}
.thumb.sel{background:var(--acc-bg)}
.thumb.cur{border-color:var(--acc)}
.thumb canvas,.thumb .ph{display:block;margin:0 auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.thumb .no{font-size:11px;color:var(--mute);padding-top:2px}
.thumb .badge{position:absolute;right:8px;top:8px;background:#059669;color:#fff;font-size:9px;padding:0 4px;border-radius:3px}
.thumb.dropb::before,.thumb.dropa::after{content:"";position:absolute;left:4px;right:4px;height:3px;background:var(--acc);border-radius:2px}
.thumb.dropb::before{top:-6px}.thumb.dropa::after{bottom:-6px}
#view{flex:1;overflow:auto;background:var(--view);position:relative}
#stage{position:relative;margin:48px auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.5)}
#pdfc{position:absolute;left:0;top:0;width:100%;height:100%}
#ovc{position:absolute;left:-48px;top:-48px}
.text-edit{position:absolute;z-index:5;margin:0;padding:0;border:1px dashed var(--acc);border-radius:0;outline:none;resize:none;overflow:hidden;background:rgba(255,255,255,.6);white-space:pre;height:auto;min-height:0;user-select:text}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e5e7eb}
#empty .box{border:2px dashed #9ca3af;border-radius:14px;padding:44px 60px;text-align:center;max-width:560px}
#empty h1{font-size:22px;margin:0 0 10px}
#empty p{margin:6px 0;color:#cbd5e1}
#empty button{margin-top:16px;height:38px;padding:0 20px;font-size:14px}
#cropBar{position:absolute;z-index:6;display:flex;gap:4px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.3)}
#selMenu{position:absolute;z-index:6;display:flex;flex-direction:column;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.3)}
#selMenu .row{display:flex;border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:3px}
#stampPane{width:232px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
#stampPane h4,.se-right h4{margin:0;padding:8px 10px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
#stampGrid{flex:1;min-height:0;grid-auto-rows:max-content;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;align-content:start}
.st{position:relative;border:1px solid var(--line);border-radius:6px;padding:6px 4px 3px;text-align:center;cursor:pointer;background:#fff}
.st:hover{border-color:var(--acc)}
.st canvas{max-width:88px;max-height:66px}
.st .nm{font-size:10px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .ops{position:absolute;right:2px;top:2px;display:none;gap:1px}
.st:hover .ops{display:flex}
.st .ops button{height:20px;padding:0 4px;font-size:10px;background:#fff;border-color:var(--line)}
#status{padding:3px 10px;font-size:11px;color:var(--mute);background:var(--panel);border-top:1px solid var(--line);display:flex;gap:16px}
#toasts{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#111827;color:#fff;padding:8px 16px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.35);max-width:80vw}
#busy{position:fixed;inset:0;z-index:90;background:rgba(17,24,39,.55);display:flex;align-items:center;justify-content:center}
#busy[hidden],[hidden]{display:none!important}
#busy .box{background:#fff;border-radius:10px;padding:20px 26px;min-width:300px}
#busy .track{height:6px;background:#e5e7eb;border-radius:3px;margin-top:12px;overflow:hidden}
#busyBar{height:100%;width:0;background:var(--acc);transition:width .2s}
.modal{position:fixed;inset:0;z-index:60;background:rgba(17,24,39,.5);display:flex;align-items:center;justify-content:center}
.dlg{background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.4);min-width:340px;max-width:92vw;max-height:92vh;display:flex;flex-direction:column}
.dlg h3{margin:0;padding:12px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.dlg-body{padding:14px 16px;overflow:auto}
.dlg-foot{display:flex;justify-content:flex-end;gap:6px;padding:10px 16px;border-top:1px solid var(--line)}
.dlg-foot button{border-color:var(--line)}
.form{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.form input[type=text],.form select,.form textarea{width:100%}
.note{color:var(--mute);font-size:12px;margin:8px 0 0}
/* ---- スタンプ作成ツール ---- */
#se{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.se-body{flex:1;display:flex;min-height:0}
.se-tools{width:44px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}
.se-tools button{width:34px;height:34px;padding:0;justify-content:center}
.se-canvas{flex:1;position:relative;overflow:hidden;background:#9aa1ad}
.se-canvas canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.se-right{width:268px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto}
.props{padding:8px 10px;display:grid;grid-template-columns:74px 1fr;gap:6px 8px;align-items:center}
.props>span{color:var(--mute);font-size:12px}
.props .row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.props textarea,.props select{width:100%}
.props .full{grid-column:1/3}
.layers{padding:6px}
.layer{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:5px;cursor:pointer;font-size:12px}
.layer:hover{background:#eef1f5}.layer.on{background:var(--acc-bg)}
.layer span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sePrev{display:block;margin:8px auto;max-width:150px;max-height:110px}
#sigPad{border:1px solid var(--line);border-radius:6px;background:#fff;touch-action:none;cursor:crosshair;display:block}
</style>
</head>
<body>
<div id="app">
  <div class="bar" id="row1">
    <button data-act="open" title="PDF・画像を開く (Ctrl+O)"><i data-ic="open"></i>開く</button>
    <button data-act="add" title="別の PDF や画像を末尾に追加して結合"><i data-ic="plus"></i>結合・追加</button>
    <button data-act="save" class="primary" title="編集結果を PDF として保存 (Ctrl+S)"><i data-ic="save"></i>保存</button>
    <span class="sep"></span>
    <button data-act="undo" title="元に戻す (Ctrl+Z)"><i data-ic="undo"></i></button>
    <button data-act="redo" title="やり直す (Ctrl+Y)"><i data-ic="redo"></i></button>
    <span class="sep"></span>
    <button data-act="zoomout" title="縮小">−</button>
    <select id="zoomSel" title="表示倍率"></select>
    <button data-act="zoomin" title="拡大">＋</button>
    <span class="sep"></span>
    <button data-act="prev" title="前のページ (PageUp)">◀</button>
    <input id="pageNo" type="number" min="1" value="1" style="width:52px"><span id="pageTotal" style="color:var(--mute)">/ 0</span>
    <button data-act="next" title="次のページ (PageDown)">▶</button>
    <span class="sep"></span>
    <button data-act="ocr" title="スキャン PDF を文字認識して検索可能にする"><i data-ic="ocr"></i>OCR</button>
    <button data-act="extractText" title="ページの文字を取り出す"><i data-ic="text"></i>テキスト抽出</button>
    <span class="grow"></span>
    <input id="docName" type="text" style="width:200px" title="保存するファイル名" placeholder="ファイル名">
  </div>
  <div class="bar" id="row2">
    <span id="toolBtns" style="display:contents"></span>
    <span class="sep"></span>
    <label class="f" title="線・文字の色">色<input type="color" id="stColor" value="#e11d48"></label>
    <label class="f" title="図形の塗り">塗り<input type="color" id="stFill" value="#ffffff"></label>
    <label class="f"><input type="checkbox" id="stNoFill" checked>なし</label>
    <label class="f">太さ<input type="number" id="stSw" min="0.5" max="40" step="0.5" value="2"></label>
    <select id="stFont" title="フォント" style="width:104px"></select>
    <label class="f">サイズ<input type="number" id="stSize" min="4" max="300" value="14"></label>
    <button id="stBold" title="太字"><b>B</b></button>
    <label class="f">不透明度<input type="range" id="stOp" min="0.1" max="1" step="0.05" value="1" style="width:70px"></label>
    <span class="sep"></span>
    <button data-act="front" title="最前面へ"><i data-ic="front"></i></button>
    <button data-act="back" title="最背面へ"><i data-ic="back"></i></button>
    <button data-act="delObj" title="選択したオブジェクトを削除 (Delete)"><i data-ic="trash"></i></button>
  </div>
  <div id="body">
    <div id="side">
      <div id="sideBtns">
        <button data-act="rotl" title="左に90°回転"><i data-ic="rotl"></i></button>
        <button data-act="rotr" title="右に90°回転"><i data-ic="rotr"></i></button>
        <button data-act="dupPage" title="ページを複製"><i data-ic="copy"></i></button>
        <button data-act="delPage" title="ページを削除"><i data-ic="trash"></i></button>
        <button data-act="blank" title="白紙ページを挿入"><i data-ic="blank"></i></button>
        <button data-act="extract" title="ページを抜き出して別の PDF として保存"><i data-ic="extract"></i>抽出</button>
        <button data-act="uncrop" title="トリミングを元に戻す">切抜解除</button>
      </div>
      <div id="thumbs"></div>
    </div>
    <div id="view">
      <div id="stage" hidden><canvas id="pdfc"></canvas><canvas id="ovc"></canvas></div>
      <div id="empty"><div class="box">
        <h1>PDF エディタ</h1>
        <p>PDF や画像をここにドラッグ&ドロップ</p>
        <p style="font-size:12px">ページ整理・結合・トリミング・注釈・テキスト編集・OCR・スタンプ<br>ファイルはブラウザの中だけで処理され、どこにも送信されません</p>
        <button class="primary" data-act="open">ファイルを開く</button>
      </div></div>
    </div>
    <div id="stampPane" hidden>
      <h4>スタンプ<span class="grow"></span><button class="bd" data-act="newStamp" title="スタンプ作成ツールを開く"><i data-ic="plus"></i>作成</button></h4>
      <div id="stampGrid"></div>
      <p class="note" style="padding:0 10px 8px">選んでからページをクリックで押印。自作スタンプはこのブラウザに保存されます。</p>
    </div>
  </div>
  <div id="status"><span id="stMsg">準備完了</span><span class="grow"></span><span id="stPage"></span></div>
</div>
<div id="toasts"></div>
<div id="busy" hidden><div class="box"><div id="busyMsg"></div><div class="track"><div id="busyBar"></div></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
'use strict';
/* =====================================================================
 * [Core] ユーティリティ / 行列 / オブジェクトモデル / 描画
 *   オブジェクトはすべて JSON 化できるプレーンオブジェクトで、変更時は
 *   必ず新しいオブジェクトに差し替える (イミュータブル)。Undo はこの前提。
 * ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k in e && k !== 'list') e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k);
  return e;
}
let _uid = 1;
const uid = () => 'o' + Date.now().toString(36) + (_uid++).toString(36);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const RAD = Math.PI / 180;
const round2 = v => Math.round(v * 100) / 100;

const IC = {
  select: 'M5 3l14 8-6 2-2 6z', text: 'M5 5h14M12 5v14M9 19h6',
  edittext: 'M4 20h4L19 9l-4-4L4 16zM13 7l4 4M13 20h7',
  ink: 'M3 17c3-6 5-8 7-6s-2 7 1 7 4-9 9-10', highlight: 'M4 20h6M8 16l9-9 3 3-9 9H8z',
  whiteout: 'M4 15l8-8 8 8-4 4H8zM9 12l6 6', rect: 'M4 6h16v12H4z', ellipse: 'M12 5a8 7 0 1 0 .01 0z',
  line: 'M4 20L20 4', arrow: 'M4 20L20 4M11 4h9v9',
  image: 'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4', sign: 'M3 17c4-9 6-9 6-4s3 2 5-1 2 4 7 2M3 21h18',
  stamp: 'M9 3h6v5l3 5v3H6v-3l3-5zM5 20h14', crop: 'M7 2v15h15M2 7h15v15',
  pen: 'M4 20l2-7L16 3l5 5-10 10zM13 6l5 5', node: 'M5 3l12 9-5 1-1 6zM16 17h4v4h-4z',
  polygon: 'M12 3l8 6-3 10H7L4 9z', star: 'M12 3l2.7 5.8 6.3.8-4.6 4.3 1.2 6.1L12 17l-5.6 3 1.2-6.1L3 9.6l6.3-.8z',
  undo: 'M9 7L4 12l5 5M4 12h10a5 5 0 0 1 0 10h-2', redo: 'M15 7l5 5-5 5M20 12H10a5 5 0 0 0 0 10h2',
  open: 'M3 6h6l2 2h10v11H3z', save: 'M5 3h11l3 3v15H5zM8 3v6h7V3M8 21v-7h8v7', plus: 'M12 5v14M5 12h14',
  rotl: 'M4 4v6h6M4.5 10A8 8 0 1 1 6 17', rotr: 'M20 4v6h-6M19.5 10A8 8 0 1 0 18 17',
  trash: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13', copy: 'M8 8h12v12H8zM4 16V4h12',
  ocr: 'M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 9h8M8 12h8M8 15h5', extract: 'M6 3h9l4 4v14H6zM12 10v7M9 14l3 3 3-3',
  blank: 'M6 3h9l4 4v14H6zM12 11v6M9 14h6', front: 'M8 8h12v12H8zM4 4h8v2H6v6H4z', back: 'M4 4h12v12H4zM18 10h2v10H10v-2h8z',
  close: 'M6 6l12 12M18 6L6 18', uline: 'M7 4v7a5 5 0 0 0 10 0V4M5 20h14', strike: 'M4 12h16M8 7c0-2 2-3 4-3s4 1 4 3M8 17c0 2 2 3 4 3s4-1 4-3',
};
const icon = n => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[n] || ''}"/></svg>`;

/* ---- 行列 [a,b,c,d,e,f] (canvas と同じ並び) ---- */
const Mx = {
  mul(m, n) {
    return [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
      m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
  },
  inv(m) {
    const d = m[0] * m[3] - m[1] * m[2];
    return [m[3] / d, -m[1] / d, -m[2] / d, m[0] / d, (m[2] * m[5] - m[3] * m[4]) / d, (m[1] * m[4] - m[0] * m[5]) / d];
  },
  pt(m, x, y) { return [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]]; },
  /* PDF ユーザー空間 → 表示座標 (左上原点, y下向き)。box=[x1,y1,x2,y2], R=0/90/180/270 */
  view(box, R, s) {
    const [x1, y1, x2, y2] = box;
    switch (((R % 360) + 360) % 360) {
      case 90: return [0, s, s, 0, -y1 * s, -x1 * s];
      case 180: return [-s, 0, 0, s, x2 * s, -y1 * s];
      case 270: return [0, -s, -s, 0, y2 * s, x2 * s];
      default: return [s, 0, 0, -s, -x1 * s, y2 * s];
    }
  },
};
const FLIP = [1, 0, 0, -1, 0, 0];

const FONTS = [
  ['ゴシック', '"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",Meiryo,sans-serif'],
  ['明朝', '"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","Noto Serif CJK JP","MS PMincho",serif'],
  ['丸ゴシック', '"HG丸ｺﾞｼｯｸM-PRO","Hiragino Maru Gothic ProN","Kosugi Maru",sans-serif'],
  ['楷書・行書', '"HG正楷書体-PRO","HGP行書体","Yu Kyokasho","Klee One",serif'],
  ['Arial', 'Arial,Helvetica,sans-serif'],
  ['Times', '"Times New Roman",Times,serif'],
  ['等幅', 'Consolas,"Courier New",monospace'],
  ['Impact', 'Impact,"Arial Black",sans-serif'],
];

/* ---- 画像キャッシュ ---- */
const imgCache = new Map();
let redrawAll = () => {};
function getImg(src) {
  let im = imgCache.get(src);
  if (!im) { im = new Image(); im.onload = () => redrawAll(); im.src = src; imgCache.set(src, im); }
  return im.complete && im.naturalWidth ? im : null;
}
function loadImg(src) {
  return new Promise((res, rej) => {
    const im = getImg(src); if (im) return res(im);
    const i = imgCache.get(src);
    i.addEventListener('load', () => res(i), { once: true });
    i.addEventListener('error', () => rej(new Error('画像を読み込めません')), { once: true });
  });
}
const ensureImages = items => Promise.all(items.filter(o => o.type === 'image').map(o => loadImg(o.src).catch(() => null)));

/* ---- 図形 → ベジェノード (ローカル座標・中心原点) ---- */
const KAPPA = 0.5522847498;
