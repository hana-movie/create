<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ブンブンサッカー">
<meta name="theme-color" content="#9fd8ff">
<title>ブンブンサッカー</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(180deg, #9fd8ff 0%, #d9f1ff 60%, #fff4d6 100%);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #3d3355;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    position: fixed; inset: 0;
    padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    display: grid; gap: 8px;
    grid-template-rows: auto minmax(0, 1fr) auto;
  }
  #top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .group { display: flex; align-items: center; gap: 10px; }
  .pill {
    background: rgba(255,255,255,.88); border-radius: 999px; padding: 6px 18px;
    font-size: clamp(22px, 3.4vw, 34px); font-weight: bold;
    box-shadow: 0 4px 0 rgba(90,110,160,.18);
  }
  .iconbtn {
    width: clamp(46px, 6.5vw, 60px); height: clamp(46px, 6.5vw, 60px);
    border: none; border-radius: 50%; background: rgba(255,255,255,.88);
    font-size: clamp(22px, 3.2vw, 30px); box-shadow: 0 4px 0 rgba(90,110,160,.18);
    touch-action: manipulation; cursor: pointer;
  }
  #boardWrap { position: relative; min-height: 0; }
  #board { position: absolute; inset: 0; display: block; }

  #ctrl { display: flex; justify-content: space-between; align-items: flex-end; }
  .btn {
    width: clamp(82px, 13vw, 132px); height: clamp(82px, 13vw, 132px);
    border: none; border-radius: 30px; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: inherit; font-weight: bold; line-height: 1;
    touch-action: none; cursor: pointer;
  }
  @media (orientation: portrait) {
    .btn { width: clamp(82px, 20vw, 140px); height: clamp(82px, 20vw, 140px); }
  }
  .btn .ic { font-size: clamp(38px, 6vw, 60px); }
  .btn .lb { font-size: clamp(13px, 1.8vw, 18px); margin-top: 4px; opacity: .95; }
  .btn.move  { background: #ff9f43; box-shadow: 0 9px 0 #d97a1e; }
  .btn.jump  { background: #3d8bff; box-shadow: 0 9px 0 #2563c7; }
  .btn.boost { background: #ff5a6e; box-shadow: 0 9px 0 #c9304a; }
  .btn.on { transform: translateY(7px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .gap { width: clamp(10px, 2.4vw, 24px); }

  #bigText, #toast {
    position: absolute; left: 50%; top: 35%; transform: translate(-50%, -50%) scale(0);
    font-weight: bold; color: #fff; white-space: nowrap; pointer-events: none; opacity: 0;
  }
  #bigText { font-size: clamp(54px, 11vw, 120px); text-shadow: 0 6px 0 #ff6fa0, 0 0 24px rgba(255,111,160,.8); }
  #toast { top: 18%; font-size: clamp(28px, 5vw, 52px); text-shadow: 0 4px 0 #3d8bff, 0 0 14px rgba(61,139,255,.7); }
  .pop { animation: pop 1.6s ease-out forwards; }
  .pop2 { animation: pop 1.1s ease-out forwards; }
  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(.2) rotate(-10deg); opacity: 0; }
    18%  { transform: translate(-50%, -50%) scale(1.25) rotate(4deg); opacity: 1; }
    30%  { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
    80%  { transform: translate(-50%, -55%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -70%) scale(.9); opacity: 0; }
  }

  .screen {
    position: fixed; inset: 0; display: none; z-index: 10;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(159, 216, 255, .78);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .screen.active { display: flex; }
  .card {
    background: #fff; border-radius: 36px; padding: clamp(18px, 3.5vw, 36px);
    text-align: center; max-width: 720px; width: 100%; max-height: 100%; overflow: auto;
    box-shadow: 0 10px 0 rgba(90,110,160,.2);
  }
  .card h1 { margin: 0 0 4px; font-size: clamp(36px, 6.5vw, 62px); color: #ff6fa0; letter-spacing: .05em; }
  .card h2 { margin: 0 0 10px; font-size: clamp(34px, 6vw, 56px); color: #ff6fa0; }
  .card p { font-size: clamp(18px, 2.8vw, 26px); margin: 6px 0; line-height: 1.5; }
  .howto { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 20px; margin: 12px 0; font-size: clamp(16px, 2.4vw, 22px); }
  .howto b { display: inline-flex; width: 1.8em; height: 1.8em; border-radius: 10px; color: #fff; align-items: center; justify-content: center; margin-right: 4px; }
  .cars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
  .carbtn {
    border: 4px solid #e6ecf7; background: #f6f9ff; border-radius: 22px; padding: 10px 4px;
    cursor: pointer; touch-action: manipulation;
  }
  .carbtn:active { transform: scale(.94); }
  .carbtn canvas { display: block; margin: 0 auto; width: 100%; height: auto; }
  .bigbtn {
    display: block; width: 100%; margin: 14px 0 0; padding: 18px 10px;
    border: none; border-radius: 26px; color: #fff; cursor: pointer;
    font-size: clamp(28px, 5vw, 44px); font-weight: bold; font-family: inherit;
    touch-action: manipulation;
  }
  .b-go { background: #2ec4b6; box-shadow: 0 8px 0 #1f9389; }
  .b-gray { background: #9aa5c4; box-shadow: 0 8px 0 #77819f; }
  .hint { color: #8a93b0; font-size: clamp(15px, 2.2vw, 20px) !important; }
  .selbtn {
    display: inline-block; margin-top: 12px; padding: 10px 22px; border-radius: 999px;
    background: #eef2fb; color: #6a7396; text-decoration: none; font-weight: bold;
    font-size: clamp(16px, 2.4vw, 22px); box-shadow: 0 4px 0 #d3daea;
  }
  .selbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #d3daea; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="group">
      <button class="iconbtn" id="pauseBtn" aria-label="ひとやすみ">⏸</button>
      <button class="iconbtn" id="soundBtn" aria-label="おと">🔊</button>
    </div>
    <div class="pill">⚽ × <span id="score">0</span></div>
  </div>

  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="bigText"></div>
    <div id="toast"></div>
  </div>

  <div id="ctrl">
    <div class="group">
      <button class="btn move" id="btnLeft" aria-label="ひだり"><span class="ic">◀</span></button>
      <span class="gap"></span>
      <button class="btn move" id="btnRight" aria-label="みぎ"><span class="ic">▶</span></button>
    </div>
    <div class="group">
      <button class="btn jump" id="btnJump" aria-label="ジャンプ"><span class="ic">⤒</span><span class="lb">ジャンプ</span></button>
      <span class="gap"></span>
      <button class="btn boost" id="btnBoost" aria-label="ブースト"><span class="ic">🔥</span><span class="lb">ブースト</span></button>
    </div>
  </div>
</div>

<!-- タイトル -->
<div class="screen active" id="titleScreen">
  <div class="card">
    <h1>ブンブンサッカー</h1>
    <p>くるまで ボールを おして ゴールに いれよう！</p>
    <p>かべや てんじょうも はしれるよ！</p>
    <div class="howto">
      <span><b style="background:#ff9f43">◀</b><b style="background:#ff9f43">▶</b>はしる</span>
      <span><b style="background:#3d8bff">⤒</b>ジャンプ（くうちゅうで もういちど → くるん！）</span>
      <span><b style="background:#ff5a6e">🔥</b>ブースト</span>
    </div>
    <p><b>くるまを えらんでね</b></p>
    <div class="cars" id="carPick"></div>
    <p class="hint">iPadを よこむきに すると おおきく あそべます</p>
    <a class="selbtn" href="../gameselect.html">🏠 ゲームを えらびなおす</a>
  </div>
</div>

<!-- ひとやすみ -->
<div class="screen" id="pauseScreen">
  <div class="card">
    <h2>ひとやすみ</h2>
    <button class="bigbtn b-go" id="resumeBtn">つづける</button>
    <button class="bigbtn b-gray" id="quitBtn">はじめに もどる</button>
    <a class="bigbtn b-gray" style="text-decoration:none;box-sizing:border-box" href="../gameselect.html">🏠 ゲームを えらぶ</a>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ===== せかいの おおきさ =====
  const HW = 800, HH = 450;          // アリーナの はんぶんの はば・たかさ
  const R = 170;                     // かどの まるみ
  const GT = -40, GB = HH - R;       // ゴールの くち（うえ・した）
  const GD = 150;                    // ゴールの おくゆき
  const BR = 58;                     // ボールの はんけい
  const CS = 1.35;                    // くるまの おおきさ
  const CAR_H = 26 * CS;              // くるまの まんなか〜じめん
  const CAR_R = 46 * CS;              // くるまの あたりはんけい
  const VW = (HW + GD + 30) * 2, VH = (HH + 30) * 2;

  // ===== うごきの つよさ =====
  const G_CAR = 1500, G_BALL = 1050;
  const ACC = 1500, FRIC = 750, MAXV = 950;
  const BOOST_ACC = 2300, BOOST_MAX = 1600;
  const JUMP = 720, FLIP = 720;

  const CAR_COLORS = [
    { body: '#ff5a5f', dark: '#c73a40' },
    { body: '#3d8bff', dark: '#2563c7' },
    { body: '#38c172', dark: '#23894f' },
    { body: '#ffc93c', dark: '#d19a00' },
  ];
  const GOAL_COLORS = { '-1': '#3d8bff', '1': '#ff9f43' };

  // ===== DOM =====
  const $ = id => document.getElementById(id);
  const canvas = $('board'), ctx = canvas.getContext('2d');
  const wrap = $('boardWrap');
  const view = { w: 1, h: 1, s: 1, dpr: 1 };

  // ===== じょうたい =====
  let state = 'title';
  let carColor = 0, goals = 0, goalTimer = 0;
  let car, ball, particles = [];
  const inp = { left: false, right: false, boost: false };
  const toastCool = { wall: 0, ceil: 0 };
  let lastTime = 0, soundOn = true, wasOn = { wall: false, ceil: false };

  // ===== おと =====
  let actx = null, eng = null;
  function initAudio() {
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
        o.type = 'sawtooth'; o.frequency.value = 60;
        f.type = 'lowpass'; f.frequency.value = 500;
        g.gain.value = 0;
        o.connect(f).connect(g).connect(actx.destination);
        o.start();
        eng = { o, g };
      }
      if (actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  function tone(freq, dur, type = 'sine', vol = 0.15, toFreq = null, delay = 0) {
    if (!soundOn || !actx) return;
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const sfx = {
    jump:   () => tone(380, 0.16, 'sine', 0.15, 820),
    flip:   () => { tone(600, 0.12, 'triangle', 0.12, 1200); tone(900, 0.14, 'triangle', 0.08, 1500, 0.08); },
    land:   () => tone(170, 0.08, 'sine', 0.1, 90),
    kick:   (v) => tone(180 + v * 260, 0.12, 'square', 0.06 + v * 0.08, 90),
    bounce: () => tone(300, 0.06, 'sine', 0.05, 200),
    toast:  () => { tone(880, 0.1, 'triangle', 0.08); tone(1175, 0.14, 'triangle', 0.08, null, 0.09); },
    goal:   () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i === 5 ? 0.45 : 0.14, 'square', 0.07, null, i * 0.12)); },
    start:  () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.15, 'triangle', 0.1, null, i * 0.09)); },
  };
  function updateEngine() {
    if (!eng) return;
    const t = actx.currentTime;
    const playing = soundOn && state === 'play';
    const sp = car ? Math.hypot(car.vx, car.vy) : 0;
    eng.g.gain.setTargetAtTime(playing ? 0.022 + (inp.boost ? 0.02 : 0) : 0, t, 0.08);
    eng.o.frequency.setTargetAtTime(55 + sp * 0.07 + (inp.boost ? 35 : 0), t, 0.08);
  }

  // ===== アリーナの かたち（かべまでの きょりと むき） =====
  function sdf(x, y) {
    const hx = HW - R, hy = HH - R;
    const qx = Math.abs(x) - hx, qy = Math.abs(y) - hy;
    const sx = x < 0 ? -1 : 1, sy = y < 0 ? -1 : 1;
    if (qx > 0 && qy > 0) {
      const L = Math.hypot(qx, qy);
      return { d: L - R, nx: sx * qx / L, ny: sy * qy / L };
    }
    if (qx > qy) return { d: qx - R, nx: sx, ny: 0 };
    return { d: qy - R, nx: 0, ny: sy };
  }

  // ===== はじめる =====
  function resetCar() {
    car = {
      x: -350, y: HH - CAR_H, vx: 0, vy: 0, vt: 0,
      grounded: true, nx: 0, ny: 1, face: 1, angle: 0,
      lockSign: 1, lastD: 0, needLock: true,
      flipOK: false, flipSpin: 0, noStick: 0, wheel: 0,
    };
  }
  function resetBall() {
    ball = { x: 0, y: -180, vx: (Math.random() - 0.5) * 200, vy: 0, rot: 0, inNet: 0 };
    for (let i = 0; i < 14; i++) spark(ball.x, ball.y, '#ffe066', 300);
  }
  function startGame(color) {
    initAudio();
    carColor = color;
    goals = 0; $('score').textContent = '0';
    particles = []; goalTimer = 0;
    resetCar(); resetBall();
    hideScreens();
    sfx.start();
    state = 'play';
  }

  // ===== くるま =====
  function doJump() {
    if (state !== 'play') return;
    const c = car;
    if (c.grounded) {
      c.grounded = false;
      c.vx += -c.nx * JUMP; c.vy += -c.ny * JUMP;
      c.noStick = 0.25; c.flipOK = true;
      sfx.jump();
    } else if (c.flipOK) {
      c.flipOK = false;
      const nx = Math.cos(c.angle) * c.face, ny = Math.sin(c.angle) * c.face;
      c.vx += nx * FLIP; c.vy += ny * FLIP - 160;
      c.flipSpin = Math.PI * 2;
      sfx.flip();
    }
  }

  function land(s) {
    const c = car;
    const tx = s.ny, ty = -s.nx;
    const nose = [Math.cos(c.angle) * c.face, Math.sin(c.angle) * c.face];
    c.vt = c.vx * tx + c.vy * ty;
    c.face = Math.sign(nose[0] * tx + nose[1] * ty) || c.face;
    c.grounded = true; c.nx = s.nx; c.ny = s.ny;
    c.needLock = true; c.flipSpin = 0;
    sfx.land();
  }

  function updateCar(dt) {
    const c = car;
    const d = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    if (c.noStick > 0) c.noStick -= dt;

    if (c.grounded) {
      let tx = c.ny, ty = -c.nx;
      if (d !== 0) {
        // おしはじめた ときの むきを おぼえておく（おしっぱなしで ぐるっと 1しゅう できる）
        if (d !== c.lastD || c.needLock) {
          let dx, dy;
          if (Math.abs(tx) > 0.3) { dx = d; dy = 0; }
          else if (d === Math.sign(c.nx)) { dx = 0; dy = -1; } // かべの ほうへ おすと のぼる
          else { dx = 0; dy = 1; }
          c.lockSign = Math.sign(dx * tx + dy * ty) || 1;
          c.needLock = false;
        }
        c.vt += c.lockSign * ACC * dt;
        c.face = c.lockSign;
      } else {
        const f = FRIC * dt;
        c.vt = Math.abs(c.vt) <= f ? 0 : c.vt - Math.sign(c.vt) * f;
      }
      c.lastD = d;
      if (inp.boost) c.vt += c.face * BOOST_ACC * dt;
      c.vt += G_CAR * 0.55 * ty * dt; // さかみちの おもさ
      const lim = inp.boost ? BOOST_MAX : MAXV;
      if (Math.abs(c.vt) > lim) c.vt = Math.sign(c.vt) * Math.max(lim, Math.abs(c.vt) - 2200 * dt);

      c.x += tx * c.vt * dt; c.y += ty * c.vt * dt;
      const s = sdf(c.x, c.y);
      c.x -= s.nx * (s.d + CAR_H); c.y -= s.ny * (s.d + CAR_H);
      c.nx = s.nx; c.ny = s.ny;
      tx = c.ny; ty = -c.nx;
      c.vx = tx * c.vt; c.vy = ty * c.vt;
      c.angle = Math.atan2(ty, tx);

      // かべ・てんじょうで おそいと おちる
      if (c.ny < 0.5 && Math.abs(c.vt) < 220) {
        c.grounded = false; c.noStick = 0.25; c.flipOK = true;
        c.vx += -c.nx * 90; c.vy += -c.ny * 90;
      }
    } else {
      c.vy += G_CAR * dt;
      if (d !== 0) { c.vx += d * 520 * dt; c.angle += d * 2.4 * dt; }
      if (inp.boost) {
        c.vx += Math.cos(c.angle) * c.face * BOOST_ACC * 0.8 * dt;
        c.vy += Math.sin(c.angle) * c.face * BOOST_ACC * 0.8 * dt;
      }
      const sp = Math.hypot(c.vx, c.vy);
      if (sp > 1800) { c.vx *= 1800 / sp; c.vy *= 1800 / sp; }
      c.x += c.vx * dt; c.y += c.vy * dt;
      const s = sdf(c.x, c.y);
      if (s.d > -CAR_H) {
        c.x -= s.nx * (s.d + CAR_H); c.y -= s.ny * (s.d + CAR_H);
        if (c.noStick > 0 && s.ny < 0.5) {
          const vn = c.vx * s.nx + c.vy * s.ny;
          if (vn > 0) { c.vx -= 1.3 * vn * s.nx; c.vy -= 1.3 * vn * s.ny; }
        } else {
          land(s);
        }
      }
    }
    if (c.flipSpin > 0) c.flipSpin = Math.max(0, c.flipSpin - dt * 15);
    c.wheel += (c.grounded ? c.vt * c.face : 300) * dt / 14;
  }

  // ===== ボール =====
  function bounce(b, nx, ny, e) {
    const vn = b.vx * nx + b.vy * ny;
    if (vn > 0) {
      const ee = vn < 70 ? 0 : e;
      b.vx -= (1 + ee) * vn * nx; b.vy -= (1 + ee) * vn * ny;
      const tx = -ny, ty = nx, vt = b.vx * tx + b.vy * ty;
      b.vx -= tx * vt * 0.004; b.vy -= ty * vt * 0.004;
      if (vn > 260) sfx.bounce();
    }
  }
  function collidePoint(b, px, py) {
    const dx = b.x - px, dy = b.y - py, dist = Math.hypot(dx, dy);
    if (dist < BR && dist > 0.01) {
      const nx = dx / dist, ny = dy / dist;
      b.x = px + nx * BR; b.y = py + ny * BR;
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) { b.vx -= 1.7 * vn * nx; b.vy -= 1.7 * vn * ny; sfx.bounce(); }
    }
  }
  function updateBall(dt) {
    const b = ball;
    b.vy += G_BALL * dt;
    b.vx *= 1 - 0.15 * dt; b.vy *= 1 - 0.05 * dt;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > 2400) { b.vx *= 2400 / sp; b.vy *= 2400 / sp; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.rot += b.vx * dt / BR;

    if (b.inNet) {
      const s = b.inNet;
      b.vx *= 1 - 3 * dt; b.vy *= 1 - 1 * dt;
      const xmax = HW + GD - BR;
      if (s * b.x > xmax) { b.x = s * xmax; b.vx = -b.vx * 0.3; }
      if (s * b.x < HW + BR * 0.2) { b.x = s * (HW + BR * 0.2); b.vx = Math.abs(b.vx) * s * 0.3; }
      if (b.y > GB) { b.y = GB; b.vy = -Math.abs(b.vy) * 0.3; }
      if (b.y < GT + BR) { b.y = GT + BR; b.vy = Math.abs(b.vy) * 0.3; }
      return;
    }
    const s = sdf(b.x, b.y);
    if (s.d > -BR) {
      const mouth = s.ny === 0 && b.y > GT && b.y < GB;
      if (!mouth) {
        b.x -= s.nx * (s.d + BR); b.y -= s.ny * (s.d + BR);
        bounce(b, s.nx, s.ny, 0.72);
      }
    }
    collidePoint(b, -HW, GT); collidePoint(b, HW, GT);
    if (Math.abs(b.x) > HW + 6 && b.y > GT) scoreGoal(b.x < 0 ? -1 : 1);
  }

  function carBall() {
    const c = car, b = ball;
    if (b.inNet) return;
    const dx = b.x - c.x, dy = b.y - c.y, dist = Math.hypot(dx, dy), min = BR + CAR_R;
    if (dist < min && dist > 0.01) {
      const nx = dx / dist, ny = dy / dist;
      b.x = c.x + nx * min; b.y = c.y + ny * min;
      const rvx = b.vx - c.vx, rvy = b.vy - c.vy, vn = rvx * nx + rvy * ny;
      if (vn < 0) {
        b.vx -= 1.6 * vn * nx; b.vy -= 1.6 * vn * ny;
        b.vx += nx * 130; b.vy += ny * 130 - 80;
        const v = Math.min(1, -vn / 1300);
        sfx.kick(v);
        if (v > 0.35) for (let i = 0; i < 8; i++) spark(c.x + nx * CAR_R, c.y + ny * CAR_R, '#fff3a0', 400);
      }
    }
  }

  function scoreGoal(side) {
    ball.inNet = side;
    goals++;
    $('score').textContent = goals;
    goalTimer = 2.4;
    const cx = side * (HW + GD / 2), cy = (GT + GB) / 2;
    for (let i = 0; i < 90; i++) confetti(cx, cy);
    showText($('bigText'), 'ゴール！', 'pop');
    sfx.goal();
  }

  // ===== つぶつぶ =====
  const CONF = ['#ff5a6e', '#3d8bff', '#ffc93c', '#38c172', '#a66cff', '#ff9f43'];
  function confetti(x, y) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6, sp = 400 + Math.random() * 700;
    particles.push({ type: 'conf', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 2.2, max: 2.2, color: CONF[(Math.random() * CONF.length) | 0],
      size: 10 + Math.random() * 10, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12 });
  }
  function spark(x, y, color, sp0) {
    const a = Math.random() * Math.PI * 2, sp = sp0 * (0.4 + Math.random());
    particles.push({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.5, max: 0.5, color, size: 6 + Math.random() * 6, rot: 0, vr: 0 });
  }
  function flame() {
    const c = car;
    const nose = c.face, a = c.angle;
    const bx = c.x - Math.cos(a) * 52 * CS * nose, by = c.y - Math.sin(a) * 52 * CS * nose;
    const sp = 300 + Math.random() * 200;
    particles.push({ type: 'flame', x: bx, y: by,
      vx: -Math.cos(a) * nose * sp + c.vx * 0.3 + (Math.random() - 0.5) * 80,
      vy: -Math.sin(a) * nose * sp + c.vy * 0.3 + (Math.random() - 0.5) * 80,
      life: 0.35, max: 0.35, color: Math.random() < 0.5 ? '#ffb238' : '#ff6a3d',
      size: 14 + Math.random() * 10, rot: 0, vr: 0 });
  }
  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'conf') { p.vy += 900 * dt; p.vx *= 1 - 1.5 * dt; p.vy *= 1 - 1.2 * dt; }
      else { p.vx *= 1 - 3 * dt; p.vy *= 1 - 3 * dt; }
      p.rot += p.vr * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function showText(el, text, cls) {
    el.textContent = text;
    el.classList.remove('pop', 'pop2');
    void el.offsetWidth;
    el.classList.add(cls);
  }
  function checkToasts(dt) {
    toastCool.wall -= dt; toastCool.ceil -= dt;
    const c = car;
    const onWall = c.grounded && Math.abs(c.nx) > 0.9;
    const onCeil = c.grounded && c.ny < -0.8;
    if (onWall && !wasOn.wall && toastCool.wall <= 0) {
      showText($('toast'), 'かべのぼり！', 'pop2'); sfx.toast(); toastCool.wall = 5;
    }
    if (onCeil && !wasOn.ceil && toastCool.ceil <= 0) {
      showText($('toast'), 'さかさま！', 'pop2'); sfx.toast(); toastCool.ceil = 5;
    }
    wasOn.wall = onWall; wasOn.ceil = onCeil;
  }

  // ===== ループ =====
  function update(dt) {
    const N = 4, h = dt / N;
    for (let i = 0; i < N; i++) {
      updateCar(h);
      updateBall(h);
      carBall();
    }
    if (inp.boost && Math.random() < 0.9) { flame(); flame(); }
    checkToasts(dt);
    if (goalTimer > 0) {
      goalTimer -= dt;
      if (goalTimer <= 0) resetBall();
    }
  }
  function loop(t) {
    const dt = Math.min(0.05, (t - (lastTime || t)) / 1000);
    lastTime = t;
    if (state === 'play') update(dt);
    updateParticles(dt);
    updateEngine();
    render();
    requestAnimationFrame(loop);
  }

  // ===== えがく =====
  function roundRectPath(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function drawCar(c, color, wheelRot, boosting) {
    const col = CAR_COLORS[color];
    // ほのお
    if (boosting) {
      const L = 34 + Math.random() * 26;
      c.fillStyle = '#ff6a3d';
      c.beginPath(); c.moveTo(-50, -12); c.lineTo(-50 - L, -2); c.lineTo(-50, 8); c.fill();
      c.fillStyle = '#ffe066';
      c.beginPath(); c.moveTo(-50, -7); c.lineTo(-50 - L * 0.55, -2); c.lineTo(-50, 3); c.fill();
    }
    // うしろの はね
    c.fillStyle = col.dark;
    roundRectPath(c, -54, -30, 12, 18, 4); c.fill();
    // やね
    c.fillStyle = col.body;
    c.beginPath();
    c.moveTo(-36, -12); c.lineTo(-24, -36); c.quadraticCurveTo(-4, -40, 14, -36); c.lineTo(30, -12); c.closePath(); c.fill();
    // まど
    c.fillStyle = '#bfe6ff';
    c.beginPath();
    c.moveTo(-28, -15); c.lineTo(-20, -31); c.lineTo(10, -31); c.lineTo(22, -15); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,.7)';
    c.beginPath(); c.moveTo(-16, -29); c.lineTo(-10, -29); c.lineTo(-17, -17); c.lineTo(-23, -17); c.closePath(); c.fill();
    // からだ
    c.fillStyle = col.body;
    roundRectPath(c, -52, -16, 104, 28, 12); c.fill();
    c.fillStyle = 'rgba(255,255,255,.85)';
    roundRectPath(c, -40, -6, 70, 6, 3); c.fill();
    // ライト
    c.fillStyle = '#fff6b0';
    c.beginPath(); c.arc(46, -6, 5.5, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#ff8080';
    c.beginPath(); c.arc(-48, -6, 4, 0, Math.PI * 2); c.fill();
    // タイヤ
    for (const wx of [-30, 32]) {
      c.save(); c.translate(wx, 12);
      c.fillStyle = '#2f2a3a'; c.beginPath(); c.arc(0, 0, 14, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#c9cfdd'; c.beginPath(); c.arc(0, 0, 7, 0, Math.PI * 2); c.fill();
      c.rotate(wheelRot);
      c.strokeStyle = '#7b8196'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(-6, 0); c.lineTo(6, 0); c.moveTo(0, -6); c.lineTo(0, 6); c.stroke();
      c.restore();
    }
  }

  function drawBall(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.fillStyle = 'rgba(0,0,0,.08)';
    ctx.beginPath(); ctx.arc(4, 6, BR, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(-BR * 0.35, -BR * 0.4, BR * 0.1, 0, 0, BR);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#dde3ee');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, BR, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.rotate(b.rot);
    ctx.fillStyle = '#3d3355';
    const pent = (px, py, r, a) => {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const t = a + i * Math.PI * 2 / 5;
        ctx.lineTo(px + Math.cos(t) * r, py + Math.sin(t) * r);
      }
      ctx.closePath(); ctx.fill();
    };
    pent(0, 0, BR * 0.28, -Math.PI / 2);
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 5 + Math.PI / 5;
      pent(Math.cos(a) * BR * 0.82, Math.sin(a) * BR * 0.82, BR * 0.24, a + Math.PI);
    }
    ctx.restore();
    ctx.strokeStyle = '#3d3355'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, BR, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function drawGoal(side) {
    const col = GOAL_COLORS[side];
    const x0 = side > 0 ? HW : -HW - GD;
    const y0 = GT, h = GB + BR - GT;
    ctx.save();
    // おく
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x0, y0, GD, h);
    ctx.globalAlpha = 0.28; ctx.fillStyle = col; ctx.fillRect(x0, y0, GD, h);
    ctx.globalAlpha = 1;
    // くちの ところ（かべを けす）
    const mx = side > 0 ? HW - 13 : -HW - 1;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(mx, GT, 14, GB - GT);
    ctx.globalAlpha = 0.28; ctx.fillStyle = col; ctx.fillRect(mx, GT, 14, GB - GT);
    ctx.globalAlpha = 1;
    // あみ
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let x = x0 + 25; x < x0 + GD; x += 25) { ctx.moveTo(x, y0); ctx.lineTo(x, y0 + h); }
    for (let y = y0 + 25; y < y0 + h; y += 25) { ctx.moveTo(x0, y); ctx.lineTo(x0 + GD, y); }
    ctx.stroke();
    // わく
    ctx.strokeStyle = col; ctx.lineWidth = 12; ctx.lineCap = 'round';
    const xb = side > 0 ? HW + GD : -HW - GD;
    ctx.beginPath();
    ctx.moveTo(side * HW, GT); ctx.lineTo(xb, GT); ctx.lineTo(xb, y0 + h); ctx.lineTo(side * HW, y0 + h);
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(side * HW, GT, 12, 0, Math.PI * 2); ctx.fill();
    // くるまよう ガラス（てんてん）
    ctx.strokeStyle = 'rgba(80,110,180,.35)'; ctx.lineWidth = 4; ctx.setLineDash([10, 12]);
    ctx.beginPath(); ctx.moveTo(side * (HW - 6), GT + 12); ctx.lineTo(side * (HW - 6), GB); ctx.stroke();
    ctx.restore();
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const k = view.dpr * view.s;
    ctx.setTransform(k, 0, 0, k, canvas.width / 2, canvas.height / 2);

    // アリーナの なか
    roundRectPath(ctx, -HW, -HH, HW * 2, HH * 2, R);
    const bg = ctx.createLinearGradient(0, -HH, 0, HH);
    bg.addColorStop(0, '#eaf7ff'); bg.addColorStop(1, '#fbfff2');
    ctx.fillStyle = bg; ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = '#9be27a'; ctx.fillRect(-HW, HH - 34, HW * 2, 40);
    ctx.strokeStyle = 'rgba(120,150,210,.3)'; ctx.lineWidth = 6; ctx.setLineDash([24, 20]);
    ctx.beginPath(); ctx.moveTo(0, -HH); ctx.lineTo(0, HH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(0, 0, 130, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    // かべ
    roundRectPath(ctx, -HW, -HH, HW * 2, HH * 2, R);
    ctx.strokeStyle = '#5b6fd6'; ctx.lineWidth = 18; ctx.stroke();

    drawGoal(-1); drawGoal(1);

    if (ball) drawBall(ball);

    // ほのお・つぶつぶ（くるまの うしろ）
    for (const p of particles) {
      if (p.type !== 'flame') continue;
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + p.life / p.max), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (car) {
      ctx.save();
      ctx.translate(car.x, car.y);
      const spin = car.flipSpin > 0 ? (Math.PI * 2 - car.flipSpin) : 0;
      ctx.rotate(car.angle + spin);
      ctx.scale(car.face * CS, CS);
      drawCar(ctx, carColor, car.wheel, inp.boost && state === 'play');
      ctx.restore();
    }

    for (const p of particles) {
      if (p.type === 'flame') continue;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5));
      ctx.fillStyle = p.color;
      if (p.type === 'conf') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.life / p.max), 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function resize() {
    const w = Math.max(1, wrap.clientWidth), h = Math.max(1, wrap.clientHeight);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    view.w = w; view.h = h; view.dpr = dpr;
    view.s = Math.min(w / VW, h / VH);
  }

  // ===== がめん =====
  function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); }
  function hideScreens() { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); }
  function toTitle() {
    state = 'title';
    resetCar(); resetBall(); particles = [];
    inp.left = inp.right = inp.boost = false;
    showScreen('titleScreen');
  }
  function pause() {
    if (state !== 'play') return;
    state = 'paused';
    inp.left = inp.right = inp.boost = false;
    showScreen('pauseScreen');
  }
  function resume() {
    if (state !== 'paused') return;
    state = 'play'; lastTime = 0; hideScreens();
  }

  // くるま えらび
  const pick = $('carPick');
  CAR_COLORS.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'carbtn';
    b.setAttribute('aria-label', 'くるま ' + (i + 1));
    const cv = document.createElement('canvas');
    const dpr = window.devicePixelRatio || 1, W = 140, H = 80;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.maxWidth = W + 'px';
    const c = cv.getContext('2d');
    c.setTransform(dpr * 1.1, 0, 0, dpr * 1.1, W / 2 * dpr, H * 0.62 * dpr);
    drawCar(c, i, 0, false);
    b.appendChild(cv);
    b.addEventListener('click', () => startGame(i));
    pick.appendChild(b);
  });

  // ===== ボタン =====
  function bindHold(el, onPress, onRelease) {
    let active = false;
    const start = (e) => {
      e.preventDefault();
      initAudio();
      if (active) return;
      active = true;
      el.classList.add('on');
      onPress();
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
    };
    const end = () => {
      if (!active) return;
      active = false;
      el.classList.remove('on');
      if (onRelease) onRelease();
    };
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('lostpointercapture', end);
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  bindHold($('btnLeft'), () => inp.left = true, () => inp.left = false);
  bindHold($('btnRight'), () => inp.right = true, () => inp.right = false);
  bindHold($('btnJump'), doJump);
  bindHold($('btnBoost'), () => inp.boost = true, () => inp.boost = false);

  $('pauseBtn').addEventListener('click', pause);
  $('resumeBtn').addEventListener('click', resume);
  $('quitBtn').addEventListener('click', toTitle);
  $('soundBtn').addEventListener('click', () => {
    initAudio();
    soundOn = !soundOn;
    $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  });

  // パソコンで ためす とき用（← → で はしる、スペースで ジャンプ、Z か Shift で ブースト）
  const keyMap = { ArrowLeft: 'left', ArrowRight: 'right', z: 'boost', Z: 'boost', Shift: 'boost' };
  window.addEventListener('keydown', e => {
    if (keyMap[e.key]) { inp[keyMap[e.key]] = true; e.preventDefault(); }
    else if ((e.key === ' ' || e.key === 'ArrowUp') && !e.repeat) { doJump(); e.preventDefault(); }
  });
  window.addEventListener('keyup', e => { if (keyMap[e.key]) inp[keyMap[e.key]] = false; });

  // iPad で かくだい・スクロール しないように
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); lastTime = 0; });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  resize();
  toTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
