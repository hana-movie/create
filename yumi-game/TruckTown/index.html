<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>じわじわ渋滞タウン</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#2b2f36;background:#b9d6a0}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#top{position:fixed;left:12px;right:344px;top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.chip{pointer-events:auto;background:rgba(255,253,246,.95);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(40,60,20,.18);white-space:nowrap}
.chip small{font-weight:500;color:#6b7280;margin-right:4px}
.chip button{border:0;background:transparent;font:inherit;font-weight:700;padding:2px 8px;border-radius:999px;cursor:pointer;color:#6b7280}
.chip button.on{background:#2f6f4f;color:#fff}
.chip.dd{position:relative;padding:4px 6px}
.chip.dd .ddb{padding:3px 10px;color:#2b2f36;font-variant-numeric:tabular-nums}
.ddm{display:none;position:absolute;top:calc(100% + 6px);left:0;background:#fffdf6;border-radius:12px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.25);flex-direction:column;gap:2px;min-width:120px;z-index:8}
.dd.open .ddm{display:flex}
.ddm button{text-align:left;padding:7px 12px;border-radius:8px;color:#2b2f36}
.ddm button:hover{background:#eef4e2}
#otChip.red{background:#fde8e6;color:#c0392b}
#panel{position:fixed;right:12px;top:12px;width:320px;max-height:calc(100% - 24px);overflow:auto;background:rgba(255,253,246,.96);border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(40,60,20,.22);font-size:13px}
#panel h2{font-size:12px;letter-spacing:.08em;color:#6b7280;margin:12px 0 6px;font-weight:700}
#panel h2:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #ece7d6;height:50px;font-variant-numeric:tabular-nums}
.row.rt{height:64px;padding:4px 0;box-sizing:border-box;display:grid;grid-template-columns:12px minmax(0,1fr) 26px 84px;grid-template-rows:20px 18px 16px;column-gap:6px;row-gap:0;align-items:center}
.row.rt .dot{grid-column:1;grid-row:1}
.row.rt .nm{display:contents}
.row.rt .nm b{grid-column:2/5;grid-row:1}
.row.rt .nm .l2{grid-column:2;grid-row:2}
.row.rt .nm .l3{grid-column:2;grid-row:3}
.row.rt .sell{grid-column:3;grid-row:2/4;height:32px}
.row.rt .buy{grid-column:4;grid-row:2/4;height:32px;padding:0 2px;width:84px;font-size:11.5px}
.row.rt .nm .l3 span,.row.rt .nm .l2 span{display:inline}
.row.rt .nm .l2,.row.rt .nm .l3{display:block;height:auto}
.row.rt .l3 .pf{font-weight:700;color:#2f6f4f}
.row.rt .l3 .pf.neg{color:#c0392b}
.row.rt .l3 .wn,.row.rt .l2 .wt{color:#c0392b;font-weight:700}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0}
.row .nm b,.row .nm span,.row .nm .l2,.row .nm .l3{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm b{font-size:13px}
.row .nm span{color:#6b7280;font-size:11px}
.row .nm .l2{display:flex;gap:6px;font-size:11px;color:#6b7280;line-height:16px}
.row .nm .l2 .st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .nm .l2 .pf{font-weight:700;color:#2f6f4f}
.row .nm .l2 .pf.neg{color:#c0392b}
.row .nm .l3{font-size:11px;color:#c0392b;height:15px;line-height:15px}
.row button.buy{width:96px;flex:none}
.row button.sell{width:28px;flex:none;padding:7px 0}
.dot{width:12px;height:12px;border-radius:3px;flex:none}
button.buy{border:0;border-radius:10px;background:#2f6f4f;color:#fff;font:inherit;font-weight:700;font-size:12px;padding:7px 10px;cursor:pointer;white-space:nowrap}
button.buy:disabled{background:#c9cfc4;color:#fff;cursor:default}
.locked{opacity:.45}
#flow{font-size:11.5px;color:#6b7280;margin-top:8px;line-height:1.6;height:56px;overflow:hidden;font-variant-numeric:tabular-nums}
#flow b{color:#2b2f36}
#flow .red{color:#c0392b;font-weight:700}
#top .chip.red{background:#fde8e6;color:#c0392b}
#netChip.red{background:#fde8e6;color:#c0392b}
button.sell{border:0;border-radius:10px;background:#e9e4d4;color:#6b5a3a;font:inherit;font-weight:700;font-size:12px;padding:7px 8px;cursor:pointer;white-space:nowrap}
button.sell:disabled{opacity:.4;cursor:default}
#evs{display:flex;flex-direction:column;gap:6px}
#evs .ev{display:flex;align-items:center;gap:8px;background:#f3eee0;border-radius:10px;padding:6px 10px;font-size:12px;box-shadow:0 2px 10px rgba(40,60,20,.2);font-variant-numeric:tabular-nums}
#evs .ev.bad{background:#fde8e6}
#evs .ev.good{background:#e6f3e0}
#evs .ev span{flex:1}
#evs button,#con button{border:0;border-radius:8px;background:#2f6f4f;color:#fff;font:inherit;font-size:11.5px;font-weight:700;padding:5px 8px;cursor:pointer;white-space:nowrap}
#evs button:disabled{background:#c9cfc4}
#con button.no{background:#b8ad95}
#goalWrap{height:128px;display:flex;flex-direction:column;gap:6px}
#goalWrap #move{padding:9px;flex:none}
#goal{background:#eef4e2;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5;flex:1;overflow:hidden;font-variant-numeric:tabular-nums}
#bar{height:6px;border-radius:3px;background:#d5dfc5;margin-top:5px;overflow:hidden}
#bar i{display:block;height:100%;background:#2f6f4f;width:0}
#hint{color:#6b7280;font-size:11.5px;line-height:1.6;margin-top:10px}
#menu{position:fixed;display:none;background:#fffdf6;border-radius:14px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.28);width:230px;font-size:13px;z-index:5}
#menu h3{margin:4px 6px 6px;font-size:12px;color:#6b7280}
#menu button{display:block;width:100%;text-align:left;border:0;background:transparent;font:inherit;padding:8px 10px;border-radius:9px;cursor:pointer}
#menu button:hover:not(:disabled){background:#eef4e2}
#menu button.cur{background:#2f6f4f;color:#fff}
#menu button:disabled{color:#b6b9b0;cursor:default}
#menu button small{display:block;font-size:11px;opacity:.75}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2b2f36;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:6}
#side{position:fixed;left:12px;bottom:12px;width:300px;display:flex;flex-direction:column;gap:6px;z-index:3;pointer-events:none}
#side>*{pointer-events:auto}
#con{background:#fff3d6;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5;box-shadow:0 2px 10px rgba(40,60,20,.2);font-variant-numeric:tabular-nums}
#con i{display:block;height:6px;border-radius:3px;background:#ecd9a0;margin-top:5px;overflow:hidden}
#con i b{display:block;height:100%;background:#d98a1f}
.ach{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #ece7d6;font-size:12.5px;white-space:nowrap;height:30px;align-items:center}
.ach:last-child{border-bottom:0}
.ach span{margin-left:auto;color:#2f6f4f;font-weight:700;white-space:nowrap}
#tut{position:fixed;left:12px;top:118px;max-width:330px;background:#2b2f36;color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.6;box-shadow:0 4px 18px rgba(0,0,0,.3);display:none;z-index:4}
#tut b{color:#ffd66b}
#tut div{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11.5px;color:#aab}
#tut button{border:0;background:#4a505a;color:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(30,35,30,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.on{display:flex}
#modal .box{background:#fffdf6;border-radius:18px;padding:18px 20px;width:min(420px,100%);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35);font-size:13.5px;line-height:1.6;font-variant-numeric:tabular-nums}
#modal h3{margin:0 0 8px;font-size:17px}
#modal .big{font-size:30px;font-weight:800;letter-spacing:.02em}
#modal .stars{font-size:24px;color:#e0a100;letter-spacing:2px}
#modal table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
#modal td,#modal th{padding:5px 4px;border-bottom:1px solid #ece7d6;text-align:left;white-space:nowrap}
#modal th{color:#6b7280;font-weight:600}
#modal textarea{width:100%;height:84px;font:inherit;font-size:12px;border:1px solid #ddd6c2;border-radius:10px;padding:8px;resize:none;margin-top:8px}
#modal .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#modal .btns button{border:0;border-radius:10px;font:inherit;font-weight:700;padding:9px 14px;cursor:pointer;background:#2f6f4f;color:#fff}
#modal .btns button.sub{background:#e9e4d4;color:#4b4535}
#modal .chk{color:#6b7280}#modal .chk b{color:#2b2f36}
#reset{border:0;background:transparent;color:#9a5a4a;font:inherit;font-size:11.5px;cursor:pointer;padding:6px 0;text-decoration:underline}
@media(max-width:720px){
 #top{left:8px;right:8px;top:8px;gap:6px}
 #tut{left:8px;right:8px;top:150px;max-width:none}
 #side{left:8px;right:8px;width:auto;bottom:calc(40% + 16px)}
 #toast{top:8px;bottom:auto;z-index:7;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:40%}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <div class="chip"><small>所持金</small>¥<span id="money">0</span></div>
  <div class="chip" id="netChip"><small>収支</small><span id="rate">0</span>/分</div>
  <div class="chip" id="otChip" title="直近3分で満額（遅れなし）で届いた割合"><small>定時率</small><span id="ot">—</span></div>
  <div class="chip"><small>配達</small><span id="deliv">0</span></div>
  <div class="chip"><small>町</small>Lv<span id="lv">1</span> <span id="fame"></span></div>
  <div class="chip dd" id="spdDD"><button class="ddb" id="spdBtn" title="速度（スペースキーで一時停止）">▶ 1×</button>
    <div class="ddm" id="speed"><button data-s="0">⏸ 一時停止</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button><button data-s="8">8×</button><button data-s="16">16×</button></div></div>
  <div class="chip dd" id="viewDD"><button class="ddb" id="viewBtn" title="表示と音">☰</button>
    <div class="ddm" id="view"><button data-v="in">＋ 拡大</button><button data-v="out">－ 縮小</button><button data-v="fit">全体を表示</button><button data-v="jam" class="on">渋滞を表示</button><button data-v="snd" id="snd">🔊 音あり</button><button data-v="rec">🏆 記録</button><button data-v="seed">🔢 町の番号</button></div></div>
</div>
<div id="panel">
  <div id="goalWrap"><div id="goal"></div><button id="move" class="buy" style="display:none"></button></div>
  <div id="flow"></div>
  <h2>目標 <span id="achN" style="font-weight:500"></span></h2>
  <div id="ach"></div>
  <h2>路線とトラック</h2>
  <div id="routes"></div>
  <h2>強化</h2>
  <div id="ups"></div>
  <div id="hint">交差点をクリックすると交通ルールを、道路をクリックすると車線の追加や一方通行化が、施設をクリックすると構内待機場の設置ができます。白い点線は買い足せる道です。走っているのは全部あなたのトラックなので、増やすほど渋滞します。150秒まったく動けない車はレッカーされ、積荷を失います。<br>赤く光る車線は渋滞中です（「渋滞」ボタンで切替）。<br>ドラッグか矢印キーで移動、ホイール/ピンチ/＋－ボタンで拡大縮小。</div>
  <button id="reset">最初からやり直す</button>
</div>
<div id="side"><div id="con" style="display:none"></div><div id="evs"></div></div>
<div id="tut"></div>
<div id="modal"><div class="box"></div></div>
<div id="menu"></div>
<div id="toast"></div>
<script>
'use strict';
const HEADLESS = typeof document === 'undefined';
/* ================= util ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TAU=Math.PI*2;
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};

/* ================= constants ================= */
const LANE_OFF=3.4, LANE2=[6.9,2.4], OW_OFF=[2.3,-2.3], TRIM=21, RING_R=11.5, TRUCK_LEN=8.5, DT=1/30;
const V_LINK=13, V_STRAIGHT=12, V_CONN=6.5, V_RING=6, V_STUB=8;
const IDM_A=1.8, IDM_B=2.8, IDM_T=0.9, IDM_S0=1.6;
const SHORT_BLOCK=80, OW_COST=100;
// route choice: [weight on trucks per metre, weight on stopped traffic]; level 0 = drivers mostly take the shortest way
const NAV=[[1.5,0],[4,3]], NAV_LIVE=1;
const SIG_MODE=0, NR_COST=150;
const METER_TH=0.7, METER_MAX=60, METER_RETRY=1.5;
const NONE_MODE=1, STOP_T=1;
const CTRL_COST={none:0,prio:60,signal:150,round:600,round2:1200};
const RB_GAP=11, RB_FOLLOW=0;
const DRV=1, SPREAD=1, HOT_ON=false; // driveway rules on; facilities kept off neighbouring junctions
const SG_MIN=7, SG_GAP=55, SG_LO=16, SG_HI=16;
// roundabouts get dearer with every one you own, so they go where they matter most
const RB_GROW=1.3;
const nRound=ex=>W.nodes.filter(n=>n!==ex&&n.type==='junction'&&isRound(n)).length;
const ctrlCost=(n,kind)=>{
  if(n.ctrl.kind===kind)return 0;
  if(kind!=='round'&&kind!=='round2')return CTRL_COST[kind];
  const base=kind==='round2'&&n.ctrl.kind==='round'?CTRL_COST.round2-CTRL_COST.round:CTRL_COST[kind]; // upgrading only pays the difference
  return Math.round(base*Math.pow(RB_GROW,nRound(n))/10)*10;
};
const isRound=n=>n.ctrl.kind==='round'||n.ctrl.kind==='round2';
const RING_O=RING_R+4.7;
const UNLOCK=[0,25,100,300,700,900];
const BDEF=[
 {key:'farm',name:'畑',icon:'🌾',col:'#e2b93b',cs:[0],rs:[0,1,2,3,4]},
 {key:'mill',name:'製粉所',icon:'🥖',col:'#c98a3a',cs:[3,4],rs:[1,2,3],fac:1},
 {key:'market',name:'市場',icon:'🏪',col:'#d9534f',cs:[6],rs:[1,2,3]},
 {key:'forest',name:'森',icon:'🌲',col:'#3f8f5a',cs:[2,3,4],rs:[0,4]},
 {key:'saw',name:'製材所',icon:'🪵',col:'#8a6a4a',cs:[1,2],rs:[1,2,3],fac:1},
 {key:'quarry',name:'採石場',icon:'⛰️',col:'#7d8794',cs:[5,6],rs:[0,4]},
 {key:'mason',name:'石工所',icon:'🧱',col:'#a05a48',cs:[0,1],rs:[1,2,3],fac:1},
 {key:'port',name:'港',icon:'⚓',col:'#3b6ea5',cs:[0,1,2],rs:[4]},
 {key:'ranch',name:'牧場',icon:'🐄',col:'#9bbf5a',cs:[5,6],rs:[0,1,2,3,4]},
 {key:'dairy',name:'乳業',icon:'🧀',col:'#e0a84a',cs:[3,4,5],rs:[1,2,3],fac:1},
 {key:'mine',name:'鉱山',icon:'⛏️',col:'#5d6470',cs:[4,5,6],rs:[0]},
 {key:'steel',name:'製鉄所',icon:'🏭',col:'#6b5b7b',cs:[2,3,4],rs:[1,2,3],fac:1},
 {key:'bakery',name:'パン工場',icon:'🍞',col:'#d88f4a',cs:[2,3,4],rs:[1,2,3],fac:1,mix:['mill','dairy'],minLv:1}
];
const MAT_NAME={mill:'小麦粉',dairy:'チーズ'};
const RDEF=[['farm','mill',0,0,'#e8c547'],['mill','market',0,1,'#e07b39'],['forest','saw',1,0,'#4caf7a'],['saw','market',1,1,'#2f7d6b'],['quarry','mason',2,0,'#8d99ae'],['mason','market',2,1,'#b0584a'],['ranch','dairy',3,0,'#a9cf6a'],['dairy','port',3,1,'#f0b955'],['mine','steel',4,0,'#6f7684'],['steel','port',4,1,'#8a6fa8'],['mill','bakery',5,0,'#f2c98a'],['dairy','bakery',5,0,'#f7e08a'],['bakery','market',5,1,'#c9783a']];
const CHAIN_MULT=[1,1.6,2.4,3.6,5.5,6];
const CHAIN_COST=[1,2,4,8,16,12];

/* ================= lanes ================= */
let laneSeq=0;
function mkLane(kind,pts,vmax,node){
  const cum=[0];
  for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  return {id:laneSeq++,kind,pts,cum,len:cum[cum.length-1],vmax,node,vehicles:[],tails:[],spawnQ:[],ghosts:[],wanters:[],stop:null,dirty:false};
}
function lanePt(L,s){
  const c=L.cum,p=L.pts;if(s<0)s=0;if(s>L.len)s=L.len;
  let i=1;while(i<c.length-1&&c[i]<s)i++;
  const t=(s-c[i-1])/((c[i]-c[i-1])||1);
  return [p[i-1][0]+(p[i][0]-p[i-1][0])*t,p[i-1][1]+(p[i][1]-p[i-1][1])*t];
}
function bez(p0,d0,p3,d3,n){
  n=n||14;const k=Math.hypot(p3[0]-p0[0],p3[1]-p0[1])*0.38;
  const p1=[p0[0]+d0[0]*k,p0[1]+d0[1]*k],p2=[p3[0]-d3[0]*k,p3[1]-d3[1]*k],out=[];
  for(let i=0;i<=n;i++){const t=i/n,u=1-t;out.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]);}
  return out;
}

/* ================= world generation ================= */
let W=null,G=null,trucks=[],tid=0;
// in-game randomness (orders, events) comes from the town's number, so the same number plays out the same for everyone
function grand(){let t=(G.rs=(G.rs+0x6D2B79F5)>>>0);t=Math.imul(t^t>>>15,1|t);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
// the next town of a run also follows from the current one, so a whole run can be replayed from its first number
const nextSeed=(seed,lv)=>(mulberry32((seed^Math.imul(lv+1,0x9E3779B1))>>>0)()*1e9)|0;
let notify=()=>{},fx=()=>{},onClear=()=>{}; // set by the UI (messages, sounds); the simulation core must not touch the page directly
function genWorld(seed,lv){
  const rnd=mulberry32(seed);laneSeq=0;lv=lv|0;
  const COLS=7+Math.min(lv,3),ROWS=5+Math.min(lv>>1,2),SP=125,nodes=[]; // later towns are bigger
  const nid=(c,r)=>r*COLS+c;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
    nodes.push({id:nid(c,r),x:c*SP+(rnd()-.5)*44,y:r*SP+(rnd()-.5)*44,type:'junction',ctrl:{kind:'none',axis:0},nb:[]});
  let edges=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(c<COLS-1)edges.push([nid(c,r),nid(c+1,r)]);
    if(r<ROWS-1)edges.push([nid(c,r),nid(c,r+1)]);
  }
  const deg=id=>edges.filter(e=>e[0]===id||e[1]===id).length;
  const connected=es=>{const seen=new Set([0]),st=[0];while(st.length){const a=st.pop();for(const e of es){const b=e[0]===a?e[1]:e[1]===a?e[0]:-1;if(b>=0&&!seen.has(b)){seen.add(b);st.push(b);}}}return seen.size===nodes.length;};
  const order=edges.slice();
  for(let i=order.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  let rem=Math.floor(edges.length*0.22);const cand=[];

    for(const Li of n.nb[i].ins)for(const Lo of n.nb[j].outs){
      const d0=Li.dir,d3=Lo.dir,c=mkLane('conn',bez(Li.pts[1],d0,Lo.pts[0],d3),V_CONN,n);
      c.i=i;c.j=j;c.inL=Li;c.out=Lo;c.conf=new Set();
      c.crossing=(d0[0]*d3[1]-d0[1]*d3[0])>0.35; // right turn crosses oncoming traffic
      if(Math.abs(d0[0]*d3[1]-d0[1]*d3[0])<0.3&&d0[0]*d3[0]+d0[1]*d3[1]>0)c.vmax=V_STRAIGHT; // going straight on: no need to slow down like a turning truck
      conns.push(c);n.internal.push(c);n.path[Li.id+'_'+Lo.id]=[c];
    }
  }
  for(let a=0;a<conns.length;a++)for(let b=a+1;b<conns.length;b++){
    const c1=conns[a],c2=conns[b];if(c1.inL===c2.inL)continue;
    let hit=c1.out===c2.out;
    if(!hit){outer:for(const p of c1.pts)for(const q of c2.pts)if(Math.hypot(p[0]-q[0],p[1]-q[1])<4.1){hit=true;break outer;}}

}
const gateOK=(n,j,v)=>n.gate[j].some(h=>h.v===v);
function rebuildNodes(list,mut){
  for(const ev of G.ev||[])if(ev.type==='crash'&&W.links.indexOf(ev.L)<0)ev.tEnd=G.time;
  for(const n of list)for(const L of n.internal)for(const v of L.vehicles.slice()){
    let tgt=null;for(let k=v.pi+1;k<v.plan.length;k++)if(v.plan[k].kind==='link'){tgt=v.plan[k];break;}
    detach(v);if(tgt){tgt.spawnQ.push(v);v.q=tgt;}else enterBuilding(v,v.route.src);
  }
  if(mut)mut();
  for(const n of list)buildNode(n);

}
function setCtrl(n,kind,axis){rebuildNodes([n],()=>{n.ctrl={kind,axis:axis||0};});}

/* ================= routing ================= */
// is the turn p→n→b forbidden? (right turns at a junction with a no-right-turn sign)
function turnBanned(p,n,b,hyp){
  if(!p||n.type!=='junction')return false;
  const nr=hyp&&hyp.n===n?hyp.nr:n.noRight;if(!nr||isRound(n))return false;
  const d0x=n.x-p.x,d0y=n.y-p.y,d3x=b.x-n.x,d3y=b.y-n.y;
  return (d0x*d3y-d0y*d3x)/(Math.hypot(d0x,d0y)*Math.hypot(d3x,d3y))>0.35;
}
// shortest path over (road, direction) states so that turn bans, one-ways and "no U-turn" are respected.
// prev: the node we are coming from when starting mid-route. hyp: a hypothetical change to test ({e,d} one-way or {n,nr} turn ban).
function findPath(a,b,cong,hyp,prev){
  if(a===b)return [a];
  const D=new Map(),P=new Map(),S=new Map(),done=new Set(),k0=(prev?prev.id:'s')+'>'+a.id;
  D.set(k0,0);S.set(k0,[prev||null,a]);
  let end=null;
  for(;;){
    let u=null,bd=Infinity;for(const [k,d] of D)if(!done.has(k)&&d<bd){bd=d;u=k;}
    if(u===null)break;done.add(u);
    const st=S.get(u),from=st[0],nu=st[1];
    if(nu===b){end=u;break;}
    for(const e of nu.nb){
      const to=e.to;
      if(to.type==='lot'&&to!==b)continue;
      if(from&&to===from)continue; // no U-turns
      const ed=W.edgeOf[nu.id+'>'+to.id],ow=hyp&&hyp.e===ed?hyp.d:ed.ow;
      if(ow&&((ow===1)!==(ed[0]===nu)))continue; // one-way, wrong direction
      if(turnBanned(from,nu,to,hyp))continue;
      const LL=e.outs,len=LL.length?LL[0].len:Math.hypot(to.x-nu.x,to.y-nu.y);let w=len+22;
      if(cong){if(ed.works)w+=len*2.2;for(const x of LL)if(x.block)w+=(navActive()?400:120)/LL.length;}
      if(cong&&LL.length){let c=0,jm=0;for(const x of LL){c+=x.vehicles.length;jm+=x.jam;}const nv=NAV[navActive()?1:0];w+=len*nv[0]*Math.min(1,c*11/(len*LL.length))+len*nv[1]*jm/LL.length;}
      const k=nu.id+'>'+to.id,nd=bd+w;
      if(!D.has(k)||nd<D.get(k)){D.set(k,nd);P.set(k,u);S.set(k,[nu,to]);}
    }
  }
  if(end===null)return null;
  const p=[];for(let k=end;k!==undefined;k=P.get(k))p.unshift(S.get(k)[1]);
  return p;
}
function canNoRight(n){
  const h={n,nr:true};
  for(const r of W.routes)if(!findPath(r.src.node,r.dst.node,false,h)||!findPath(r.dst.node,r.src.node,false,h))return false;
  return true;
}
// geometric turn at the end of link j of a node path: -1 left, 1 right, 0 straight/none
function turnGeo(ns,j){
  if(j<0||j+2>=ns.length)return 0;
  const a=ns[j],n=ns[j+1],b=ns[j+2],d0x=n.x-a.x,d0y=n.y-a.y,d3x=b.x-n.x,d3y=b.y-n.y,cr=(d0x*d3y-d0y*d3x)/(Math.hypot(d0x,d0y)*Math.hypot(d3x,d3y));
  return cr>0.35?1:cr<-0.35?-1:0;
}
// lane required at the end of link j (only sign/signal junctions sort traffic by lane)
function turnAt(ns,j){
  if(j+2>=ns.length)return 0;const n=ns[j+1];if(n.type!=='junction'||n.ctrl.kind==='round')return 0;
  if(n.ctrl.kind==='round2'){ // kerb lane feeds the outer ring (next exit only), centre lane the inner ring
    const k=n.nb.length;let i=-1,x=-1;for(let q=0;q<k;q++){if(n.nb[q].to===ns[j])i=q;if(n.nb[q].to===ns[j+2])x=q;}
    return x===(i+1)%k?-1:1;
  }
  return turnGeo(ns,j);
}
const linksOf=(ns,j)=>W.link[ns[j].id+'>'+ns[j+1].id];
// natural lane when entering each road: left turn lands on the kerb lane, right turn on the centre lane, straight keeps its lane
function naturalFrom(v,j0){
  const ns=v.nodes;
  for(let j=Math.max(1,j0+1);j<ns.length-1;j++){
    const LL=linksOf(ns,j),k=LL.length,t=turnGeo(ns,j-1);
    let c=k<2?0:t<0?0:t>0?k-1:Math.min(v.lc[j-1],k-1);
    if(k>1&&LL[0].len<SHORT_BLOCK){const nd=turnAt(ns,j);if(nd)c=nd<0?0:k-1;} // short block: no room to change lanes, so pick the turn lane straight away
    v.lc[j]=c;
  }
}
function defLc(v){v.lc=[0];naturalFrom(v,0);}
function linkIdx(v,L){const ns=v.nodes;for(let j=0;j<ns.length-1;j++)if(ns[j]===L.from&&ns[j+1]===L.to)return j;return -1;}
function setNeed(v){
  const L=v.lane,k=W.link[L.from.id+'>'+L.to.id].length,j=linkIdx(v,L),t=j<0?0:turnAt(v.nodes,j);
  v.need=k<2?-1:t<0?0:t>0?k-1:-1;
}
function planFor(v){
  const ns=v.nodes,out=[];let prev=null;
  for(let j=0;j<ns.length-1;j++){
    const LL=linksOf(ns,j),L=LL[Math.min(v.lc[j],LL.length-1)];
    if(prev){const p=ns[j].path[prev.id+'_'+L.id];for(const x of p)out.push(x);}
    out.push(L);prev=L;
  }
  return out;
}
function sendHome(v){detach(v);v.q=null;v.cargo=0;enterBuilding(v,v.route.src);}
// the road ahead was closed (one-way change): find a new way from where the truck is, or send it back to its depot
// navigation: on entering a road, look for a faster way from the next junction given current traffic
function navReroute(v){
  const L=v.lane,ns=v.nodes,j=linkIdx(v,L);if(j<0||j+2>=ns.length)return;
  const dest=ns[ns.length-1],tail=findPath(L.to,dest,true,null,L.from);if(!tail)return;
  const old=ns.slice(j+1);if(old.length===tail.length&&old.every((n,i)=>n===tail[i]))return;
  v.nodes=[L.from].concat(tail);replan(v);G.navCount++;
}
function reroute(v){
  const c=v.lane||v.q,ns=v.nodes;let Lc=c;
  if(c&&c.kind!=='link'){Lc=null;for(let k=v.pi+1;k<v.plan.length;k++)if(v.plan[k].kind==='link'){Lc=v.plan[k];break;}}
  if(!Lc||W.links.indexOf(Lc)<0){sendHome(v);return false;}
  const jc=linkIdx(v,Lc),dest=ns[ns.length-1],tail=jc<0?null:findPath(Lc.to,dest,true,null,Lc.from);
  if(!tail){sendHome(v);return false;}
  v.nodes=ns.slice(c.kind==='link'?jc:Math.max(0,jc-1),jc+1).concat(tail);
  for(let j=0;j<v.nodes.length-1;j++)if(!linksOf(v.nodes,j).length){sendHome(v);return false;}
  return true;
}
function replan(v){
  for(let j=0;j<v.nodes.length-1;j++)if(!linksOf(v.nodes,j).length){if(!reroute(v))return;break;}
  defLc(v);
  let jm=-1;const fix=L=>{if(!L)return;const j=linkIdx(v,L);if(j>=0){v.lc[j]=L.li;if(j>jm)jm=j;}};
  const c=v.lane||v.q;
  if(c){if(c.kind==='link')fix(c);fix(c.inL);fix(c.out);}
  if(jm>=0)naturalFrom(v,jm);
  v.plan=planFor(v);
  if(v.lane){v.pi=v.plan.indexOf(v.lane);if(v.pi<0){detach(v);enterBuilding(v,v.route.src);}else if(v.lane.kind==='link')setNeed(v);}
}

/* ================= lane changing ================= */
function leadGap(v,L){
  let g=999;
  for(const u of L.vehicles)if(u!==v&&u.s>v.s){const x=u.s-u.len-v.s;if(x<g)g=x;}
  for(const t of L.tails){const x=tailPos(t,L)-v.s;if(x<g)g=x;}
  if(L.block&&L.block.s>v.s){const x=L.block.s-L.block.len-v.s;if(x<g)g=Math.max(0,x);}
  return g;
}
function canMerge(v,T){
  let behind=false;
  if(T.block&&T.block.s>v.s-v.len-2&&T.block.s-T.block.len<v.s+12)return false;
  for(const u of T.vehicles){
    if(u.s>=v.s){if(u.s-u.len-v.s<1+Math.max(0,v.v-u.v)*1.2)return false;}
    else{
      behind=true;const g=v.s-v.len-u.s;
      if(g<1.2+Math.max(0,u.v-v.v)*1.5+u.v*0.25)return false;
      if(u.v<0.5&&u.tIn<v.tIn&&g<12)return false; // no queue jumping: a waiting truck that was on this road first keeps its place
    }
  }
  for(const t of T.tails)if(tailPos(t,T)-v.s<1.5+v.v*0.5)return false;
  for(const g of T.ghosts)if(Math.abs(g.v.s-v.s)<v.len+2)return false;
  if(!behind){ // we would become the last truck of the lane: leave room for traffic already committed to it from the junction behind
    const n=T.from;let cnt=T.spawnQ.length;
    for(const a of n.active)if(a.out===T&&a.v.lane!==T)cnt++;
    for(const x of n.internal)if(x.kind==='exit'&&x.out===T)cnt+=x.vehicles.length;
    if(v.s-v.len<cnt*(v.len+2)+3)return false;
  }
  return true;
}
function doChange(v,L,T){
  L.vehicles.splice(L.vehicles.indexOf(v),1);L.ghosts.push({v,t:G.time+0.9});
  T.vehicles.push(v);T.vehicles.sort((a,b)=>b.s-a.s);

  v.lane=T;const j=linkIdx(v,T);v.lc[j]=T.li;naturalFrom(v,j);
  v.plan=planFor(v);v.pi=v.plan.indexOf(T);
  v.lat=L.off-T.off;v.wantT=null;v.lcCool=3;v.wait=0;G.lcCount++;
}
function laneChanges(dt){
  for(const LL of W.wide){
    for(const L of LL)L.wanters.length=0;
    for(const L of LL)for(const v of L.vehicles)if(v.wantT===LL[1-L.li])v.wantT.wanters.push(v);else v.wantT=null;
    for(const L of LL){
      if(L.ghosts.length)L.ghosts=L.ghosts.filter(g=>g.t>G.time&&g.v.lane&&g.v.lane.kind==='link');
      for(const v of L.vehicles.slice()){
        if(v.lane!==L)continue;
        if(v.lcCool>0){v.lcCool-=dt;continue;}
        v.lcT+=dt;if(v.lcT<0.3)continue;v.lcT=0;
        if(v.grant){v.wantT=null;continue;}
        if(v.tailLanes.length||v.s<v.len+4)continue;
        const T=LL[1-L.li],D=L.len-v.s;let want=false;
        if(v.need>=0)want=v.need!==L.li&&D>6;                 // mandatory: get into the turn lane
        else if(D>18){const g0=leadGap(v,L);want=g0<22&&leadGap(v,T)>g0+12;} // discretionary: the other lane is clearly emptier
        if(want&&canMerge(v,T))doChange(v,L,T);
        else v.wantT=want&&v.need>=0?T:null; // blinker on: traffic behind in the target lane lets it in
      }
    }
  }
}

/* ================= trucks & buildings ================= */
function mkTruck(route){return {id:tid++,route,len:TRUCK_LEN,s:0,v:0,nv:0,adv:0,lane:null,pi:0,plan:[],nodes:null,lc:[],q:null,need:-1,held:0,dest:null,wantT:null,tIn:0,lcT:0,lcCool:0,lat:0,tailLanes:[],grant:null,cargo:0,stuck:0,wait:0,task:'load',t:0,brake:false};}
function addTruck(r){const t=mkTruck(r);trucks.push(t);r.trucks++;enterBuilding(t,r.src);return t;}
function enterBuilding(v,b){if(v.cargo&&v.tLoad&&b===v.route.dst)v.trip=G.time-v.tLoad;else v.trip=0;v.lane=null;v.q=null;v.held=0;v.nodes=null;v.grant=null;v.task=(v.cargo&&b===v.route.dst)?'unload':'load';v.t=3;b.inside.push(v);}
// leave the building for v.dest. With dispatch control on, wait while a road on the way is jammed solid.
function tryDepart(v,from){
  const to=v.dest;

  v.nodes=findPath(from.node,to.node,true);
  if(!v.nodes){enterBuilding(v,to);return true;}
  defLc(v);v.plan=planFor(v);
  if(from.yard&&v.held<YARD_MAX&&!yardClear(from,v)){v.held+=METER_RETRY;v.nodes=null;return false;}
  if(G.up.meter&&G.meterOn&&v.held<METER_MAX){
    for(let i=1;i<v.plan.length;i++){const L=v.plan[i];if(L.kind==='link'&&L.jam>=METER_TH){v.held+=METER_RETRY;v.nodes=null;return false;}}
  }
  v.pi=0;v.stuck=0;v.held=0;v.q=v.plan[0];v.q.spawnQ.push(v);v.tLoad=v.cargo?G.time:0;return true;
}
// late deliveries pay less: full pay up to the time an uncongested trip takes (about 0.17 s per metre), then in proportion, never below 30%
const onTime=(r,trip)=>!trip?1:Math.max(0.3,Math.min(1,(r.dist*0.17+5)/trip));
function earn(a){G.money+=a;G.inc.push([G.time,a]);}
const payOf=r=>r.pay*(1+0.5*G.up.cap)*(1+0.25*G.fame)*(r.boost||1);
const moveAt=lv=>Math.round(1500*Math.pow(1.5,lv)/100)*100;
const incOver=sec=>{let s=0;for(const e of G.inc)if(e[0]>=G.time-sec)s+=e[1];return s*60/Math.min(sec,Math.max(5,G.time));};
const incRate=()=>incOver(60);
// moving on needs a well-run town: the average profit over the last 3 minutes must reach this
const moveProfit=()=>Math.round(1000*(1+0.25*G.fame)*(1+0.05*G.lv)/10)*10;
const avgProfit=()=>incOver(180)-G.upk;
const ONTIME_NEED=0.88, BREAD_NEED=1;
const onTimeRate=()=>{let a=0,c=0;for(const e of G.pfl)if(e[0]>=G.time-180){a+=e[1];c++;}return c?a/c:1;};
const hasBread=()=>W.bld.some(b=>b.mix);
const breadNeed=()=>BREAD_NEED+0.5*Math.max(0,G.lv-1);
const breadRate=()=>{let c=0;for(const t of G.made)if(t>=G.time-180)c++;return c/3;};
const canMoveNow=()=>G.delivered>=moveAt(G.lv)&&G.time>=180&&avgProfit()>=moveProfit()&&onTimeRate()>=ONTIME_NEED&&(!hasBread()||breadRate()>=breadNeed());
const routeProfit=r=>{let s=0;for(const e of r.earn)if(e[0]>=G.time-120)s+=e[1];return s*60/Math.min(120,Math.max(10,G.time))-r.trucks*truckUpk(r)*(G.fuel||1);};
const srcEmpty=b=>b.mix?b.mix.some(k=>b.mat[k]<1):b.stock<1;
const waitingFor=r=>r.src.fac?r.src.inside.filter(v=>v.route===r&&v.task!=='unload'&&v.task!=='go').length*(srcEmpty(r.src)?1:0):0;
/* ---------- running costs: every truck, the traffic information service and each signal cost money every minute ---------- */
const UPK_T=0.3, UPK_NAV=0.12, UPK_SIG=4;
// a truck's upkeep is a share of what it would earn on an empty road (its route's pay over a free-flow round trip)
const truckUpk=r=>UPK_T*r.pay*(1+0.25*G.fame)*60/(2*r.dist/5+10); // free-flow round trip measured at about 5 m/s incl. junction stops and loading
function upkeep(){
  let t=0;for(const r of W.routes)t+=r.trucks*truckUpk(r);t*=G.fuel||1;
  const nav=G.up.nav&&G.navOn?t*UPK_NAV:0,sig=nJ('signal')*UPK_SIG*(1+0.25*G.fame);
  return {t,nav,sig,all:t+nav+sig};
}
const netRate=()=>incRate()-G.upk;
const navActive=()=>G.up.nav>=1&&G.navOn;
// sell one truck of a route: one waiting in a building first, then one queued to leave, otherwise one on the road (its load is lost)
function sellTruck(r){
  if(r.trucks<=0)return 0;
  let v=null;
  for(const b of W.bld){const x=b.inside.find(u=>u.route===r);if(x){v=x;b.inside.splice(b.inside.indexOf(x),1);break;}}
  if(!v)for(const L of W.links){const x=L.spawnQ.find(u=>u.route===r);if(x){v=x;L.spawnQ.splice(L.spawnQ.indexOf(x),1);break;}}
  if(!v){v=trucks.filter(u=>u.route===r&&u.lane).sort((a,b)=>a.cargo-b.cargo)[0];if(v)detach(v);}
  if(!v)return 0;
  trucks.splice(trucks.indexOf(v),1);r.trucks--;
  const refund=Math.round(truckCost(r)*0.5*(trucks.length?1:0));G.money+=refund;return refund;
}
// special orders: every few minutes one route gets a rush job (10% above its recent pace, 3 minutes)
function updContract(){
  const c=G.con,o=G.offer;
  if(c){
    if(c.got>=c.need){G.money+=c.reward;G.conDone++;G.con=null;G.conNext=G.time+120;notify('特別注文を達成！ +¥'+Math.round(c.reward).toLocaleString('ja-JP'));fx('win');}
    else if(G.time>=c.tEnd){const pen=Math.round(c.reward*0.25);charge(pen);G.con=null;G.conNext=G.time+120;notify('特別注文に間に合いませんでした（違約金 ¥'+pen.toLocaleString('ja-JP')+'）');fx('fail');}
    return;
  }
  if(o){if(G.time>=o.tOffer){G.offer=null;G.conNext=G.time+90;}return;}
  if(G.time<G.conNext)return;
  const rs=W.routes.filter(r=>UNLOCK[r.chain]<=G.delivered&&r.trucks>0);
  if(rs.length<2||G.delivered<40){G.conNext=G.time+30;return;}
  const r=rs[Math.floor(grand()*rs.length)];while(r.log.length&&r.log[0]<G.time-120)r.log.shift();
  const need=Math.max(5,Math.ceil(r.log.length*1.5*1.1));
  G.offer={r:r.i,need,got:0,tOffer:G.time+30,reward:need*payOf(r)*1.5};
  notify('特別注文の依頼: '+r.src.name+'→'+r.dst.name+' を3分で'+need+'回');fx('order');
}
function acceptOffer(){const o=G.offer;if(!o)return;G.offer=null;o.tEnd=G.time+180;G.con=o;}
function declineOffer(){if(!G.offer)return;G.offer=null;G.conNext=G.time+90;}
// money that may push into debt: capped like upkeep so the game can always recover
function charge(a){const floor=-Math.max(100,G.upk*2);G.money=Math.max(Math.min(G.money,floor),G.money-a);}
/* ---------- events: road works, accidents, fuel prices, good harvests ---------- */
const EV_GAP=[120,220];
function busyEdges(){
  const out=[];for(const e of W.edges){if(e[0].type==='lot'||e[1].type==='lot'||e.works)continue;let c=0;for(const L of W.link[e[0].id+'>'+e[1].id].concat(W.link[e[1].id+'>'+e[0].id]))c+=L.vehicles.length;if(c>0)out.push(e);}
  return out;
}
function startEvent(type){
  const pick=a=>a[Math.floor(grand()*a.length)];
  if(type==='works'){
    const es=busyEdges();if(!es.length)return false;const e=pick(es);e.works=G.time+180;
    G.ev.push({type,e,tEnd:e.works});notify('🚧 道路工事が始まりました（3分間 徐行）');return true;
  }
  if(type==='crash'){
    const ls=W.links.filter(L=>L.len>45&&!L.block&&L.from.type!=='lot'&&L.to.type!=='lot'&&L.vehicles.length);if(!ls.length)return false;

    ctx.fillStyle='#ff8a00';for(let t=TRIM+6;t<l-TRIM;t+=14){ctx.beginPath();ctx.arc(a.x+ux*t,a.y+uy*t,1.4,0,TAU);ctx.fill();}
    ctx.lineCap='round';
  }
  if(showJam){
    ctx.lineCap='butt';ctx.lineWidth=4.2;
    for(const L of W.links){if(L.jam<0.12)continue;ctx.strokeStyle='rgba(255,'+Math.round(150-L.jam*130)+',40,'+(0.25+L.jam*0.5).toFixed(2)+')';ctx.beginPath();ctx.moveTo(L.pts[0][0],L.pts[0][1]);ctx.lineTo(L.pts[1][0],L.pts[1][1]);ctx.stroke();}
    ctx.lineCap='round';
  }
  // trucks
  for(const v of trucks){
    if(!v.lane)continue;
    const f=posBack(v,0),r=posBack(v,v.len);
    if(v.lat&&v.lane.kind==='link'){const dr=v.lane.dir;f[0]+=dr[1]*v.lat*0.6;f[1]-=dr[0]*v.lat*0.6;r[0]+=dr[1]*v.lat;r[1]-=dr[0]*v.lat;}
    const a=Math.atan2(f[1]-r[1],f[0]-r[0]);
    ctx.save();ctx.translate((f[0]+r[0])/2,(f[1]+r[1])/2);ctx.rotate(a);
    ctx.fillStyle='rgba(0,0,0,.22)';rr(-v.len/2+.5,-1.4,v.len,3.9,0.9);ctx.fill();
    ctx.fillStyle=v.route.color;rr(-v.len/2,-1.95,v.len,3.9,0.9);ctx.fill();
    ctx.fillStyle='#2b2f36';rr(v.len/2-2.3,-1.95,2.3,3.9,0.8);ctx.fill();
    if(v.cargo){ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(-v.len/2+0.8,-1.25,4.6,2.5);}
    if(v.brake||v.v<0.2){ctx.fillStyle='#ff3b30';ctx.fillRect(-v.len/2-0.1,-1.8,0.6,3.6);}
    if((Math.abs(v.lat)>0.3||v.wantT)&&(G.time*3%1)<0.6){const sg=v.lat?Math.sign(v.lat):(v.wantT.li<v.lane.li?-1:1);ctx.fillStyle='#ffb020';ctx.fillRect(v.len/2-1.1,sg*1.95-0.45,1.1,0.9);ctx.fillRect(-v.len/2,sg*1.95-0.45,1.1,0.9);}
    ctx.restore();
  }
  for(const ev of G.ev){
    if(ev.type!=='crash')continue;const L=ev.L,bl=L.block;if(!bl)continue;
    const f=lanePt(L,bl.s),r=lanePt(L,bl.s-bl.len),ang=Math.atan2(f[1]-r[1],f[0]-r[0]);
    ctx.save();ctx.translate((f[0]+r[0])/2,(f[1]+r[1])/2);ctx.rotate(ang+0.35);
    ctx.fillStyle='#55585e';ctx.fillRect(-4.2,-2,8.4,4);ctx.restore();
    const pulse=0.5+0.5*Math.sin(G.time*6);
    ctx.fillStyle='rgba(230,50,40,'+(0.25+0.3*pulse).toFixed(2)+')';ctx.beginPath();ctx.arc((f[0]+r[0])/2,(f[1]+r[1])/2,9,0,TAU);ctx.fill();
    ctx.fillStyle='#e63228';ctx.beginPath();ctx.arc((f[0]+r[0])/2,(f[1]+r[1])/2-9,4.2,0,TAU);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 6px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',(f[0]+r[0])/2,(f[1]+r[1])/2-8.8);
  }
  // crowded corners (deliberate from town Lv2)
  for(const [A,B] of W.hot||[]){
    const xs=[A.node.x,B.node.x,A.grid.x,B.grid.x],ys=[A.node.y,B.node.y,A.grid.y,B.grid.y];
    const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,rx=(Math.max(...xs)-Math.min(...xs))/2+34,ry=(Math.max(...ys)-Math.min(...ys))/2+34;
    ctx.setLineDash([6,5]);ctx.lineWidth=2;ctx.strokeStyle='rgba(230,120,20,.8)';ctx.fillStyle='rgba(255,170,60,.10)';
    ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,TAU);ctx.fill();ctx.stroke();ctx.setLineDash([]);
    ctx.font='bold 9px system-ui,sans-serif';ctx.fillStyle='rgba(190,90,10,.95)';ctx.textAlign='center';ctx.fillText('⚠ 密集地帯',cx,cy-ry-5);
  }
  // buildings
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const b of W.bld){
    const r=W.routes.find(x=>x.src===b||x.dst===b),locked=r&&UNLOCK[r.chain]>G.delivered;
    ctx.globalAlpha=locked?0.35:1;
    ctx.fillStyle='rgba(0,0,0,.18)';rr(b.node.x-17,b.node.y-15,36,36,7);ctx.fill();
    ctx.fillStyle=b.col;rr(b.node.x-18,b.node.y-18,36,36,7);ctx.fill();
    ctx.strokeStyle=b.yard?'#2f6f4f':'#fffdf6';ctx.lineWidth=b.yard?2.6:1.6;ctx.stroke();
    if(b.yard){ctx.fillStyle='#2f6f4f';ctx.beginPath();ctx.arc(b.node.x-17,b.node.y-17,6,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 7px system-ui';ctx.fillText('P',b.node.x-17,b.node.y-16.6);}
    ctx.font='17px sans-serif';ctx.fillStyle='#000';ctx.fillText(b.icon,b.node.x,b.node.y-2);
    ctx.font='bold 8px system-ui,sans-serif';ctx.fillStyle='#fff';
    ctx.fillText(b.mix?b.name:b.name+(b.fac?' 在庫'+b.stock:''),b.node.x,b.node.y+12.5);
    if(b.mix){const t=b.mix.map(k=>MAT_NAME[k]+b.mat[k]).join(' ');ctx.fillStyle='rgba(43,47,54,.85)';const w=ctx.measureText(t).width+8;rr(b.node.x-w/2,b.node.y+19,w,11,4);ctx.fill();ctx.fillStyle=b.mix.some(k=>b.mat[k]<1)?'#ffb4a8':'#fff';ctx.fillText(t,b.node.x,b.node.y+24.8);}
    if(b.inside.length){ctx.fillStyle='#2b2f36';ctx.beginPath();ctx.arc(b.node.x+17,b.node.y-17,6.5,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 7.5px system-ui';ctx.fillText(b.inside.length,b.node.x+17,b.node.y-16.6);}
    ctx.globalAlpha=1;
  }
}

let AC=null,lastDing=0;
function tone(f,d,type,vol,f2,delay){
  if(G.mute||!AC)return;
  try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}
}

const ptrs=new Map();let moved=0,pinch0=0;
const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1;};
const clampZ=z=>Math.max(0.3,Math.min(8,z));
function pDown(id,x,y){ptrs.set(id,[x,y]);moved=0;hideMenu();if(ptrs.size===2)pinch0=pdist();cv.style.cursor='grabbing';}
function pMove(id,x,y){
  const p=ptrs.get(id);if(!p)return;const dx=x-p[0],dy=y-p[1];ptrs.set(id,[x,y]);
  if(ptrs.size===1){cam.x-=dx/cam.z;cam.y-=dy/cam.z;moved+=Math.abs(dx)+Math.abs(dy);}
  else if(ptrs.size===2){const d=pdist();cam.z=clampZ(cam.z*d/pinch0);pinch0=d;moved=99;}
}
function pUp(id,x,y,cancel){
  if(!ptrs.has(id))return;
  if(!cancel&&ptrs.size===1&&moved<6){
    const w=toWorld(x,y);let best=null,bd=26;
    const hb=W.bld.find(b=>Math.abs(b.node.x-w[0])<19&&Math.abs(b.node.y-w[1])<19);
    if(hb){openBldMenu(hb,x,y);ptrs.delete(id);if(!ptrs.size)cv.style.cursor='grab';return;}
    for(const n of W.nodes){if(n.type!=='junction')continue;const d=Math.hypot(n.x-w[0],n.y-w[1]);if(d<bd){bd=d;best=n;}}
    if(best)openMenu(best);
    else{
      let be=null,ed=12;
      for(const e2 of W.edges){
        const a=e2[0],b=e2[1];if(a.type==='lot'||b.type==='lot')continue;
        const dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((w[0]-a.x)*dx+(w[1]-a.y)*dy)/(dx*dx+dy*dy))),d=Math.hypot(a.x+dx*t-w[0],a.y+dy*t-w[1]);
        if(d<ed){ed=d;be=e2;}
      }
      if(be)openRoadMenu(be,x,y);
      else{
        let bc=null,cd=12;
        for(const c of W.cand){
          if(c.built)continue;const a=c.a,b=c.b,dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((w[0]-a.x)*dx+(w[1]-a.y)*dy)/(dx*dx+dy*dy))),d=Math.hypot(a.x+dx*t-w[0],a.y+dy*t-w[1]);
          if(d<cd){cd=d;bc=c;}
        }
        if(bc)openBuildMenu(bc,x,y);
      }
    }
  }
  ptrs.delete(id);if(!ptrs.size)cv.style.cursor='grab';
}

cv.addEventListener('wheel',e=>{e.preventDefault();const w=toWorld(e.clientX,e.clientY),z=Math.max(0.3,Math.min(8,cam.z*Math.exp(-e.deltaY*0.0015)));cam.z=z;cam.x=w[0]-(e.clientX-cw/2)/z;cam.y=w[1]-(e.clientY-ch/2)/z;hideMenu();},{passive:false});
function speedUI(){for(const b of $('speed').children)b.classList.toggle('on',+b.dataset.s===G.speed);$('spdBtn').textContent=G.speed?'▶ '+G.speed+'×':'⏸ 停止中';$('spdBtn').parentNode.classList.toggle('red',!G.speed);}
let lastSpeed=1;
function setSpeed(v){if(G.speed)lastSpeed=G.speed;G.speed=v;speedUI();}
$('speed').addEventListener('click',e=>{const s=e.target.dataset.s;if(s===undefined)return;setSpeed(+s);$('spdDD').classList.remove('open');});
for(const id of ['spdDD','viewDD'])$(id).querySelector('.ddb').addEventListener('click',e=>{const d=$(id),o=!d.classList.contains('open');for(const x of document.querySelectorAll('.dd'))x.classList.remove('open');d.classList.toggle('open',o);hideMenu();});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.dd'))for(const x of document.querySelectorAll('.dd'))x.classList.remove('open');});
let resetArm=0;
$('reset').onclick=()=>{
  if(Date.now()-resetArm<4000){try{localStorage.removeItem(KEY);}catch(e){}newGame((Math.random()*1e9)|0);buildPanel();fit();refresh();$('reset').textContent='最初からやり直す';resetArm=0;speedUI();}
  else{resetArm=Date.now();$('reset').textContent='本当に？ 名声も目標も消えます（もう一度押す）';}
};
window.addEventListener('resize',()=>{resize();});

/* ================= boot ================= */
let sv=null;try{sv=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
const QS=new URLSearchParams(location.search),qTown=QS.get('town'),qLv=Math.max(0,Math.min(9,parseInt(QS.get('lv')||'0',10)||0));
try{if(sv&&typeof sv.seed==='number')newGame(sv.seed,sv);else newGame((Math.random()*1e9)|0);}catch(e){newGame((Math.random()*1e9)|0);}
resize();fit();buildPanel();refresh();
if(qTown!==null&&/^\d{1,10}$/.test(qTown)){
  const seed=+qTown,clean=()=>{try{history.replaceState(null,'',location.pathname);}catch(e){}};
  if(sv&&sv.seed===seed&&(sv.lv|0)===qLv)clean();
  else modal('<h3>共有された町で遊びますか？</h3><div>町Lv'+(qLv+1)+'（番号 '+seed+'）を最初から始めます。'+(sv?'<br><b>今遊んでいる町の進行は消えます。</b>名声と目標はリセットされ、記録は残ります。':'')+'</div><div class="btns"><button data-go>この町で遊ぶ</button><button class="sub" data-close>今の町を続ける</button></div>',
    m=>{m.querySelector('[data-go]').onclick=()=>{startRun(seed,qLv);closeModal();clean();};
        m.querySelector('[data-close]').addEventListener('click',clean);});
}
let lastT=performance.now(),acc=0,uiT=0,saveT=0;
function frame(t){
  requestAnimationFrame(frame); // scheduled first so one bad frame can never stop the game
  const real=Math.min(0.1,(t-lastT)/1000);lastT=t;acc+=real*G.speed;
  let n=0;const t0=performance.now();while(acc>=DT&&n<12&&performance.now()-t0<30){step(DT);acc-=DT;n++;} // high speeds: as many steps as fit in the frame
  if(acc>=DT)acc=0;
  draw();
  uiT+=real;if(uiT>0.25){uiT=0;refresh();}
  saveT+=real;if(saveT>10){saveT=0;save();}
}
requestAnimationFrame(frame);
}
</script>
</body>
</html>
