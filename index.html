<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>つなぎ 動画エディタ</title>
<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
[hidden]{display:none!important}
/* Layout: one-screen editor, stacked top to bottom: bar, preview stage, transport, timeline, clip inspector, add button. */
:root{
  color-scheme:dark;
  --bg:#12171d; --panel:#1a2129; --panel-2:#232c36; --line:#313c48;
  --fg:#e9eef2; --muted:#93a1ae;
  --accent:#f0b03c; --on-accent:#1c1404;
  --clip-video:#2f8f8a; --clip-image:#7a6fc4; --on-clip:#ffffff;
  --danger:#e8705f; --letterbox:#000;
  --ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#eef1f3; --panel:#ffffff; --panel-2:#e3e8ec; --line:#c9d1d8;
  --fg:#18212a; --muted:#5b6975;
  --accent:#b97a08; --on-accent:#ffffff;
  --clip-video:#23807b; --clip-image:#6a5fb8; --on-clip:#ffffff;
  --danger:#c2412f; --letterbox:#000;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef1f3; --panel:#ffffff; --panel-2:#e3e8ec; --line:#c9d1d8;
  --fg:#18212a; --muted:#5b6975;
  --accent:#b97a08; --on-accent:#ffffff;
  --clip-video:#23807b; --clip-image:#6a5fb8; --on-clip:#ffffff;
  --danger:#c2412f; --letterbox:#000;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--ui);overscroll-behavior:none}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;min-height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:700}
button.danger{color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 8px}
svg{width:18px;height:18px;fill:currentColor;flex:none}

.app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;padding:8px 16px}
.brand{font-weight:800;font-size:18px;letter-spacing:.08em;margin-right:auto}
.brand small{font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-left:6px}
.stage{flex:1;min-height:120px;display:flex;align-items:center;justify-content:center;padding:4px 16px;overflow:hidden}
#preview{background:var(--letterbox);border-radius:6px;display:block}
.transport{display:flex;align-items:center;gap:8px;padding:8px 16px}
#playBtn{min-width:92px}
.tc{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;margin-right:auto}
.tc b{color:var(--fg);font-weight:600}
.zoom{min-width:40px;padding:0;font-size:18px}

.tl-scroll{overflow-x:auto;overflow-y:hidden;background:var(--panel);border-block:1px solid var(--line)}
.tl-inner{position:relative;padding:0 16px;min-width:100%}
.ruler{height:30px;position:relative;touch-action:none;cursor:ew-resize;border-bottom:1px solid var(--line)}
.ruler span{position:absolute;top:0;height:100%;border-left:1px solid var(--line);padding:6px 0 0 4px;font:11px var(--mono);color:var(--muted);pointer-events:none;user-select:none}
.track{display:flex;height:64px;padding:6px 0;position:relative}
.clip{height:100%;flex:none;border:0;border-radius:6px;min-height:0;padding:0;overflow:hidden;position:relative;background-color:var(--clip-video);background-size:auto 100%;background-repeat:repeat-x;color:var(--on-clip);box-shadow:inset 0 0 0 1px var(--panel);justify-content:flex-start;align-items:flex-end}
.clip.image{background-color:var(--clip-image)}
.clip span{font-size:11px;line-height:1.3;padding:1px 5px;background:rgba(0,0,0,.55);border-radius:0 4px 0 0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.clip.sel{box-shadow:inset 0 0 0 3px var(--accent)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;margin-left:-1px}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top:8px solid var(--accent)}

.inspector{padding:10px 16px;min-height:150px;display:flex;flex-direction:column;gap:8px}
.inspector .hint{color:var(--muted);margin:auto 0}
.insp-head{display:flex;gap:8px;align-items:baseline}
.insp-head b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp-head span{color:var(--muted);font:12px var(--mono);font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.slider{display:grid;grid-template-columns:4.5em 1fr 4em;align-items:center;gap:8px}
.slider output{font:12px var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);min-height:28px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.actions button{flex:1 1 auto;padding:0 10px}
.footer{padding:4px 16px 12px}
.footer button{width:100%;min-height:46px;font-weight:700}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(420px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:17px;text-wrap:balance}
.sheet p{margin:0;color:var(--muted);font-size:13px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row>*{flex:1}
.sheet label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.sheet video{width:100%;max-height:45vh;background:var(--letterbox);border-radius:8px}
progress{width:100%;height:10px;accent-color:var(--accent)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:420px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:20;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">つなぎ<small>動画エディタ</small></div>
    <select id="aspect" aria-label="画面の比率">
      <option value="9:16">縦 9:16</option>
      <option value="16:9">横 16:9</option>
      <option value="1:1">正方形 1:1</option>
    </select>
    <button id="exportBtn" class="primary">書き出す</button>
  </header>

  <div class="stage" id="stage"><canvas id="preview" width="720" height="1280"></canvas></div>

  <div class="transport">
    <button id="playBtn" aria-label="再生"></button>
    <div class="tc"><b id="tcNow">0:00.0</b> / <span id="tcTotal">0:00.0</span></div>
    <button id="zoomOut" class="zoom" aria-label="タイムラインを縮小">−</button>
    <button id="zoomIn" class="zoom" aria-label="タイムラインを拡大">＋</button>
  </div>

  <div class="tl-scroll" id="tlScroll">
    <div class="tl-inner" id="tlInner">
      <div class="ruler" id="ruler"></div>
      <div class="track" id="track"></div>
      <div class="playhead" id="playhead"></div>
    </div>
  </div>

  <div class="inspector" id="inspector"></div>

  <div class="footer">
    <button id="addBtn">＋ 動画・写真を追加</button>
    <input id="fileInput" type="file" accept="video/*,image/*" multiple hidden>
  </div>
</div>

<div class="overlay" id="exportOverlay" hidden>
  <div class="sheet">
    <div id="exSetup">
      <div class="sheet" style="border:0;padding:0;width:auto">
        <h2>MP4に書き出す</h2>
        <label>画質
          <select id="exQuality">
            <option value="720">標準 (720p)</option>
            <option value="1080">高画質 (1080p)</option>
          </select>
        </label>
        <p>書き出し中はこの画面を開いたままにしてください。動画はこの端末の中だけで処理され、どこにも送信されません。</p>
        <div class="row"><button id="exCancel">やめる</button><button id="exStart" class="primary">書き出し開始</button></div>
      </div>
    </div>
    <div id="exProgress" hidden>
      <div class="sheet" style="border:0;padding:0;width:auto">
        <h2>書き出し中</h2>
        <progress id="exBar" max="1" value="0"></progress>
        <p id="exStatus">準備中</p>
        <div class="row"><button id="exAbort">中止</button></div>
      </div>
    </div>
    <div id="exDone" hidden>
      <div class="sheet" style="border:0;padding:0;width:auto">
        <h2>書き出しが終わりました</h2>
        <video id="exVideo" controls playsinline></video>
        <p id="exInfo"></p>
        <div class="row"><button id="exClose">閉じる</button><button id="exShare" hidden>共有</button><button id="exSave" class="primary">保存</button></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

    box.appendChild(sliderRow('imgDur', '表示時間', 0.5, 15, c.dur, v => { c.dur = v; changed(clipStart(c)); return v; }));
  }
  const acts = document.createElement('div'); acts.className = 'actions';
  const idx = state.clips.indexOf(c);
  const btn = (label, fn, opt = {}) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; if (opt.disabled) b.disabled = true; if (opt.cls) b.className = opt.cls; acts.appendChild(b); };
  const move = d => { const j = idx + d; state.clips.splice(idx, 1); state.clips.splice(j, 0, c); renderAll(); setTime(clipStart(c)); };
  btn('◁ 前へ', () => move(-1), { disabled: idx === 0 });
  btn('後ろへ ▷', () => move(1), { disabled: idx === state.clips.length - 1 });
  btn('ここで分割', () => {
    const local = state.t - clipStart(c);
    if (local < MIN_DUR || local > c.dur - MIN_DUR) return toast('再生位置(黄色の線)をこのクリップの途中に合わせてから分割してください。');
    const b2 = { ...c, id: uid++, in: c.in + local, dur: c.dur - local }; c.dur = local;
    state.clips.splice(idx + 1, 0, b2); state.sel = b2; renderAll(); syncPaused();
  });
  btn('複製', () => { const b2 = { ...c, id: uid++ }; state.clips.splice(idx + 1, 0, b2); state.sel = b2; renderAll(); setTime(clipStart(b2)); });
  btn(c.fit === 'cover' ? '全体を表示' : '画面いっぱい', () => { c.fit = c.fit === 'cover' ? 'contain' : 'cover'; renderInspector(); drawPreview(); });
  btn('削除', () => { if (state.playing) pause(); state.clips.splice(idx, 1); state.sel = null; renderAll(); setTime(state.t); }, { cls: 'danger' });
  box.appendChild(acts);
}

/* ---------- export ---------- */
let abortExport = false, resultBlob = null, resultName = '', downloads = null;
async function pickVideoConfig(W, H, bitrate) {
  const cands = [['avc', 'avc1.640028'], ['avc', 'avc1.4d0028'], ['avc', 'avc1.42e028'], ['avc', 'avc1.42001f'], ['vp9', 'vp09.00.40.08'], ['av1', 'av01.0.08M.08']];
  for (const [mux, codec] of cands) {
    const cfg = { codec, width: W, height: H, bitrate, framerate: FPS };
    if (mux === 'avc') cfg.avc = { format: 'avc' };
    try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) return { mux, cfg }; } catch (e) {}
  }
  return null;
}
async function pickAudioConfig() {
  if (!('AudioEncoder' in window)) return null;
  for (const [mux, codec] of [['aac', 'mp4a.40.2'], ['opus', 'opus']]) {
    const cfg = { codec, sampleRate: 48000, numberOfChannels: 2, bitrate: 128000 };
    try { if ((await AudioEncoder.isConfigSupported(cfg)).supported) return { mux, cfg }; } catch (e) {}
  }
  return null;
}
async function buildAudio() {
  if (!state.clips.some(c => c.media.kind === 'video')) return null;
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext; if (!OAC) return null;
  const sr = 48000, off = new OAC(2, Math.ceil(total() * sr), sr);
  let any = false, start = 0;
  for (const c of state.clips) {
    const m = c.media;
    if (m.kind === 'video') {
      if (m.audio === undefined) {
        m.audio = null;
        if (m.file.size < 400 * 1024 * 1024) { try { m.audio = await off.decodeAudioData(await m.file.arrayBuffer()); } catch (e) {} }
      }
      if (m.audio) { const s = off.createBufferSource(); s.buffer = m.audio; s.connect(off.destination); s.start(start, c.in, c.dur); any = true; }
    }
    start += c.dur;
  }
  return any ? await off.startRendering() : null;
}
function showStep(id) { for (const s of ['exSetup', 'exProgress', 'exDone']) $(s).hidden = s !== id; }
async function runExport() {
  if (!('VideoEncoder' in window)) { toast('このブラウザは書き出しに対応していません。最新のChromeかSafariでお試しください。'); return; }
  if (state.playing) pause();
  exporting = true; abortExport = false; showStep('exProgress');
  const status = s => $('exStatus').textContent = s, bar = $('exBar'); bar.value = 0;
  let lock = null, encErr = null, venc = null, aenc = null;
  try { lock = await navigator.wakeLock?.request('screen'); } catch (e) {}
  try {
    const short = +$('exQuality').value, [W, H] = dims(short);
    const vpick = await pickVideoConfig(W, H, short >= 1080 ? 8e6 : 5e6);
    if (!vpick) throw new Error('この端末ではこの画質で書き出せません。標準 (720p) でお試しください。');
    status('音声を準備中');
    let audio = null, apick = await pickAudioConfig();
    if (apick) audio = await buildAudio();
    const tot = total(), N = Math.max(1, Math.round(tot * FPS));
    const muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(), fastStart: 'in-memory',
      video: { codec: vpick.mux, width: W, height: H, frameRate: FPS },
      audio: audio ? { codec: apick.mux, numberOfChannels: 2, sampleRate: 48000 } : undefined,
    });
    venc = new VideoEncoder({ output: (ch, meta) => muxer.addVideoChunk(ch, meta), error: e => encErr = e });
    venc.configure(vpick.cfg);
    const ec = document.createElement('canvas'); ec.width = W; ec.height = H;
    const ex = ec.getContext('2d');
    for (let i = 0; i < N; i++) {
      if (abortExport) throw new Error('abort');
      if (encErr) throw encErr;
      const loc = locate(i / FPS);
      if (loc.clip.media.kind === 'video') await seek(loc.clip.media.el, Math.min(loc.clip.in + loc.local, loc.clip.media.duration - 0.01));
      draw(ex, W, H, loc);
      const frame = new VideoFrame(ec, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      venc.encode(frame, { keyFrame: i % (FPS * 2) === 0 }); frame.close();
      while (venc.encodeQueueSize > 4) await sleep(4);
      if (i % 5 === 0) { bar.value = i / N * (audio ? 0.95 : 1); status('映像を書き出し中 ' + Math.round(i / N * 100) + '%'); await sleep(0); }
    }
    await venc.flush();
    if (encErr) throw encErr;
    if (audio) {
      status('音声を書き出し中');
      aenc = new AudioEncoder({ output: (ch, meta) => muxer.addAudioChunk(ch, meta), error: e => encErr = e });
      aenc.configure(apick.cfg);
      const L = audio.getChannelData(0), R = audio.numberOfChannels > 1 ? audio.getChannelData(1) : L, len = audio.length, CH = 4800;
      for (let o = 0; o < len; o += CH) {
        if (abortExport) throw new Error('abort');
        const n = Math.min(CH, len - o), data = new Float32Array(n * 2);
        data.set(L.subarray(o, o + n), 0); data.set(R.subarray(o, o + n), n);
        const ad = new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(o / 48000 * 1e6), data });
        aenc.encode(ad); ad.close();
        if (aenc.encodeQueueSize > 20) await sleep(2);
      }
      await aenc.flush();
      if (encErr) throw encErr;
    }
    muxer.finalize(); bar.value = 1;
    resultBlob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
    const d = new Date(), p = n => String(n).padStart(2, '0');
    resultName = 'tsunagi-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '.mp4';
    const v = $('exVideo'); if (v.src) URL.revokeObjectURL(v.src); v.src = URL.createObjectURL(resultBlob);
    $('exInfo').textContent = W + '×' + H + ' / ' + fmt(tot) + ' / ' + (resultBlob.size / 1048576).toFixed(1) + 'MB' + (audio ? '' : ' / 音声なし') + (vpick.mux !== 'avc' ? ' / この端末はH.264非対応のため' + vpick.mux.toUpperCase() + 'で保存しました' : '');
    let canShare = false;
    try { canShare = !downloads && !!navigator.canShare && navigator.canShare({ files: [new File([resultBlob], resultName, { type: 'video/mp4' })] }); } catch (e) {}
    $('exShare').hidden = !canShare;
    showStep('exDone');
  } catch (e) {
    $('exportOverlay').hidden = true;
    if (e.message !== 'abort') toast('書き出しに失敗しました: ' + (e.message || e));
  } finally {
    try { if (venc && venc.state !== 'closed') venc.close(); } catch (e) {}
    try { if (aenc && aenc.state !== 'closed') aenc.close(); } catch (e) {}
    try { lock && lock.release(); } catch (e) {}
    exporting = false; syncPaused();
  }
}
async function saveResult() {
  if (!resultBlob) return;
  if (downloads) {
    try { await downloads.save({ filename: resultName, data: resultBlob }); toast('保存しました。'); }
    catch (e) { if (e && e.code !== 'declined') toast('ここでは保存できませんでした。上の動画を長押しして保存してください。'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(resultBlob); a.download = resultName;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

/* ---------- wiring ---------- */
$('playBtn').onclick = () => state.playing ? pause() : play();
$('aspect').onchange = e => { state.aspect = e.target.value; applyAspect(); };
$('zoomIn').onclick = () => { state.pps = Math.min(240, state.pps * 1.5); renderTimeline(); };
$('zoomOut').onclick = () => { state.pps = Math.max(8, state.pps / 1.5); renderTimeline(); };
$('addBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; addFiles(fs); };
$('exportBtn').onclick = () => { if (state.playing) pause(); showStep('exSetup'); $('exportOverlay').hidden = false; };
$('exCancel').onclick = $('exClose').onclick = () => { $('exVideo').pause(); $('exportOverlay').hidden = true; };
$('exStart').onclick = runExport;
$('exAbort').onclick = () => abortExport = true;
$('exSave').onclick = saveResult;
$('exShare').onclick = () => navigator.share({ files: [new File([resultBlob], resultName, { type: 'video/mp4' })] }).catch(() => {});
const ruler = $('ruler');
const scrub = e => { if (state.playing) pause(); setTime((e.clientX - ruler.getBoundingClientRect().left) / state.pps); };
ruler.addEventListener('pointerdown', e => { ruler.setPointerCapture(e.pointerId); scrub(e); });
ruler.addEventListener('pointermove', e => { if (ruler.hasPointerCapture(e.pointerId)) scrub(e); });
document.addEventListener('keydown', e => { if (e.code === 'Space' && !/INPUT|SELECT|BUTTON/.test(e.target.tagName)) { e.preventDefault(); state.playing ? pause() : play(); } });
new ResizeObserver(fitCanvas).observe($('stage'));
if (window.claude && window.claude.use) window.claude.use('downloads').then(d => downloads = d).catch(() => {});

state.clips = [newClip(sampleMedia('サンプル 1', '#2f8f8a', '#1d3f5e')), newClip(sampleMedia('サンプル 2', '#7a6fc4', '#c2577a'))];
$('playBtn').innerHTML = ICON.play + '再生';
applyAspect(); renderAll();
window.__tsunagi = { state, addFiles, runExport, get result() { return resultBlob; } };
})();
</script>
</body>
