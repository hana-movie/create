<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; background: linear-gradient(180deg,#bfe9ff 0%,#e8f7ff 50%,#ffe6f2 100%); color: #3d3355;
    font-family: "Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif; -webkit-tap-highlight-color: transparent;
    display: flex; flex-direction: column; align-items: center;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 16px; margin: auto 0; }
  h1 { margin: 8px 0 0; text-align: center; font-size: clamp(30px, 7vw, 46px); color: #ff6fa0; text-shadow: 0 4px 0 #fff; letter-spacing: .04em; }
  .sub { margin: 0 0 6px; text-align: center; color: #7a7396; font-size: clamp(15px, 3.6vw, 18px); }
  .card {
    display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 26px;
    background: #fff; color: inherit; text-decoration: none;
    border: 5px solid var(--c); box-shadow: 0 8px 0 var(--d); transition: transform .08s;
  }
  .card:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--d); }
  .ic { flex: none; width: 68px; height: 68px; border-radius: 20px; background: var(--c); display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  .tx { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .nm { font-size: clamp(21px, 5vw, 26px); font-weight: bold; color: var(--d); }
  .ds { font-size: clamp(13px, 3.3vw, 16px); line-height: 1.45; color: #6a6488; }
  .go { flex: none; font-size: 40px; color: var(--d); line-height: 1; }
  .back { margin-top: 22px; padding: 10px 22px; border-radius: 999px; background: #fff; color: #6a7396; text-decoration: none; font-weight: bold;
    box-shadow: 0 4px 0 #d3daea; }
</style>
</head>
